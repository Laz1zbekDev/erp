<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — O'quv Markaz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0f1117; --surface:#171b26; --surface2:#1e2333;
      --border:#ffffff0f; --border2:#ffffff18;
      --accent:#6c8ef5; --accent2:#a78bfa; --accent-glow:#6c8ef530;
      --text:#e8eaf0; --text-muted:#6b7280; --text-dim:#9ca3af;
      --success:#34d399; --warning:#fbbf24; --danger:#f87171;
      --sidebar-w:240px; --topbar-h:60px;
      --radius:10px; --radius-sm:6px;
      --mono:'JetBrains Mono',monospace; --sans:'Outfit',sans-serif;
    }
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;}
    .layout{display:flex;height:100vh;overflow:hidden;}

    /* SIDEBAR */
    .sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;scrollbar-width:none;position:relative;z-index:10;}
    .sidebar::-webkit-scrollbar{display:none;}
    .sidebar::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);}
    .logo-area{padding:22px 20px 18px;border-bottom:1px solid var(--border);flex-shrink:0;}
    .logo-circle{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;margin-bottom:10px;box-shadow:0 0 20px var(--accent-glow);}
    .logo-name{font-weight:600;font-size:15px;}
    .logo-sub{font-size:11px;color:var(--text-muted);margin-top:2px;letter-spacing:.3px;}
    .nav-section{flex:1;padding:10px 12px;}
    .nav-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-muted);padding:14px 8px 6px;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);color:var(--text-dim);text-decoration:none;font-size:13.5px;transition:background .15s,color .15s;position:relative;}
    .nav-item:hover{background:var(--surface2);color:var(--text);}
    .nav-item.active{background:var(--accent-glow);color:var(--accent);font-weight:500;}
    .nav-item.active::before{content:'';position:absolute;left:0;top:25%;bottom:25%;width:3px;border-radius:2px;background:var(--accent);}
    .nav-icon{width:16px;height:16px;flex-shrink:0;}
    .logout-area{padding:12px;border-top:1px solid var(--border);flex-shrink:0;}
    .logout-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:var(--radius-sm);background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:13.5px;font-family:var(--sans);transition:background .15s,color .15s;}
    .logout-btn:hover{background:#f8717118;color:var(--danger);}

    /* MAIN */
    .main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
    .topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;}
    .page-title{font-size:16px;font-weight:600;}
    .topbar-right{display:flex;align-items:center;gap:12px;}
    .admin-label{font-size:13px;color:var(--text-muted);}
    .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
    #content-area{flex:1;overflow-y:auto;padding:24px;scrollbar-width:thin;scrollbar-color:var(--border2) transparent;}

    /* LOADING */
    .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:300px;color:var(--text-muted);font-size:13px;}
    .spinner{width:30px;height:30px;border-radius:50%;border:2px solid var(--border2);border-top-color:var(--accent);animation:spin .7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* STAT CARDS */
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}
    @media(max-width:1100px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden;transition:border-color .2s,transform .18s;}
    .stat-card:hover{border-color:var(--border2);transform:translateY(-2px);}
    .stat-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;}
    .stat-card.c1::after{background:linear-gradient(90deg,var(--accent),var(--accent2));}
    .stat-card.c2::after{background:linear-gradient(90deg,var(--success),#6ee7b7);}
    .stat-card.c3::after{background:linear-gradient(90deg,#f472b6,var(--accent2));}
    .stat-card.c4::after{background:linear-gradient(90deg,var(--warning),#fde68a);}
    .stat-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-size:18px;}
    .stat-card.c1 .stat-icon{background:#6c8ef520;}
    .stat-card.c2 .stat-icon{background:#34d39920;}
    .stat-card.c3 .stat-icon{background:#f472b620;}
    .stat-card.c4 .stat-icon{background:#fbbf2420;}
    .stat-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);margin-bottom:6px;}
    .stat-value{font-size:30px;font-weight:700;font-family:var(--mono);line-height:1;}
    .stat-card.c4 .stat-value{color:var(--warning);}
    .stat-sub{font-size:11px;color:var(--text-muted);margin-top:5px;}

    /* TABLE */
    .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .section-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;}
    .badge-danger{background:#f8717120;color:var(--danger);font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;}
    .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
    table{width:100%;border-collapse:collapse;}
    thead th{padding:11px 16px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);background:var(--surface2);border-bottom:1px solid var(--border);white-space:nowrap;}
    tbody tr{border-bottom:1px solid var(--border);transition:background .12s,opacity .3s;}
    tbody tr:last-child{border-bottom:none;}
    tbody tr:hover{background:var(--surface2);}
    tbody tr.row-warn{background:#fbbf2406;}
    tbody tr.row-warn:hover{background:#fbbf2410;}
    tbody tr.row-danger{background:#f8717106;}
    tbody tr.row-danger:hover{background:#f8717112;}
    td{padding:13px 16px;vertical-align:middle;}
    .student-link{color:var(--accent);text-decoration:none;font-weight:500;font-size:13.5px;transition:color .15s;}
    .student-link:hover{color:var(--accent2);text-decoration:underline;}
    .group-link{color:var(--text-dim);text-decoration:none;font-size:13px;transition:color .15s;}
    .group-link:hover{color:var(--text);text-decoration:underline;}
    .contact-cell{font-size:12.5px;line-height:1.8;}
    .ct1{color:var(--text);font-family:var(--mono);}
    .ct2{color:var(--text-muted);font-family:var(--mono);font-size:11.5px;}
    .days-badge{display:inline-flex;align-items:center;justify-content:center;min-width:52px;padding:3px 10px;border-radius:20px;font-family:var(--mono);font-size:12px;font-weight:600;white-space:nowrap;}
    .days-ok{background:#34d39918;color:var(--success);}
    .days-warn{background:#fbbf2418;color:var(--warning);}
    .days-danger{background:#f8717118;color:var(--danger);}

    /* PENDING */
    .pending-cell{display:flex;align-items:center;gap:6px;}
    .pending-input{width:64px;padding:5px 8px;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:12px;outline:none;transition:border-color .15s;-moz-appearance:textfield;}
    .pending-input::-webkit-inner-spin-button,.pending-input::-webkit-outer-spin-button{-webkit-appearance:none;}
    .pending-input:focus{border-color:var(--accent);}
    .pending-btn{padding:5px 11px;border-radius:var(--radius-sm);background:var(--accent-glow);border:1px solid var(--accent);color:var(--accent);font-size:12px;font-weight:500;cursor:pointer;transition:background .15s,color .15s;font-family:var(--sans);white-space:nowrap;}
    .pending-btn:hover:not(:disabled){background:var(--accent);color:#fff;}
    .pending-btn:disabled{opacity:.4;cursor:not-allowed;}

    /* PAGINATION */
    .pagination{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:14px 16px;border-top:1px solid var(--border);flex-wrap:wrap;}
    .page-info{font-size:12px;color:var(--text-muted);margin-right:auto;}
    .page-btn{display:flex;align-items:center;gap:4px;padding:6px 14px;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--border2);color:var(--text-dim);font-size:13px;font-family:var(--sans);cursor:pointer;transition:.15s;white-space:nowrap;}
    .page-btn:hover:not(:disabled){background:var(--accent-glow);border-color:var(--accent);color:var(--accent);}
    .page-btn:disabled{opacity:.35;cursor:not-allowed;}
    .page-nums{display:flex;gap:4px;}
    .page-num{width:30px;height:30px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);font-size:13px;cursor:pointer;transition:.15s;}
    .page-num.active{background:var(--accent);border-color:var(--accent);color:#fff;}
    .page-num:hover:not(.active){border-color:var(--accent);color:var(--accent);}
    .empty-row td{text-align:center;padding:48px;color:var(--text-muted);font-size:13px;}

    /* TOAST */
    #toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
    .toast{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:12px 16px;font-size:13px;color:var(--text);max-width:340px;animation:toastIn .2s ease;pointer-events:all;box-shadow:0 8px 32px #0008;}
    .toast.error{border-color:var(--danger);color:var(--danger);}
    .toast.success{border-color:var(--success);color:var(--success);}
    @keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  </style>
</head>
<body>

</html>
