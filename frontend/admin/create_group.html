    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yangi Guruh Yaratish — O'quv Markaz</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Asosiy CSS styles */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0f1117;
        --surface: #171b26;
        --surface2: #1e2333;
        --surface3: #242840;
        --border: #ffffff0f;
        --border2: #ffffff18;
        --border3: #ffffff25;
        --accent: #6c8ef5;
        --accent2: #a78bfa;
        --accent-glow: #6c8ef530;
        --text: #e8eaf0;
        --text-muted: #6b7280;
        --text-dim: #9ca3af;
        --success: #34d399;
        --warning: #fbbf24;
        --danger: #f87171;
        --sidebar-w: 240px;
        --topbar-h: 60px;
        --radius: 10px;
        --radius-sm: 6px;
        --radius-xs: 4px;
        --mono: "JetBrains Mono", monospace;
        --sans: "Outfit", sans-serif;
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 14px;
      }
      .layout {
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* SIDEBAR */
      .sidebar {
        width: var(--sidebar-w);
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        overflow-y: auto;
        scrollbar-width: none;
        position: relative;
        z-index: 10;
      }
      .sidebar::-webkit-scrollbar {
        display: none;
      }
      .sidebar::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
      }
      .logo-area {
        padding: 22px 20px 18px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .logo-circle {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 10px;
        box-shadow: 0 0 20px var(--accent-glow);
      }
      .logo-name {
        font-weight: 600;
        font-size: 15px;
      }
      .logo-sub {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 2px;
        letter-spacing: 0.3px;
      }
      .nav-section {
        flex: 1;
        padding: 10px 12px;
      }
      .nav-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--text-muted);
        padding: 14px 8px 6px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: var(--radius-sm);
        color: var(--text-dim);
        text-decoration: none;
        font-size: 13.5px;
        transition:
          background 0.15s,
          color 0.15s;
        position: relative;
      }
      .nav-item:hover {
        background: var(--surface2);
        color: var(--text);
      }
      .nav-item.active {
        background: var(--accent-glow);
        color: var(--accent);
        font-weight: 500;
      }
      .nav-item.active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 25%;
        bottom: 25%;
        width: 3px;
        border-radius: 2px;
        background: var(--accent);
      }
      .nav-icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .logout-area {
        padding: 12px;
        border-top: 1px solid var(--border);
        flex-shrink: 0;
      }
      .logout-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 10px;
        border-radius: var(--radius-sm);
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-muted);
        font-size: 13.5px;
        font-family: var(--sans);
        transition:
          background 0.15s,
          color 0.15s;
      }
      .logout-btn:hover {
        background: #f8717118;
        color: var(--danger);
      }

      /* MAIN */
      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-width: 0;
      }
      .topbar {
        height: var(--topbar-h);
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        flex-shrink: 0;
      }
      .page-title {
        font-size: 16px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .back-btn {
        color: var(--text-dim);
        text-decoration: none;
        display: flex;
        align-items: center;
        transition: 0.2s;
      }
      .back-btn:hover {
        color: var(--accent);
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .admin-label {
        font-size: 13px;
        color: var(--text-muted);
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
      }
      #content-area {
        flex: 1;
        overflow-y: auto;
        padding: 32px 24px;
        scrollbar-width: thin;
        scrollbar-color: var(--border2) transparent;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      /* FORM CARD */
      .form-card {
        width: 100%;
        max-width: 560px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 32px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }
      .form-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 24px;
        color: var(--text);
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .full-width {
        grid-column: span 2;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .form-group label {
        font-size: 13.5px;
        color: var(--text-dim);
        font-weight: 500;
      }
      .form-group label span.required {
        color: var(--danger);
        margin-left: 3px;
      }

      .form-control {
        width: 100%;
        background: var(--surface2);
        border: 1px solid var(--border2);
        border-radius: var(--radius-sm);
        color: var(--text);
        padding: 11px 14px;
        font-family: var(--sans);
        font-size: 14px;
        outline: none;
        transition: 0.2s;
      }
      .form-control:focus {
        border-color: var(--accent);
        background: var(--surface3);
      }
      .form-control::placeholder {
        color: var(--text-muted);
      }

      .form-control.error-input {
        border-color: var(--danger);
        background: rgba(248, 113, 113, 0.05);
      }
      .form-control.error-input:focus {
        border-color: var(--danger);
      }

      .form-control[type="number"]::-webkit-inner-spin-button,
      .form-control[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      /* DROPDOWN (Teacher) */
      .custom-dropdown {
        position: relative;
        width: 100%;
      }
      .dropdown-trigger {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 11px 14px;
        background: var(--surface2);
        border: 1px solid var(--border2);
        border-radius: var(--radius-sm);
        color: var(--text-muted);
        font-size: 14px;
        cursor: pointer;
        transition: 0.2s;
        user-select: none;
      }
      .dropdown-trigger:hover,
      .custom-dropdown.active .dropdown-trigger {
        border-color: var(--accent);
      }
      .dropdown-trigger.has-value {
        color: var(--text);
      }
      .dropdown-menu {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        width: 100%;
        background: var(--surface3);
        border: 1px solid var(--border2);
        border-radius: var(--radius-sm);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        z-index: 50;
        display: none;
        flex-direction: column;
      }
      .custom-dropdown.active .dropdown-menu {
        display: flex;
      }
      .dropdown-search {
        padding: 10px;
        border-bottom: 1px solid var(--border);
      }
      .dropdown-search input {
        width: 100%;
        padding: 8px 12px;
        background: var(--surface2);
        border: 1px solid var(--border2);
        border-radius: var(--radius-xs);
        color: var(--text);
        font-family: var(--sans);
        font-size: 13px;
        outline: none;
      }
      .dropdown-search input:focus {
        border-color: var(--accent);
      }
      .dropdown-list {
        max-height: 200px;
        overflow-y: auto;
        scrollbar-width: thin;
      }
      .dropdown-item {
        padding: 10px 14px;
        font-size: 13.5px;
        color: var(--text);
        cursor: pointer;
        transition: background 0.15s;
      }
      .dropdown-item:hover {
        background: var(--accent-glow);
        color: var(--accent);
      }
      .dropdown-empty {
        padding: 12px 14px;
        font-size: 13px;
        color: var(--text-muted);
        text-align: center;
      }

      /* DAYS TOGGLE */
      .days-container {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 4px;
      }
      .day-toggle {
        cursor: pointer;
      }
      .day-toggle input {
        display: none;
      }
      .day-toggle span {
        display: inline-block;
        padding: 8px 16px;
        border-radius: var(--radius-sm);
        background: var(--surface2);
        border: 1px solid var(--border2);
        color: var(--text-dim);
        font-size: 13px;
        transition: 0.2s;
        user-select: none;
        font-weight: 500;
      }
      .day-toggle:hover span {
        border-color: var(--accent-glow);
        color: var(--text);
      }
      .day-toggle input:checked + span {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      /* ACTIONS */
      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 32px;
        border-top: 1px solid var(--border);
        padding-top: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 24px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        font-family: var(--sans);
        transition: 0.2s;
        border: none;
        text-decoration: none;
      }
      .btn-cancel {
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border2);
      }
      .btn-cancel:hover {
        background: var(--surface3);
      }
      .btn-submit {
        background: var(--accent);
        color: #fff;
      }
      .btn-submit:hover {
        background: #5a7de8;
      }

      /* TOAST & LOADER */
      #toast-container {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }
      .toast {
        background: var(--surface2);
        border: 1px solid var(--border2);
        border-radius: var(--radius);
        padding: 12px 16px;
        font-size: 13px;
        color: var(--text);
        max-width: 340px;
        animation: toastIn 0.2s ease;
        pointer-events: all;
        box-shadow: 0 8px 32px #0008;
      }
      .toast.error {
        border-color: var(--danger);
        color: var(--danger);
      }
      .toast.success {
        border-color: var(--success);
        color: var(--success);
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .global-loader-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 17, 23, 0.6);
        backdrop-filter: blur(3px);
        z-index: 100000;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .global-loader-overlay.active {
        opacity: 1;
        pointer-events: all;
      }
      .global-spinner {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: 3px solid var(--border2);
        border-top-color: var(--accent);
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

          <form class="form-card" id="create-group-form">
            <div class="form-title">Yangi Guruh Ma'lumotlari</div>

            <div class="form-grid">
              <!-- Fan nomi -->
              <div class="form-group full-width">
                <label>Fani <span class="required">*</span></label>
                <input
                  type="text"
                  id="science_name"
                  class="form-control"

                  placeholder="Mavjud fanni tanlang yoki yangisini yozing"
                  autocomplete="off"
                  maxlength="100"

                  <!-- JS renders options -->

              </div>

              <!-- Guruh nomi -->

                <label>Guruh Nomi <span class="required">*</span></label>
                <input
                  type="text"
                  id="name"
                  class="form-control"
                  placeholder="Masalan: Ingliz tili A2"
                  maxlength="100"
                />

              <!-- O'qituvchi -->

                <label>O'qituvchi <span class="required">*</span></label>
                <div class="custom-dropdown" id="teacher-dropdown">

                    class="dropdown-trigger"
                    onclick="toggleDropdown('teacher-dropdown')"
                  >
                    <span id="teacher-trigger-text"

                        d="M4 6l4 4 4-4"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </div>
                  <div class="dropdown-menu">
                    <div class="dropdown-search">

                        type="text"
                        placeholder="Qidirish..."
                        onkeyup="filterDropdownList('teacher-list', this.value)"

                    </div>
                    <div class="dropdown-list" id="teacher-list">
                      <div class="dropdown-empty">Yuklanmoqda...</div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Oylik Narxi -->
              <div class="form-group">
                <label
                  >Oylik Narxi (so'm) <span class="required">*</span></label
                >
                <input
                  type="number"
                  id="price"
                  class="form-control"
                  placeholder="Masalan: 300000"
                  min="0"
                  step="1000"
                />
              </div>

              <!-- O'qituvchi ulushi -->
              <div class="form-group">
                <label
                  >O'qituvchi ulushi (%) <span class="required">*</span></label
                >
                <input
                  type="number"
                  id="teacher_percent"
                  class="form-control"
                  placeholder="0-100 oralig'ida"
                  min="0"
                  max="100"
                />
              </div>

              <!-- Kunlari -->
              <div class="form-group full-width">
                <label>Dars Kunlari <span class="required">*</span></label>
                <div class="days-container">
                  <label class="day-toggle"
                    ><input type="checkbox" value="Dushanba" /><span
                      >Dushanba</span
                    ></label
                  >
                  <label class="day-toggle"
                    ><input type="checkbox" value="Seshanba" /><span
                      >Seshanba</span
                    ></label
                  >
                  <label class="day-toggle"
                    ><input type="checkbox" value="Chorshanba" /><span
                      >Chorshanba</span
                    ></label
                  >
                  <label class="day-toggle"
                    ><input type="checkbox" value="Payshanba" /><span
                      >Payshanba</span
                    ></label
                  >
                  <label class="day-toggle"
                    ><input type="checkbox" value="Juma" /><span
                      >Juma</span
                    ></label
                  >
                  <label class="day-toggle"
                    ><input type="checkbox" value="Shanba" /><span
                      >Shanba</span
                    ></label
                  >
                  <label class="day-toggle"
                    ><input type="checkbox" value="Yakshanba" /><span
                      >Yakshanba</span
                    ></label
                  >
                </div>
              </div>

              <!-- Vaqti -->
              <div class="form-group">
                <label>Dars Vaqti <span class="required">*</span></label>
                <input
                  type="text"
                  id="class_date"
                  class="form-control"
                  placeholder="HH:MM (Masalan: 14:30)"
                  maxlength="5"
                  oninput="formatTimeInput(this)"
                  onchange="validateTimeInput(this)"
                  style="font-family: var(--mono)"
                />
              </div>
            </div>

            <div class="form-actions">
              <a href="group.html" class="btn btn-cancel">Bekor qilish</a>
              <button type="submit" class="btn btn-submit">
                Guruhni yaratish
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      const BASE = "http://10.13.155.23:8000/api/v1";

      // State
      let existingGroupNames = [];
      let selectedTeacherId = null;
      let allTeachers = [];
      let allSciences = [];

      // AUTH & INIT
      if (!localStorage.getItem("access_token"))
        window.location.replace("../index.html");

      const getToken = () => localStorage.getItem("access_token");
      const saveToken = (t) => localStorage.setItem("access_token", t);

      function authLogout() {
        const token = getToken();
        localStorage.clear();
        sessionStorage.clear();
        if (token) {
          fetch(`${BASE}/auth/logout`, {
            method: "POST",
            credentials: "include",
            headers: { Authorization: `Bearer ${token}` },
          }).catch(() => {});
        }
        window.location.replace("../index.html");
      }

      async function tryRefresh() {
        try {
          const r = await fetch(`${BASE}/auth/refresh`, {
            method: "POST",
            credentials: "include",
          });
          if (!r.ok) throw 0;
          const d = await r.json();
          if (d.access_token) {
            saveToken(d.access_token);
            return d.access_token;
          }
          throw 0;
        } catch {
          authLogout();
          return null;
        }
      }

      async function apiFetch(url, opts = {}) {
        const token = getToken();
        const headers = {
          "Content-Type": "application/json",
          ...(opts.headers || {}),
        };
        if (token) headers["Authorization"] = `Bearer ${token}`;
        const go = (tok) =>
          fetch(url, {
            ...opts,
            credentials: "include",
            headers: { ...headers, Authorization: `Bearer ${tok}` },
          });
        let res;
        try {
          res = await go(token);
        } catch (e) {
          toast(`Tarmoq xatoligi: ${e.message}`, "error");
          return null;
        }
        if (res.status === 401 || res.status === 403) {
          const nt = await tryRefresh();
          if (!nt) return null;
          try {
            res = await go(nt);
          } catch (e) {
            return null;
          }
          if (res.status === 401 || res.status === 403) {
            authLogout();
            return null;
          }
        }
        return res;
      }

      // UI HELPERS
      let loaderCount = 0;
      function showLoader() {
        loaderCount++;
        document.getElementById("global-loader").classList.add("active");
      }
      function hideLoader() {
        loaderCount--;
        if (loaderCount <= 0) {
          loaderCount = 0;
          document.getElementById("global-loader").classList.remove("active");
        }
      }

      function toast(msg, type = "error") {
        const c = document.getElementById("toast-container");
        const el = document.createElement("div");
        el.className = `toast ${type}`;
        el.textContent = msg;
        c.appendChild(el);
        setTimeout(() => {
          el.style.opacity = "0";
          setTimeout(() => el.remove(), 300);
        }, 3800);
      }

      function esc(s) {
        return s == null
          ? ""
          : String(s)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
      }

      // CUSTOM DROPDOWN LOGIC (Teacher)
      function toggleDropdown(id) {
        const el = document.getElementById(id);
        const isActive = el.classList.contains("active");
        document
          .querySelectorAll(".custom-dropdown")
          .forEach((d) => d.classList.remove("active"));
        if (!isActive) {
          el.classList.add("active");
          const searchInput = el.querySelector(".dropdown-search input");
          if (searchInput) searchInput.focus();
        }
      }

      document.addEventListener("click", function (event) {
        if (!event.target.closest(".custom-dropdown")) {
          document
            .querySelectorAll(".custom-dropdown")
            .forEach((d) => d.classList.remove("active"));
        }
      });

      function filterDropdownList(listId, query) {
        query = query.toLowerCase();
        const list = document.getElementById(listId);
        const items = list.querySelectorAll(
          ".dropdown-item:not(.dropdown-empty)",
        );
        let hasVisible = false;
        items.forEach((item) => {
          if (item.textContent.toLowerCase().includes(query)) {
            item.style.display = "block";
            hasVisible = true;
          } else {
            item.style.display = "none";
          }
        });
        let emptyMsg = list.querySelector(".dropdown-empty");
        if (!hasVisible) {
          if (!emptyMsg) {
            emptyMsg = document.createElement("div");
            emptyMsg.className = "dropdown-empty";
            emptyMsg.textContent = "Hech narsa topilmadi";
            list.appendChild(emptyMsg);
          }
          emptyMsg.style.display = "block";
        } else if (emptyMsg) {
          emptyMsg.style.display = "none";
        }
      }

      function selectTeacher(id, name) {
        selectedTeacherId = id;
        const trigger = document.querySelector(
          "#teacher-dropdown .dropdown-trigger",
        );
        const triggerText = document.getElementById("teacher-trigger-text");

        if (id) {
          triggerText.textContent = name;
          trigger.classList.add("has-value");
        } else {
          triggerText.textContent = "O'qituvchini tanlang...";
          trigger.classList.remove("has-value");
        }
        document.getElementById("teacher-dropdown").classList.remove("active");
      }

      // TIME MASK AND VALIDATION
      function formatTimeInput(input) {
        let val = input.value.replace(/\D/g, "");
        if (val.length >= 3) {
          val = val.substring(0, 2) + ":" + val.substring(2, 4);
        }
        input.value = val;
      }

      function validateTimeInput(input) {
        let val = input.value;
        if (val.length > 0 && val.length < 5) {
          toast("Vaqt to'liq emas (HH:MM)", "error");
          input.value = "";
        } else if (val.length === 5) {
          let parts = val.split(":");
          let h = parseInt(parts[0], 10);
          let m = parseInt(parts[1], 10);
          if (h > 23 || m > 59) {
            toast("Vaqt noto'g'ri kiritildi", "error");
            input.value = "";
          }
        }
      }

      // FETCH NECESSARY DATA ON LOAD
      async function initData() {
        showLoader();
        try {
          await Promise.all([
            fetchGroupsForUniqueness(),
            fetchSciences(),
            fetchTeachers(),
          ]);
        } finally {
          hideLoader();
        }
      }

      async function fetchGroupsForUniqueness() {
        const r = await apiFetch(`${BASE}/group/all`);
        if (r && r.ok) {
          const groups = await r.json();
          existingGroupNames = groups.map((g) => g.name.toLowerCase().trim());
        }
      }

      async function fetchSciences() {
        const r = await apiFetch(`${BASE}/group/science`);
        if (r && r.ok) {
          const data = await r.json();
          const uniqueSciences = [
            ...new Set(data.map((g) => g.science_name)),
          ].filter(Boolean);
          const datalist = document.getElementById("sciences-list");
          datalist.innerHTML = uniqueSciences
            .map((s) => `<option value="${esc(s)}">`)
            .join("");
        }
      }

      async function fetchTeachers() {
        const r = await apiFetch(`${BASE}/teacher/all`);
        if (r && r.ok) {
          allTeachers = await r.json();
          const list = document.getElementById("teacher-list");
          if (!allTeachers.length) {
            list.innerHTML =
              '<div class="dropdown-empty">O\'qituvchilar mavjud emas</div>';
            return;
          }
          let html = "";
          allTeachers.forEach((t) => {
            const name = `${t.first_name} ${t.last_name}`;
            html += `<div class="dropdown-item" onclick="selectTeacher(${t.teacher_id}, '${esc(name)}')">${esc(name)}</div>`;
          });
          list.innerHTML = html;
        }
      }

      // NAME INPUT VALIDATION (Real-time)
      document.getElementById("name").addEventListener("input", function () {
        const val = this.value.trim().toLowerCase();
        if (val && existingGroupNames.includes(val)) {
          this.classList.add("error-input");
        } else {
          this.classList.remove("error-input");
        }
      });

      // FORM SUBMIT HANDLER
      document
        .getElementById("create-group-form")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          // Validate Science
          const science_name = document
            .getElementById("science_name")
            .value.trim();
          if (!science_name)
            return toast("Fanni kiriting yoki tanlang!", "warning");

          // Validate Name
          const name = document.getElementById("name").value.trim();
          if (!name) return toast("Guruh nomini kiriting!", "warning");
          if (existingGroupNames.includes(name.toLowerCase())) {
            return toast("Bu nomdagi guruh allaqachon mavjud!", "error");
          }

          // Validate Teacher
          if (!selectedTeacherId)
            return toast("O'qituvchini tanlang!", "warning");

          // Validate Price
          const price = parseInt(document.getElementById("price").value);
          if (isNaN(price) || price < 0)
            return toast("Oylik narxni to'g'ri kiriting!", "warning");

          // Validate Percent
          const teacher_percent = parseInt(
            document.getElementById("teacher_percent").value,
          );
          if (
            isNaN(teacher_percent) ||
            teacher_percent < 0 ||
            teacher_percent > 100
          ) {
            return toast(
              "O'qituvchi ulushini 0-100 oralig'ida kiriting!",
              "warning",
            );
          }

          // Validate Days
          const checkedDays = Array.from(
            document.querySelectorAll(".day-toggle input:checked"),
          ).map((cb) => cb.value);
          if (checkedDays.length === 0)
            return toast("Kamida bitta dars kunini tanlang!", "warning");
          const class_day = checkedDays.join(", "); // Dushanba, Chorshanba, Juma

          // Validate Time
          let class_date = document.getElementById("class_date").value;
          if (class_date.length !== 5)
            return toast("Vaqtni to'liq kiriting (HH:MM)!", "warning");
          class_date += ":00"; // Backend kutayotgan time formatiga moslash

          const payload = {
            teacher_id: selectedTeacherId,
            science_name: science_name,
            name: name,
            price: price,
            teacher_percent: teacher_percent,
            class_day: class_day,
            class_date: class_date,
          };

          showLoader();
          const r = await apiFetch(`${BASE}/group/create`, {
            method: "POST",
            body: JSON.stringify(payload),
          });
          hideLoader();

          if (r && r.ok) {
            const new_group_id = await r.json();
            window.location.replace(`group_info.html?id=${new_group_id}`);
          } else if (r) {
            try {
              const err = await r.json();
              toast(err.detail || "Guruhni yaratishda xatolik yuz berdi");
            } catch {
              toast(`Server xatosi: ${r.status}`);
            }
          }
        });

      // RUN INITIAL DATA FETCH
      initData();
    </script>
  </body>
</html>
