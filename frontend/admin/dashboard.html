<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — O'quv Markaz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0f1117;
        --surface: #171b26;
        --surface2: #1e2333;
        --border: #ffffff0f;
        --border2: #ffffff18;
        --accent: #6c8ef5;
        --accent2: #a78bfa;
        --accent-glow: #6c8ef530;
        --text: #e8eaf0;
        --text-muted: #6b7280;
        --text-dim: #9ca3af;
        --success: #34d399;
        --warning: #fbbf24;
        --danger: #f87171;
        --sidebar-w: 240px;
        --topbar-h: 60px;
        --radius: 10px;
        --radius-sm: 6px;
        --mono: "JetBrains Mono", monospace;
        --sans: "Outfit", sans-serif;
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 14px;
      }
      .layout {
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* SIDEBAR */
      .sidebar {
        width: var(--sidebar-w);
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        overflow-y: auto;
        scrollbar-width: none;
        position: relative;
        z-index: 10;
      }
      .sidebar::-webkit-scrollbar {
        display: none;
      }
      .sidebar::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
      }
      .logo-area {
        padding: 22px 20px 18px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .logo-circle {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 10px;
        box-shadow: 0 0 20px var(--accent-glow);
      }
      .logo-name {
        font-weight: 600;
        font-size: 15px;
      }
      .logo-sub {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 2px;
        letter-spacing: 0.3px;
      }
      .nav-section {
        flex: 1;
        padding: 10px 12px;
      }
      .nav-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--text-muted);
        padding: 14px 8px 6px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: var(--radius-sm);
        color: var(--text-dim);
        text-decoration: none;
        font-size: 13.5px;
        transition:
          background 0.15s,
          color 0.15s;
        position: relative;
      }
      .nav-item:hover {
        background: var(--surface2);
        color: var(--text);
      }
      .nav-item.active {
        background: var(--accent-glow);
        color: var(--accent);
        font-weight: 500;
      }
      .nav-item.active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 25%;
        bottom: 25%;
        width: 3px;
        border-radius: 2px;
        background: var(--accent);
      }
      .nav-icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .logout-area {
        padding: 12px;
        border-top: 1px solid var(--border);
        flex-shrink: 0;
      }
      .logout-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 10px;
        border-radius: var(--radius-sm);
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-muted);
        font-size: 13.5px;
        font-family: var(--sans);
        transition:
          background 0.15s,
          color 0.15s;
      }
      .logout-btn:hover {
        background: #f8717118;
        color: var(--danger);
      }

      /* MAIN */
      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-width: 0;
      }
      .topbar {
        height: var(--topbar-h);
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        flex-shrink: 0;
      }
      .page-title {
        font-size: 16px;
        font-weight: 600;
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .admin-label {
        font-size: 13px;
        color: var(--text-muted);
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
      }
      #content-area {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        scrollbar-width: thin;
        scrollbar-color: var(--border2) transparent;
      }

      /* LOADING */
      .loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        min-height: 300px;
        color: var(--text-muted);
        font-size: 13px;
      }
      .spinner {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid var(--border2);
        border-top-color: var(--accent);
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* STAT CARDS */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 28px;
      }
      @media (max-width: 1100px) {
        .stats-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        position: relative;
        overflow: hidden;
        transition:
          border-color 0.2s,
          transform 0.18s;
      }
      .stat-card:hover {
        border-color: var(--border2);
        transform: translateY(-2px);
      }
      .stat-card::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 2px;
      }
      .stat-card.c1::after {
        background: linear-gradient(90deg, var(--accent), var(--accent2));
      }
      .stat-card.c2::after {
        background: linear-gradient(90deg, var(--success), #6ee7b7);
      }
      .stat-card.c3::after {
        background: linear-gradient(90deg, #f472b6, var(--accent2));
      }
      .stat-card.c4::after {
        background: linear-gradient(90deg, var(--warning), #fde68a);
      }
      .stat-icon {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 14px;
        font-size: 18px;
      }
      .stat-card.c1 .stat-icon {
        background: #6c8ef520;
      }
      .stat-card.c2 .stat-icon {
        background: #34d39920;
      }
      .stat-card.c3 .stat-icon {
        background: #f472b620;
      }
      .stat-card.c4 .stat-icon {
        background: #fbbf2420;
      }
      .stat-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-muted);
        margin-bottom: 6px;
      }
      .stat-value {
        font-size: 30px;
        font-weight: 700;
        font-family: var(--mono);
        line-height: 1;
      }
      .stat-card.c4 .stat-value {
        color: var(--warning);
      }
      .stat-sub {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 5px;
      }

      /* TABLE */
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .section-title {
        font-size: 15px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .badge-danger {
        background: #f8717120;
        color: var(--danger);
        font-size: 11px;
        padding: 2px 9px;
        border-radius: 20px;
        font-weight: 600;
      }
      .table-wrap {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      thead th {
        padding: 11px 16px;
        text-align: left;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-muted);
        background: var(--surface2);
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      tbody tr {
        border-bottom: 1px solid var(--border);
        transition:
          background 0.12s,
          opacity 0.3s;
      }
      tbody tr:last-child {
        border-bottom: none;
      }
      tbody tr:hover {
        background: var(--surface2);
      }
      tbody tr.row-warn {
        background: #fbbf2406;
      }
      tbody tr.row-warn:hover {
        background: #fbbf2410;
      }
      tbody tr.row-danger {
        background: #f8717106;
      }
      tbody tr.row-danger:hover {
        background: #f8717112;
      }
      td {
        padding: 13px 16px;
        vertical-align: middle;
      }
      .student-link {
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
        font-size: 13.5px;
        transition: color 0.15s;
      }
      .student-link:hover {
        color: var(--accent2);
        text-decoration: underline;
      }
      .group-link {
        color: var(--text-dim);
        text-decoration: none;
        font-size: 13px;
        transition: color 0.15s;
      }
      .group-link:hover {
        color: var(--text);
        text-decoration: underline;
      }
      .contact-cell {
        font-size: 12.5px;
        line-height: 1.8;
      }
      .ct1 {
        color: var(--text);
        font-family: var(--mono);
      }
      .ct2 {
        color: var(--text-muted);
        font-family: var(--mono);
        font-size: 11.5px;
      }
      .days-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 52px;
        padding: 3px 10px;
        border-radius: 20px;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .days-ok {
        background: #34d39918;
        color: var(--success);
      }
      .days-warn {
        background: #fbbf2418;
        color: var(--warning);
      }
      .days-danger {
        background: #f8717118;
        color: var(--danger);
      }

      /* PENDING */
      .pending-cell {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .pending-input {
        width: 64px;
        padding: 5px 8px;
        border-radius: var(--radius-sm);
        background: var(--surface2);
        border: 1px solid var(--border2);
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        outline: none;
        transition: border-color 0.15s;
        -moz-appearance: textfield;
      }
      .pending-input::-webkit-inner-spin-button,
      .pending-input::-webkit-outer-spin-button {
        -webkit-appearance: none;
      }
      .pending-input:focus {
        border-color: var(--accent);
      }
      .pending-btn {
        padding: 5px 11px;
        border-radius: var(--radius-sm);
        background: var(--accent-glow);
        border: 1px solid var(--accent);
        color: var(--accent);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
        font-family: var(--sans);
        white-space: nowrap;
      }
      .pending-btn:hover:not(:disabled) {
        background: var(--accent);
        color: #fff;
      }
      .pending-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* PAGINATION */
      .pagination {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        padding: 14px 16px;
        border-top: 1px solid var(--border);
        flex-wrap: wrap;
      }
      .page-info {
        font-size: 12px;
        color: var(--text-muted);
        margin-right: auto;
      }
      .page-btn {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 14px;
        border-radius: var(--radius-sm);
        background: var(--surface2);
        border: 1px solid var(--border2);
        color: var(--text-dim);
        font-size: 13px;
        font-family: var(--sans);
        cursor: pointer;
        transition: 0.15s;
        white-space: nowrap;
      }
      .page-btn:hover:not(:disabled) {
        background: var(--accent-glow);
        border-color: var(--accent);
        color: var(--accent);
      }
      .page-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .page-nums {
        display: flex;
        gap: 4px;
      }
      .page-num {
        width: 30px;
        height: 30px;
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text-dim);
        font-size: 13px;
        cursor: pointer;
        transition: 0.15s;
      }
      .page-num.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .page-num:hover:not(.active) {
        border-color: var(--accent);
        color: var(--accent);
      }
      .empty-row td {
        text-align: center;
        padding: 48px;
        color: var(--text-muted);
        font-size: 13px;
      }

      /* TOAST */
      #toast-container {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }
      .toast {
        background: var(--surface2);
        border: 1px solid var(--border2);
        border-radius: var(--radius);
        padding: 12px 16px;
        font-size: 13px;
        color: var(--text);
        max-width: 340px;
        animation: toastIn 0.2s ease;
        pointer-events: all;
        box-shadow: 0 8px 32px #0008;
      }
      .toast.error {
        border-color: var(--danger);
        color: var(--danger);
      }
      .toast.success {
        border-color: var(--success);
        color: var(--success);
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

    /* GLOBAL LOADER */
    .global-loader-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 17, 23, 0.6);
      backdrop-filter: blur(3px);
      z-index: 100000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .global-loader-overlay.active {
      opacity: 1;
      pointer-events: all;
    }
    .global-spinner {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 3px solid var(--border2);
      border-top-color: var(--accent);
      animation: spin 0.7s linear infinite;
    }
    </style>
  </head>

                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
              />
              <path
                d="M11 11l3-3-3-3M14 8H6"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Chiqish
          </button>
        </div>
      </aside>

      <!-- MAIN -->
      <div class="main-content">
        <div class="topbar">
          <span class="page-title">Dashboard</span>
          <div class="topbar-right">
            <span class="admin-label" id="admin-name">Admin</span>
            <div class="avatar" id="admin-avatar">AD</div>
          </div>
        </div>
        <div id="content-area">
          <div class="loading">
            <div class="spinner"></div>
            Yuklanmoqda...
          </div>
        </div>
      </div>
    </div>

    <script>
      const BASE = "http://127.0.0.1:8000/api/v1";
      const LIMIT = 20;
      let currentPage = 1;
      let totalExpired = 0;
      let cachedStats = {};

      if (!localStorage.getItem("access_token")) {
        window.location.replace("../index.html");
      }

      window.addEventListener("pageshow", function (event) {
        if (
          event.persisted ||
          (performance.getEntriesByType &&
            performance.getEntriesByType("navigation").length &&
            performance.getEntriesByType("navigation")[0].type ===
              "back_forward")
        ) {
          if (!localStorage.getItem("access_token")) {
            window.location.replace("../index.html");
          }
        }
      });

      /* --- AUTH --- */
      const getToken = () => localStorage.getItem("access_token");
      const saveToken = (t) => localStorage.setItem("access_token", t);

      async function authLogout() {
        showLoader();
        const token = getToken();
        localStorage.clear();
        sessionStorage.clear();
        if (token) {
          try {
            await fetch(`${BASE}/auth/logout`, {
              method: "POST",
              credentials: "include",
              headers: { Authorization: `Bearer ${token}` },
            });
          } catch (e) {}
        }
        window.location.replace("../index.html");
      }

      async function tryRefresh() {
        try {
          const r = await fetch(`${BASE}/auth/refresh`, {
            method: "POST",
            credentials: "include",
          });
          if (!r.ok) throw 0;
          const d = await r.json();
          if (d.access_token) {
            saveToken(d.access_token);
            return d.access_token;
          }
          throw 0;
        } catch {
          authLogout();
          return null;
        }
      }

      async function apiFetch(url, opts = {}) {
        const go = (tok) =>
          fetch(url, {
            ...opts,
            credentials: "include",
            headers: {
              "Content-Type": "application/json",
              ...(opts.headers || {}),
              Authorization: `Bearer ${tok}`,
            },
          });
        let res = await go(getToken());

        if (res.status === 403) {
          authLogout();
          return null;
        }

        if (res.status === 401) {
          const nt = await tryRefresh();
          if (!nt) return null;
          res = await go(nt);
          if (res.status === 401 || res.status === 403) {
            authLogout();
            return null;
          }
        }
        return res;
      }

      /* --- GLOBAL LOADER --- */
      function showLoader() {
        const el = document.getElementById("global-loader");
        if (el) el.classList.add("active");
      }
      function hideLoader() {
        const el = document.getElementById("global-loader");
        if (el) el.classList.remove("active");
      }

      document.addEventListener("click", function (e) {
        const link = e.target.closest("a");
        if (link && link.href && link.href.indexOf(".html") !== -1 && !link.hasAttribute("target")) {
          showLoader();
        }
      });

      /* --- TOAST --- */
      function toast(msg, type = "error") {
        const c = document.getElementById("toast-container");
        const el = document.createElement("div");
        el.className = `toast ${type}`;
        el.textContent = msg;
        c.appendChild(el);
        setTimeout(() => {
          el.style.cssText += "opacity:0;transition:opacity .3s";
          setTimeout(() => el.remove(), 300);
        }, 3800);
      }

      /* --- HELPERS --- */
      function esc(s) {
        return s == null
          ? "—"
          : String(s)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
      }
      function fmtMoney(n) {
        return n == null ? "—" : Number(n).toLocaleString("uz-UZ") + " so'm";
      }

      /* --- FETCH --- */
      async function fetchDashboard(page) {
        const r = await apiFetch(
          `${BASE}/dashboard/?limit=${LIMIT}&offset=${(page - 1) * LIMIT}`,
        );
        if (!r) return null;
        if (!r.ok) {
          toast(`Server xatoligi: ${r.status}`);
          return null;
        }
        return r.json();
      }

      /* --- RENDER STATS --- */
      function renderStats(d) {
        return `
    <div class="stats-grid">
      <div class="stat-card c1">
        <div class="stat-icon">👨‍🏫</div>
        <div class="stat-label">O'qituvchilar</div>
        <div class="stat-value">${d.teacher_num ?? "—"}</div>
        <div class="stat-sub">Faol o'qituvchilar</div>
      </div>
      <div class="stat-card c2">
        <div class="stat-icon">📚</div>
        <div class="stat-label">Guruhlar</div>
        <div class="stat-value">${d.group_num ?? "—"}</div>
        <div class="stat-sub">Faol guruhlar</div>
      </div>
      <div class="stat-card c3">
        <div class="stat-icon">🎓</div>
        <div class="stat-label">O'quvchilar</div>
        <div class="stat-value">${d.sudent_num ?? "—"}</div>
        <div class="stat-sub">Jami o'quvchilar</div>
      </div>
      <div class="stat-card c4">
        <div class="stat-icon">💰</div>
        <div class="stat-label">Bugungi daromad</div>
        <div class="stat-value">${fmtMoney(d.today_income)}</div>
        <div class="stat-sub">Yig'ilgan summa</div>
      </div>
    </div>`;
      }

      /* --- RENDER TABLE --- */
      function renderTable(students, page, total) {
        const totalPages = Math.max(1, Math.ceil(total / LIMIT));
        const start = total > 0 ? (page - 1) * LIMIT + 1 : 0;
        const end = Math.min(page * LIMIT, total);

        let rows = "";
        if (!students || !students.length) {
          rows = `<tr class="empty-row"><td colspan="5">✅ Muddati o'tgan talabalar yo'q</td></tr>`;
        } else {
          students.forEach((s) => {
            const d = s.expired_days ?? 0;
            const sid = s.student.student_id;
            const rc = d >= 8 ? "row-danger" : d >= 4 ? "row-warn" : "";
            const dc =
              d >= 8 ? "days-danger" : d >= 4 ? "days-warn" : "days-ok";
            rows += `
        <tr class="${rc}" id="row-${sid}">
          <td><a class="student-link" href="student_info.html?id=${sid}">${esc(s.student.first_name + " " + s.student.last_name)}</a></td>
          <td><a class="group-link" href="group_info.html?id=${s.group_id}">${esc(s.group_name)}</a></td>
          <td class="contact-cell">
            <div class="ct1">${esc(s.student_contact)}</div>
            <div class="ct2">${esc(s.student_parent_contact)}</div>
          </td>
          <td><span class="days-badge ${dc}">${d} kun</span></td>
          <td>
            <div class="pending-cell" id="pcell-${sid}">
              <input type="number" min="1" max="365" class="pending-input" id="pinp-${sid}"
                placeholder="kun" onkeydown="if(event.key==='Enter')submitPending(${sid}, ${s.group_id})"/>
              <button class="pending-btn" onclick="submitPending(${sid}, ${s.group_id})">Kutish</button>
            </div>
          </td>
        </tr>`;
          });
        }

        let nums = "";
        for (
          let i = Math.max(1, page - 2);
          i <= Math.min(totalPages, page + 2);
          i++
        ) {
          nums += `<button class="page-num ${i === page ? "active" : ""}" onclick="goPage(${i})">${i}</button>`;
        }

        return `
    <div class="section-header">
      <div class="section-title">
        Muddati o'tgan talabalar
        <span class="badge-danger" id="expire-badge">${total} ta</span>
      </div>
    </div>
    <div class="table-wrap" id="table-wrap">
      <table>
        <thead><tr>
          <th>Talaba</th><th>Guruh</th><th>Kontakt</th><th>Kechikkan</th><th>Kutish</th>
        </tr></thead>
        <tbody id="expire-tbody">${rows}</tbody>
      </table>
      <div class="pagination">
        <span class="page-info" id="page-info">${total > 0 ? `${start}–${end} / ${total} ta` : "0 ta"}</span>
        <button class="page-btn" onclick="goPage(${page - 1})" ${page <= 1 ? "disabled" : ""}>← Oldingi</button>
        <div class="page-nums">${nums}</div>
        <button class="page-btn" onclick="goPage(${page + 1})" ${page >= totalPages ? "disabled" : ""}>Keyingi →</button>
      </div>
    </div>`;
      }

      /* --- PAGINATION --- */
      async function goPage(page) {
        if (page < 1 || page > Math.max(1, Math.ceil(totalExpired / LIMIT)))
          return;
        currentPage = page;
        showLoader();
        const data = await fetchDashboard(page);
        hideLoader();
        if (!data) {
          return;
        }
        if (data.total_expire != null) totalExpired = data.total_expire;
        const ca = document.getElementById("content-area");
        ca.querySelector(".section-header")?.remove();
        ca.querySelector("#table-wrap")?.remove();
        ca.insertAdjacentHTML(
          "beforeend",
          renderTable(data.expire_students, page, totalExpired),
        );
      }

      /* --- PENDING --- */
      async function submitPending(sid, gid) {
        const inp = document.getElementById(`pinp-${sid}`);
        const days = parseInt(inp?.value);
        if (!days || days < 1) {
          toast("Iltimos, kunlar sonini kiriting (kamida 1)");
          return;
        }

        const cell = document.getElementById(`pcell-${sid}`);
        const btn = cell?.querySelector(".pending-btn");
        if (btn) {
          btn.disabled = true;
          btn.textContent = "...";
        }

        showLoader();
        const r = await apiFetch(
          `${BASE}/dashboard/pending/?student_id=${sid}&group_id=${gid}&days=${days}`,
          { method: "PATCH" },
        );
        hideLoader();
        if (!r) {
          if (btn) {
            btn.disabled = false;
            btn.textContent = "Kutish";
          }
          return;
        }

        if (r.status === 204 || r.ok) {
          const row = document.getElementById(`row-${sid}`);
          if (row) {
            row.style.cssText += "opacity:0;transition:opacity .35s";
            setTimeout(() => {
              row.remove();
              totalExpired = Math.max(0, totalExpired - 1);
              const b = document.getElementById("expire-badge");
              if (b) b.textContent = `${totalExpired} ta`;
              const pi = document.getElementById("page-info");
              if (pi) {
                const s = totalExpired > 0 ? (currentPage - 1) * LIMIT + 1 : 0;
                const e = Math.min(currentPage * LIMIT, totalExpired);
                pi.textContent =
                  totalExpired > 0 ? `${s}–${e} / ${totalExpired} ta` : "0 ta";
              }
            }, 350);
          }
          toast("Kutish muvaffaqiyatli belgilandi ✓", "success");
        } else {
          try {
            const err = await r.json();
            if (Array.isArray(err.detail))
              err.detail.forEach((e) => toast(e.msg || JSON.stringify(e)));
            else toast(err.detail || `Xatolik: ${r.status}`);
          } catch {
            toast(`Server xatoligi: ${r.status}`);
          }
          if (btn) {
            btn.disabled = false;
            btn.textContent = "Kutish";
          }
        }
      }

      /* --- INIT --- */
      (async () => {
        const data = await fetchDashboard(1);
        if (!data) return;
        cachedStats = data;
        totalExpired = data.total_expire ?? data.expire_students?.length ?? 0;
        document.getElementById("content-area").innerHTML =
          renderStats(cachedStats) +
          renderTable(data.expire_students, 1, totalExpired);
      })();
    </script>
  </body>
</html>
