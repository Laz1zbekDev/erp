<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O'qituvchi ma'lumotlari</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0f1117;
        --surface: #171b26;
        --surface2: #1e2333;
        --surface3: #242840;
        --border: #ffffff0f;
        --border2: #ffffff18;
        --border3: #ffffff25;
        --accent: #6c8ef5;
        --accent2: #a78bfa;
        --accent-glow: #6c8ef530;
        --text: #e8eaf0;
        --text-muted: #6b7280;
        --text-dim: #9ca3af;
        --success: #34d399;
        --warning: #fbbf24;
        --danger: #f87171;
        --sidebar-w: 240px;
        --topbar-h: 60px;
        --radius: 10px;
        --radius-sm: 6px;
        --radius-xs: 4px;
        --mono: "JetBrains Mono", monospace;
        --sans: "Outfit", sans-serif;
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 14px;
      }
      .layout {
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* SIDEBAR */
      .sidebar {
        width: var(--sidebar-w);
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        overflow-y: auto;
        scrollbar-width: none;
        position: relative;
        z-index: 10;
      }
      .sidebar::-webkit-scrollbar {
        display: none;
      }
      .sidebar::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
      }
      .logo-area {
        padding: 22px 20px 18px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .logo-circle {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 10px;
        box-shadow: 0 0 20px var(--accent-glow);
      }
      .logo-name {
        font-weight: 600;
        font-size: 15px;
      }
      .logo-sub {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 2px;
        letter-spacing: 0.3px;
      }
      .nav-section {
        flex: 1;
        padding: 10px 12px;
      }
      .nav-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--text-muted);
        padding: 14px 8px 6px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: var(--radius-sm);
        color: var(--text-dim);
        text-decoration: none;
        font-size: 13.5px;
        transition:
          background 0.15s,
          color 0.15s;
        position: relative;
      }
      .nav-item:hover {
        background: var(--surface2);
        color: var(--text);
      }
      .nav-item.active {
        background: var(--accent-glow);
        color: var(--accent);
        font-weight: 500;
      }
      .nav-item.active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 25%;
        bottom: 25%;
        width: 3px;
        border-radius: 2px;
        background: var(--accent);
      }
      .nav-icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .logout-area {
        padding: 12px;
        border-top: 1px solid var(--border);
        flex-shrink: 0;
      }
      .logout-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 10px;
        border-radius: var(--radius-sm);
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-muted);
        font-size: 13.5px;
        font-family: var(--sans);
        transition:
          background 0.15s,
          color 0.15s;
      }
      .logout-btn:hover {
        background: #f8717118;
        color: var(--danger);
      }

      /* MAIN */
      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-width: 0;
      }
      .topbar {
        height: var(--topbar-h);
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        flex-shrink: 0;
      }
      .topbar-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .back-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: var(--radius-sm);
        background: var(--surface2);
        border: 1px solid var(--border2);
        color: var(--text-dim);
        font-size: 13px;
        font-family: var(--sans);
        cursor: pointer;
        transition: 0.15s;
      }
      .back-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .page-title {
        font-size: 16px;
        font-weight: 600;
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .delete-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: var(--radius-sm);
        background: #f8717112;
        border: 1px solid #f8717130;
        color: var(--danger);
        font-size: 13px;
        font-family: var(--sans);
        cursor: pointer;
        transition: 0.15s;
        font-weight: 500;
      }
      .delete-btn:hover {
        background: #f8717122;
        border-color: var(--danger);
      }
      .admin-label {
        font-size: 13px;
        color: var(--text-muted);
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
      }
      #content-area {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        scrollbar-width: thin;
        scrollbar-color: var(--border2) transparent;
      }

      /* LOADING */
      .loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        min-height: 300px;
        color: var(--text-muted);
        font-size: 13px;
      }
      .spinner {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid var(--border2);
        border-top-color: var(--accent);
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .spinner-sm {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-top-color: var(--accent);
        animation: spin 0.7s linear infinite;
        display: inline-block;
        vertical-align: middle;
      }

      /* INFO CARD */
      .info-combined {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 16px;
        overflow: hidden;
      }
      .info-combined-header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--surface2);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .info-combined-header span {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.6px;
      }
      .info-panels {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .info-panel {
        padding: 20px;
        position: relative;
      }
      .info-panel:first-child {
        border-right: 1px solid var(--border);
      }
      .info-panel-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-muted);
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .info-row {
        margin-bottom: 10px;
      }
      .info-label {
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 3px;
      }
      .info-value {
        font-size: 14px;
        color: var(--text);
        font-weight: 500;
      }
      .info-value.mono {
        font-family: var(--mono);
        font-size: 13px;
      }
      .info-empty {
        color: var(--text-muted);
        font-style: italic;
        font-size: 13px;
      }

      /* EDIT */
      .edit-form {
        display: none;
      }
      .edit-form.active {
        display: block;
      }
      .edit-static.hidden {
        display: none;
      }
      .edit-input {
        width: 100%;
        padding: 7px 10px;
        border-radius: var(--radius-sm);
        background: var(--surface3);
        border: 1px solid var(--border2);
        color: var(--text);
        font-family: var(--sans);
        font-size: 13.5px;
        outline: none;
        transition: border-color 0.15s;
        margin-bottom: 8px;
      }
      .edit-input:focus {
        border-color: var(--accent);
      }
      .edit-actions {
        display: flex;
        gap: 6px;
        margin-top: 4px;
      }
      .btn-save {
        padding: 5px 14px;
        border-radius: var(--radius-sm);
        background: var(--accent);
        border: none;
        color: #fff;
        font-size: 12.5px;
        font-weight: 600;
        font-family: var(--sans);
        cursor: pointer;
        transition: 0.15s;
      }
      .btn-save:hover:not(:disabled) {
        background: #5a7de8;
      }
      .btn-save:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-cancel {
        padding: 5px 12px;
        border-radius: var(--radius-sm);
        background: var(--surface2);
        border: 1px solid var(--border2);
        color: var(--text-dim);
        font-size: 12.5px;
        font-family: var(--sans);
        cursor: pointer;
        transition: 0.15s;
      }
      .btn-cancel:hover {
        border-color: var(--border3);
        color: var(--text);
      }

      /* PENDING (Maosh qo'shish qismi uchun) */
      .pending-input {
        width: 64px;
        height: 28px;
        padding: 0 8px;
        border-radius: var(--radius-sm);
        background: var(--surface2);
        border: 1px solid #68a9f560;
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        outline: none;
        transition: border-color 0.15s;
        -moz-appearance: textfield;
      }
      .pending-input::-webkit-inner-spin-button,
      .pending-input::-webkit-outer-spin-button {
        -webkit-appearance: none;
      }
      .pending-input:focus {
        border-color: #68a9f5;
      }
      .pending-btn {
        height: 28px;
        padding: 0 12px;
        border-radius: var(--radius-sm);
        background: #68a9f515;
        border: 1px solid #68a9f5;
        color: #68a9f5;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.15s,
          color 0.15s;
        font-family: var(--sans);
        white-space: nowrap;
      }
      .pending-btn:hover:not(:disabled) {
        background: #68a9f5;
        color: #fff;
      }
      .pending-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* GROUPS */
      .groups-section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .groups-section-title {
        font-size: 15px;
        font-weight: 600;
      }
      .group-list-item {
        display: flex;
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 14px 18px;
        margin-bottom: 10px;
        gap: 20px;
        transition: border-color 0.15s;
      }
      .group-list-item:hover {
        border-color: var(--border2);
      }
      .group-list-index {
        font-family: var(--mono);
        color: var(--text-muted);
        font-size: 13px;
        width: 20px;
      }
      .group-list-name {
        flex: 1;
        font-size: 14px;
        font-weight: 500;
      }
      .group-list-name a {
        color: var(--text);
        text-decoration: none;
        transition: color 0.15s;
      }
      .group-list-name a:hover {
        color: var(--accent);
      }
      .group-list-detail {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--text-dim);
        min-width: 120px;
        text-align: right;
        white-space: nowrap;
      }

      /* MODAL */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: #000a;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .modal-overlay.active {
        opacity: 1;
        pointer-events: all;
      }
      .modal {
        background: var(--surface);
        border: 1px solid var(--border2);
        border-radius: var(--radius);
        width: 420px;
        max-width: 90vw;
        max-height: 80vh;
        display: flex;
        flex-direction: column;
        transform: scale(0.96);
        transition: transform 0.2s;
      }
      .modal-overlay.active .modal {
        transform: scale(1);
      }
      .modal-header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }
      .modal-title {
        font-size: 15px;
        font-weight: 600;
      }
      .modal-close {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-muted);
        font-size: 18px;
        line-height: 1;
        padding: 2px 6px;
        border-radius: var(--radius-xs);
        transition: 0.15s;
      }
      .modal-close:hover {
        color: var(--text);
        background: var(--surface2);
      }
      .modal-search {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .modal-search-input {
        width: 100%;
        padding: 8px 12px;
        border-radius: var(--radius-sm);
        background: var(--surface2);
        border: 1px solid var(--border2);
        color: var(--text);
        font-family: var(--sans);
        font-size: 13.5px;
        outline: none;
        transition: border-color 0.15s;
      }
      .modal-search-input:focus {
        border-color: var(--accent);
      }
      .modal-body {
        overflow-y: auto;
        flex: 1;
        padding: 8px 0;
      }
      .modal-group-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        cursor: pointer;
        transition: background 0.12s;
        border-bottom: 1px solid var(--border);
      }
      .modal-group-item:last-child {
        border-bottom: none;
      }
      .modal-group-item:hover {
        background: var(--surface2);
      }
      .modal-group-item.selected {
        background: var(--accent-glow);
      }
      .modal-group-name {
        font-size: 13.5px;
        font-weight: 500;
      }
      .modal-group-check {
        width: 18px;
        height: 18px;
        border-radius: 4px;
        background: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: 0.15s;
      }
      .modal-group-item.selected .modal-group-check {
        opacity: 1;
      }
      .modal-footer {
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        flex-shrink: 0;
      }
      .modal-empty {
        padding: 32px;
        text-align: center;
        color: var(--text-muted);
        font-size: 13px;
      }

      /* CONFIRM MODAL */
      .confirm-modal {
        width: 360px;
      }
      .confirm-body {
        padding: 24px 20px 16px;
      }
      .confirm-icon {
        font-size: 32px;
        margin-bottom: 12px;
        text-align: center;
      }
      .confirm-text {
        font-size: 14px;
        color: var(--text-dim);
        text-align: center;
        line-height: 1.6;
      }
      .confirm-actions {
        padding: 14px 20px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .btn-danger {
        padding: 7px 16px;
        border-radius: var(--radius-sm);
        background: #f8717118;
        border: 1px solid #f8717140;
        color: var(--danger);
        font-size: 13px;
        font-weight: 600;
        font-family: var(--sans);
        cursor: pointer;
        transition: 0.15s;
      }
      .btn-danger:hover {
        background: #f8717128;
        border-color: var(--danger);
      }
      .btn-neutral {
        padding: 7px 14px;
        border-radius: var(--radius-sm);
        background: var(--surface2);
        border: 1px solid var(--border2);
        color: var(--text-dim);
        font-size: 13px;
        font-family: var(--sans);
        cursor: pointer;
        transition: 0.15s;
      }
      .btn-neutral:hover {
        border-color: var(--border3);
        color: var(--text);
      }
      .btn-confirm-ok {
        padding: 7px 16px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 600;
        font-family: var(--sans);
        cursor: pointer;
        transition: 0.15s;
        border: none;
      }
      .btn-confirm-ok.is-danger {
        background: #f8717118;
        border: 1px solid #f8717140;
        color: var(--danger);
      }
      .btn-confirm-ok.is-danger:hover {
        background: #f8717128;
        border-color: var(--danger);
      }
      .btn-confirm-ok.is-primary {
        background: var(--accent);
        border: 1px solid var(--accent);
        color: #fff;
      }
      .btn-confirm-ok.is-primary:hover {
        background: #5a7de8;
      }

      /* TOAST */
      #toast-container {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 100005;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }
      .toast {
        background: var(--surface2);
        border: 1px solid var(--border2);
        border-radius: var(--radius);
        padding: 16px 20px;
        font-size: 15px;
        color: var(--text);
        max-width: 400px;
        animation: toastIn 0.3s ease;
        pointer-events: all;
        box-shadow: 0 8px 32px #0008;
      }
      .toast.error {
        border-color: var(--danger);
        color: var(--danger);
      }
      .toast.success {
        border-color: var(--success);
        color: var(--success);
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(-12px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* MISC */
      .empty-state {
        padding: 32px;
        text-align: center;
        color: var(--text-muted);
        font-size: 13px;
        background: var(--surface2);
        border-radius: var(--radius-sm);
      }
      .error-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-height: 300px;
        color: var(--text-muted);
      }
      .err-code {
        font-size: 48px;
        font-weight: 700;
        color: var(--border2);
      }
      .err-msg {
        font-size: 14px;
      }

      /* GLOBAL LOADER */
      .global-loader-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 17, 23, 0.6);
        backdrop-filter: blur(3px);
        z-index: 100000;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .global-loader-overlay.active {
        opacity: 1;
        pointer-events: all;
      }
      .global-spinner {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: 3px solid var(--border2);
        border-top-color: var(--accent);
        animation: spin 0.7s linear infinite;
      }
    </style>
  </head>
  <body>
    <!-- GLOBAL LOADER -->
    <div class="global-loader-overlay" id="global-loader">
      <div class="global-spinner"></div>
    </div>

    <div id="toast-container"></div>

    <!-- CONFIRM MODAL -->
    <div class="modal-overlay" id="confirm-overlay">
      <div class="modal confirm-modal">
        <div class="confirm-body">
          <div class="confirm-icon" id="confirm-icon">⚠️</div>
          <div class="confirm-text" id="confirm-text">
            Haqiqatan ham davom etmoqchimisiz?
          </div>
        </div>
        <div class="confirm-actions">
          <button class="btn-neutral" id="confirm-cancel-btn">
            Bekor qilish
          </button>

    <script>
      const BASE = "http://10.13.155.23:8000/api/v1";
      const urlParams = new URLSearchParams(window.location.search);
      const TEACHER_ID = parseInt(urlParams.get("id"));

      let teacherData = null;
      let confirmCallback = null;

      // ── REFERRER SAQLASH ─────────────────────────────────────────────────────────
      (function saveReferrer() {
        const key = `prev_page_${TEACHER_ID}`;
        const stored = sessionStorage.getItem(key);
        const ref = document.referrer;

        if (!stored) {
          if (ref && !ref.includes("teacher_info")) {
            sessionStorage.setItem(key, ref);
          } else if (!ref) {
            sessionStorage.setItem(key, "teacher.html");
          }
        }
      })();

      function getBackUrl() {
        const key = `prev_page_${TEACHER_ID}`;
        return sessionStorage.getItem(key) || "teacher.html";
      }

      function clearReferrer() {
        sessionStorage.removeItem(`prev_page_${TEACHER_ID}`);
      }

      // ── NAVIGATION ───────────────────────────────────────────────────────────────
      function goBack() {
        const backUrl = getBackUrl();
        clearReferrer();
        if (backUrl.startsWith("http")) {
          window.location.href = backUrl;
        } else {
          window.location.href = backUrl;
        }
      }

      function goBackAfterDelete() {
        const backUrl = getBackUrl();
        clearReferrer();
        if (backUrl.startsWith("http")) {
          window.location.href = backUrl;
        } else {
          window.location.href = backUrl;
        }
      }

      // ── SIDEBAR ACTIVE ───────────────────────────────────────────────────────────
      (function setActiveSidebar() {
        const currentPath = window.location.pathname.split("/").pop();
        const navItems = document.querySelectorAll(".nav-item");
        navItems.forEach((item) => {
          item.classList.remove("active");
          const itemHref = item.getAttribute("href");
          if (
            itemHref === currentPath ||
            (currentPath === "teacher_info.html" && itemHref === "teacher.html")
          ) {
            item.classList.add("active");
          }
        });
      })();

      if (!localStorage.getItem("access_token")) {
        window.location.replace("../index.html");
      }

      window.addEventListener("pageshow", function (event) {
        if (
          event.persisted ||
          (performance.getEntriesByType &&
            performance.getEntriesByType("navigation").length &&
            performance.getEntriesByType("navigation")[0].type ===
              "back_forward")
        ) {
          if (!localStorage.getItem("access_token")) {
            window.location.replace("../index.html");
          }
        }
      });

      // ── AUTH ─────────────────────────────────────────────────────────────────────
      const getToken = () => localStorage.getItem("access_token");
      const saveToken = (t) => localStorage.setItem("access_token", t);

      function authLogout() {
        const token = getToken();
        localStorage.clear();
        sessionStorage.clear();
        if (token) {
          fetch(`${BASE}/auth/logout`, {
            method: "POST",
            credentials: "include",
            keepalive: true,
            headers: { Authorization: `Bearer ${token}` },
          }).catch(() => {});
        }
        window.location.replace("../index.html");
      }

      async function tryRefresh() {
        try {
          const r = await fetch(`${BASE}/auth/refresh`, {
            method: "POST",
            credentials: "include",
          });
          if (!r.ok) throw 0;
          const d = await r.json();
          if (d.access_token) {
            saveToken(d.access_token);
            return d.access_token;
          }
          throw 0;
        } catch {
          authLogout();
          return null;
        }
      }

      async function apiFetch(url, opts = {}) {
        const token = getToken();
        const headers = {
          "Content-Type": "application/json",
          ...(opts.headers || {}),
        };
        if (token) headers["Authorization"] = `Bearer ${token}`;

        const go = (tok) => {
          const h = { ...headers };
          if (tok) h["Authorization"] = `Bearer ${tok}`;
          return fetch(url, { ...opts, credentials: "include", headers: h });
        };

        let res;
        try {
          res = await go(token);
        } catch (e) {
          toast(`Tarmoq xatoligi: ${e.message}`, "error");
          return null;
        }

        if (res.status === 401 || res.status === 403) {
          const nt = await tryRefresh();
          if (!nt) return null;
          try {
            res = await go(nt);
          } catch (e) {
            toast(`Tarmoq xatoligi: ${e.message}`, "error");
            return null;
          }
          if (res.status === 401 || res.status === 403) {
            authLogout();
            return null;
          }
        }
        return res;
      }

      // ── GLOBAL LOADER ─────────────────────────────────────────────────────────────
      function showLoader() {
        document.getElementById("global-loader").classList.add("active");
      }
      function hideLoader() {
        document.getElementById("global-loader").classList.remove("active");
      }

      // ── TOAST ─────────────────────────────────────────────────────────────────────
      function toast(msg, type = "error") {
        const c = document.getElementById("toast-container");
        const el = document.createElement("div");
        el.className = `toast ${type}`;
        el.textContent = msg;
        c.appendChild(el);
        setTimeout(() => {
          el.style.opacity = "0";
          el.style.transition = "opacity .3s";
          setTimeout(() => el.remove(), 300);
        }, 3800);
      }

      // ── HELPERS ───────────────────────────────────────────────────────────────────
      function esc(s) {
        return s == null
          ? ""
          : String(s)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
      }

      function fmtMoney(n) {
        if (n == null) return "—";
        return Number(n).toLocaleString("uz-UZ") + " so'm";
      }

      function fmtTime(str) {
        if (!str) return "—";
        const p = str.split(":");
        return p.length >= 2 ? `${p[0]}:${p[1]}` : str;
      }

      const DAY_MAP = {
        monday: "Dushanba",
        tuesday: "Seshanba",
        wednesday: "Chorshanba",
        thursday: "Payshanba",
        friday: "Juma",
        saturday: "Shanba",
        sunday: "Yakshanba",
        dushanba: "Dushanba",
        seshanba: "Seshanba",
        chorshanba: "Chorshanba",
        payshanba: "Payshanba",
        juma: "Juma",
        shanba: "Shanba",
        yakshanba: "Yakshanba",
      };
      function fmtDays(str) {
        if (!str) return '<span style="color:var(--text-muted)">—</span>';
        return str
          .split(",")
          .map((d) => {
            const name = DAY_MAP[d.trim().toLowerCase()] || d.trim();
            return `<span class="day-chip">${esc(name)}</span>`;
          })
          .join("");
      }

      async function handleApiError(r) {
        if (!r) return;
        try {
          const err = await r.json();
          if (Array.isArray(err.detail)) {
            err.detail.forEach((e) => toast(e.msg || JSON.stringify(e)));
          } else {
            toast(err.detail || `Xatolik: ${r.status}`);
          }
        } catch {
          toast(`Server xatoligi: ${r.status}`);
        }
      }

      // ── CONFIRM MODAL ─────────────────────────────────────────────────────────────
      document
        .getElementById("confirm-cancel-btn")
        .addEventListener("click", closeConfirm);
      document
        .getElementById("confirm-ok-btn")
        .addEventListener("click", runConfirm);
      document
        .getElementById("confirm-overlay")
        .addEventListener("click", function (e) {
          if (e.target === this) closeConfirm();
        });

      function showConfirm(text, icon, okLabel, variant, cb) {
        document.getElementById("confirm-text").textContent = text;
        document.getElementById("confirm-icon").textContent = icon;
        const btn = document.getElementById("confirm-ok-btn");
        btn.textContent = okLabel;
        btn.className = `btn-confirm-ok ${variant === "primary" ? "is-primary" : "is-danger"}`;
        confirmCallback = cb;
        document.getElementById("confirm-overlay").classList.add("active");
      }

      function closeConfirm() {
        document.getElementById("confirm-overlay").classList.remove("active");
        confirmCallback = null;
      }

      function runConfirm() {
        const cb = confirmCallback;
        closeConfirm();
        if (typeof cb === "function") cb();
      }

      // ── LOAD TEACHER ──────────────────────────────────────────────────────────────
      async function loadTeacher() {
        if (!TEACHER_ID || isNaN(TEACHER_ID)) {
          renderError(400, "Teacher ID ko'rsatilmagan");
          return;
        }
        showLoader();
        const r = await apiFetch(`${BASE}/teacher/info/${TEACHER_ID}`);
        hideLoader();
        if (!r) return;
        if (r.status === 404) {
          renderError(404, "O'qituvchi topilmadi");
          return;
        }
        if (!r.ok) {
          await handleApiError(r);
          return;
        }
        teacherData = await r.json();
        renderPage();
      }

      function renderError(code, msg) {
        document.getElementById("content-area").innerHTML =
          `<div class="error-state"><div class="err-code">${code}</div><div class="err-msg">${esc(msg)}</div></div>`;
      }

      // ── RENDER PAGE ───────────────────────────────────────────────────────────────
      function renderPage() {
        const t = teacherData.teacher;
        document.getElementById("page-title").textContent =
          `${t.first_name} ${t.last_name}`;
        document.getElementById("delete-teacher-btn").style.display = "flex";
        document.getElementById("content-area").innerHTML =
          buildTeacherInfoCard(t) + buildGroupsSection(teacherData.groups);
      }

      function pencilSvg() {
        return `<svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <path d="M11.5 2.5a1.5 1.5 0 012.12 2.12l-8.5 8.5-3 .88.88-3 8.5-8.5z"
          stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
      }

      // ── TEACHER INFO CARD ─────────────────────────────────────────────────────────
      function buildTeacherInfoCard(t) {
        return `
  <div class="info-combined">
    <div class="info-combined-header">
      <span>👨‍🏫</span>
      <span>O'qituvchi ma'lumotlari</span>
    </div>
    <div class="info-panels">
      <div class="info-panel">
        <div class="info-panel-title">
          Shaxsiy ma'lumotlar
          <button class="edit-icon-btn" onclick="toggleNameEdit()" title="Tahrirlash">
            ${pencilSvg()}
          </button>
        </div>
        <div class="edit-static" id="name-static">
          <div class="info-row">
            <div class="info-label">Tizim ID (User ID)</div>
            <div class="info-value mono" id="disp-userid">${esc(t.user_id)}</div>
          </div>
          <div class="info-row">
            <div class="info-label">Ism</div>
            <div class="info-value" id="disp-firstname">${esc(t.first_name)}</div>
          </div>
          <div class="info-row">
            <div class="info-label">Familiya</div>
            <div class="info-value" id="disp-lastname">${esc(t.last_name)}</div>
          </div>
        </div>
        <div class="edit-form" id="name-form">
          <div class="info-label" style="margin-bottom:4px">Ism</div>
          <input class="edit-input" id="inp-firstname" placeholder="Ism" maxlength="50"
            value="${esc(t.first_name)}" onkeydown="if(event.key==='Enter') saveName()"/>
          <div class="info-label" style="margin-bottom:4px">Familiya</div>
          <input class="edit-input" id="inp-lastname" placeholder="Familiya" maxlength="50"
            value="${esc(t.last_name)}" onkeydown="if(event.key==='Enter') saveName()"/>
          <div class="edit-actions">
            <button class="btn-save" id="name-save-btn" onclick="saveName()">Saqlash</button>
            <button class="btn-cancel" onclick="cancelNameEdit()">Bekor qilish</button>
          </div>
        </div>
      </div>
      <div class="info-panel">
        <div class="info-panel-title">Moliya</div>
        <div class="info-row">
          <div class="info-label">Joriy oylik maosh</div>
          <div class="info-value mono" id="disp-salary" style="font-size: 15px; color: var(--success);">${fmtMoney(t.salary)}</div>
        </div>
        <div class="info-row" style="margin-top: 20px;">
          <div class="info-label" style="margin-bottom: 6px;">Maosh qo'shish (so'm)</div>
          <div style="display: flex; gap: 6px; align-items: center;">
            <input type="number" id="add-salary-input" class="pending-input" style="width: 120px;" placeholder="Summa..." min="1" max="100000000" onkeydown="if(event.key==='Enter') addSalary()"/>
            <button class="pending-btn" onclick="addSalary()" id="add-salary-btn">Qo'shish</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
      }

      // ── NAME EDIT ─────────────────────────────────────────────────────────────────
      function toggleNameEdit() {
        document.getElementById("name-static").classList.add("hidden");
        document.getElementById("name-form").classList.add("active");
        document.getElementById("inp-firstname").focus();
      }

      function cancelNameEdit() {
        document.getElementById("name-static").classList.remove("hidden");
        document.getElementById("name-form").classList.remove("active");
        document.getElementById("inp-firstname").value =
          teacherData.teacher.first_name;
        document.getElementById("inp-lastname").value =
          teacherData.teacher.last_name;
      }

      async function saveName() {
        const fn = document.getElementById("inp-firstname").value.trim();
        const ln = document.getElementById("inp-lastname").value.trim();
        if (!fn || fn.length > 50) {
          toast("Ism 1–50 ta belgi bo'lishi kerak");
          return;
        }
        if (!ln || ln.length > 50) {
          toast("Familiya 1–50 ta belgi bo'lishi kerak");
          return;
        }
        const btn = document.getElementById("name-save-btn");
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-sm"></span>';

        const params = new URLSearchParams({
          teacher_id: TEACHER_ID,
          first_name: fn,
          last_name: ln,
        });

        showLoader();
        const r = await apiFetch(
          `${BASE}/teacher/update_name/?${params.toString()}`,
          { method: "PATCH" },
        );
        hideLoader();

        btn.disabled = false;
        btn.textContent = "Saqlash";

        if (!r) return;
        if (!r.ok) {
          await handleApiError(r);
          return;
        }

        const d = await r.json();
        teacherData.teacher.first_name = d.first_name;
        teacherData.teacher.last_name = d.last_name;
        document.getElementById("disp-firstname").textContent = d.first_name;
        document.getElementById("disp-lastname").textContent = d.last_name;
        document.getElementById("page-title").textContent =
          `${d.first_name} ${d.last_name}`;
        cancelNameEdit();
        toast("Ism-familiya yangilandi ✓", "success");
      }

      // ── GROUPS SECTION ────────────────────────────────────────────────────────────
      function buildGroupsSection(groups) {
        let cards = "";
        if (!groups || groups.length === 0) {
          cards =
            '<div class="empty-state">Hozircha hech qanday guruh yo\'q</div>';
        } else {
          groups.forEach((g, index) => {
            cards += buildGroupCard(g, index + 1); // Guruhlarni 1 dan boshlab raqamlash
          });
        }
        return `
  <div class="groups-section-header">
    <div class="groups-section-title">Guruhlar (<span id="groups-count">${groups.length}</span>)</div>
  </div>
  <div id="groups-container">${cards}</div>`;
      }

      function buildGroupCard(g, index) {
        return `
  <div class="group-list-item" id="gcard-${g.group_id}">
    <div class="group-list-index">${index}.</div>
    <div class="group-list-name">
      <a href="group_info.html?id=${g.group_id}">${esc(g.name)}</a>
    </div>
    <div class="group-list-detail">${fmtMoney(g.price)}</div>
    <div class="group-list-detail">${esc(g.teacher_percent)}%</div>
  </div>`;
      }

      // ── DELETE TEACHER ────────────────────────────────────────────────────────────
      function askDeleteTeacher() {
        showConfirm(
          `${teacherData.teacher.first_name} ${teacherData.teacher.last_name} o'chirilsin? Bu amalni qaytarib bo'lmaydi.`,
          "🗑️",
          "Ha, o'chirish",
          "danger",
          deleteTeacher,
        );
      }
      async function deleteTeacher() {
        showLoader();
        const r = await apiFetch(`${BASE}/teacher/delete/${TEACHER_ID}`, {
          method: "DELETE",
        });
        hideLoader();
        if (!r) return;
        if (r.status === 204 || r.ok) {
          toast("O'qituvchi o'chirildi ✓", "success");
          setTimeout(() => goBackAfterDelete(), 800);
        } else {
          await handleApiError(r);
        }
      }

      // ── ADD SALARY ────────────────────────────────────────────────────────────────
      async function addSalary() {
        const input = document.getElementById("add-salary-input");
        const btn = document.getElementById("add-salary-btn");
        const price = parseInt(input.value, 10);

        if (isNaN(price) || price < 1 || price > 100000000) {
          toast("1 dan 100,000,000 gacha bo'lgan summa kiriting", "error");
          return;
        }

        showLoader();
        btn.disabled = true;

        const r = await apiFetch(
          `${BASE}/teacher/add_salary/?teacher_id=${TEACHER_ID}&price=${price}`,
          {
            method: "PATCH",
          },
        );

        hideLoader();
        btn.disabled = false;

        if (!r) return;
        if (!r.ok) {
          await handleApiError(r);
          return;
        }

        const data = await r.json();
        teacherData.teacher.salary = data.salary;
        document.getElementById("disp-salary").textContent = fmtMoney(
          data.salary,
        );
        input.value = "";
        toast("Maosh muvaffaqiyatli qo'shildi ✓", "success");
      }

      // ── EVENT LISTENERS ───────────────────────────────────────────────────────────
      document.getElementById("back-btn").addEventListener("click", goBack);
      document
        .getElementById("delete-teacher-btn")
        .addEventListener("click", askDeleteTeacher);
      document
        .getElementById("logout-btn")
        .addEventListener("click", authLogout);

      // ── INIT ──────────────────────────────────────────────────────────────────────
      (async () => {
        await loadTeacher();
      })();
    </script>
  </body>
</html>
