<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O'quvchi ma'lumotlari</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0f1117;
        --surface: #171b26;
        --surface2: #1e2333;
        --surface3: #242840;
        --border: #ffffff0f;
        --border2: #ffffff18;
        --border3: #ffffff25;
        --accent: #6c8ef5;
        --accent2: #a78bfa;
        --accent-glow: #6c8ef530;
        --text: #e8eaf0;
        --text-muted: #6b7280;
        --text-dim: #9ca3af;
        --success: #34d399;
        --warning: #fbbf24;
        --danger: #f87171;
        --sidebar-w: 240px;
        --topbar-h: 60px;
        --radius: 10px;
        --radius-sm: 6px;
        --radius-xs: 4px;
        --mono: "JetBrains Mono", monospace;
        --sans: "Outfit", sans-serif;
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 14px;
      }
      .layout {
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* SIDEBAR */
      .sidebar {
        width: var(--sidebar-w);
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        overflow-y: auto;
        scrollbar-width: none;
        position: relative;
        z-index: 10;
      }
      .sidebar::-webkit-scrollbar {
        display: none;
      }
      .sidebar::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
      }
      .logo-area {
        padding: 22px 20px 18px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .logo-circle {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 10px;
        box-shadow: 0 0 20px var(--accent-glow);
      }
      .logo-name {
        font-weight: 600;
        font-size: 15px;
      }
      .logo-sub {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 2px;
        letter-spacing: 0.3px;
      }
      .nav-section {
        flex: 1;
        padding: 10px 12px;
      }
      .nav-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--text-muted);
        padding: 14px 8px 6px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: var(--radius-sm);
        color: var(--text-dim);
        text-decoration: none;
        font-size: 13.5px;
        transition:
          background 0.15s,
          color 0.15s;
        position: relative;
      }
      .nav-item:hover {
        background: var(--surface2);
        color: var(--text);
      }
      .nav-item.active {
        background: var(--accent-glow);
        color: var(--accent);
        font-weight: 500;
      }
      .nav-item.active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 25%;
        bottom: 25%;
        width: 3px;
        border-radius: 2px;
        background: var(--accent);
      }
      .nav-icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .logout-area {
        padding: 12px;
        border-top: 1px solid var(--border);
        flex-shrink: 0;
      }
      .logout-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 10px;
        border-radius: var(--radius-sm);
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-muted);
        font-size: 13.5px;
        font-family: var(--sans);
        transition:
          background 0.15s,
          color 0.15s;
      }
      .logout-btn:hover {
        background: #f8717118;
        color: var(--danger);
      }

      /* MAIN */
      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-width: 0;
      }
      .topbar {
        height: var(--topbar-h);
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        flex-shrink: 0;
      }
      .topbar-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .back-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: var(--radius-sm);
        background: var(--surface2);
        border: 1px solid var(--border2);
        color: var(--text-dim);
        font-size: 13px;
        font-family: var(--sans);
        cursor: pointer;
        transition: 0.15s;
      }
      .back-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .page-title {
        font-size: 16px;
        font-weight: 600;
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .delete-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: var(--radius-sm);
        background: #f8717112;
        border: 1px solid #f8717130;
        color: var(--danger);
        font-size: 13px;
        font-family: var(--sans);
        cursor: pointer;
        transition: 0.15s;
        font-weight: 500;
      }
      .delete-btn:hover {
        background: #f8717122;
        border-color: var(--danger);
      }
      .admin-label {
        font-size: 13px;
        color: var(--text-muted);
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
      }
      #content-area {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        scrollbar-width: thin;
        scrollbar-color: var(--border2) transparent;
      }

      /* LOADING */
      .loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        min-height: 300px;
        color: var(--text-muted);
        font-size: 13px;
      }
      .spinner {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid var(--border2);
        border-top-color: var(--accent);
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .spinner-sm {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-top-color: var(--accent);
        animation: spin 0.7s linear infinite;
        display: inline-block;
        vertical-align: middle;
      }
      .pending-input {
        width: 64px;
        height: 28px;
        padding: 0 8px;
        border-radius: var(--radius-sm);
        background: var(--surface2);
        border: 1px solid #68A9F560;
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        outline: none;
        transition: border-color 0.15s;
        -moz-appearance: textfield;
      }
      .pending-input::-webkit-inner-spin-button,
      .pending-input::-webkit-outer-spin-button {
        -webkit-appearance: none;
      }
      .pending-input:focus {
        border-color: #68A9F5;
      }
      .pending-btn {
        height: 28px;
        padding: 0 12px;
        border-radius: var(--radius-sm);
        background: #68A9F515;
        border: 1px solid #68A9F5;
        color: #68A9F5;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.15s,
          color 0.15s;
        font-family: var(--sans);
        white-space: nowrap;
      }
      .pending-btn:hover:not(:disabled) {
        background: #68A9F5;
        color: #fff;
      }
      .pending-btn:disabled{
        opacity: 0.5;
        cursor: not-allowed;
      }
  

      /* INFO CARD */
      .info-combined {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 16px;
        overflow: hidden;
      }
      .info-combined-header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--surface2);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .info-combined-header span {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.6px;
      }
      .info-panels {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .info-panel {
        padding: 20px;
        position: relative;
      }
      .info-panel:first-child {
        border-right: 1px solid var(--border);
      }
      .info-panel-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-muted);
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .edit-icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-muted);
        padding: 3px 5px;
        border-radius: var(--radius-xs);
        transition: 0.15s;
        display: flex;
        align-items: center;
      }
      .edit-icon-btn:hover {
        color: var(--accent);
        background: var(--accent-glow);
      }
      .info-row {
        margin-bottom: 10px;
      }
      .info-label {
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 3px;
      }
      .info-value {
        font-size: 14px;
        color: var(--text);
        font-weight: 500;
      }
      .info-value.mono {
        font-family: var(--mono);
        font-size: 13px;
      }
      .info-empty {
        color: var(--text-muted);
        font-style: italic;
        font-size: 13px;
      }

      /* EDIT */
      .edit-form {
        display: none;
      }
      .edit-form.active {
        display: block;
      }
      .edit-static.hidden {
        display: none;
      }
      .edit-input {
        width: 100%;
        padding: 7px 10px;
        border-radius: var(--radius-sm);
        background: var(--surface3);
        border: 1px solid var(--border2);
        color: var(--text);
        font-family: var(--sans);
        font-size: 13.5px;
        outline: none;
        transition: border-color 0.15s;
        margin-bottom: 8px;
      }
      .edit-input:focus {
        border-color: var(--accent);
      }
      .edit-actions {
        display: flex;
        gap: 6px;
        margin-top: 4px;
      }
      .btn-save {
        padding: 5px 14px;
        border-radius: var(--radius-sm);
        background: var(--accent);
        border: none;
        color: #fff;
        font-size: 12.5px;
        font-weight: 600;
        font-family: var(--sans);
        cursor: pointer;
        transition: 0.15s;
      }
      .btn-save:hover:not(:disabled) {
        background: #5a7de8;
      }
      .btn-save:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-cancel {
        padding: 5px 12px;
        border-radius: var(--radius-sm);
        background: var(--surface2);
        border: 1px solid var(--border2);
        color: var(--text-dim);
        font-size: 12.5px;
        font-family: var(--sans);
        cursor: pointer;
        transition: 0.15s;
      }
      .btn-cancel:hover {
        border-color: var(--border3);
        color: var(--text);
      }

      /* GROUPS */
      .groups-section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .groups-section-title {
        font-size: 15px;
        font-weight: 600;
      }
      .add-group-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: var(--radius-sm);
        background: var(--accent-glow);
        border: 1px solid var(--accent);
        color: var(--accent);
        font-size: 13px;
        font-weight: 500;
        font-family: var(--sans);
        cursor: pointer;
        transition: 0.15s;
      }
      .add-group-btn:hover {
        background: var(--accent);
        color: #fff;
      }

      /* GROUP CARD */
      .group-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 14px;
        overflow: hidden;
        transition: opacity 0.3s;
      }
      .group-card-header {
        padding: 14px 18px;
        background: var(--surface2);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .group-name-block {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .group-card-name {
        font-size: 15px;
        font-weight: 600;
      }
      .group-link {
        color: var(--text);
        text-decoration: none;
        transition: color 0.15s;
      }
      .group-link:hover {
        color: var(--accent);
      }
      .group-card-meta {
        font-size: 11.5px;
        color: var(--text-muted);
      }
      .exclude-btn {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 5px 12px;
        border-radius: var(--radius-sm);
        background: #f8717112;
        border: 1px solid #f8717130;
        color: var(--danger);
        font-size: 12px;
        font-family: var(--sans);
        cursor: pointer;
        transition: 0.15s;
      }
      .exclude-btn:hover {
        background: #f8717120;
        border-color: var(--danger);
      }

      .group-card-body {
        padding: 18px;
      }
      .group-info-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 14px;
      }
      .gi-item {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 12px 14px;
      }
      .gi-label {
        font-size: 10.5px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.7px;
        color: var(--text-muted);
        margin-bottom: 5px;
      }
      .gi-value {
        font-size: 13.5px;
        color: var(--text);
        font-weight: 500;
      }
      .gi-value.mono {
        font-family: var(--mono);
      }
      .day-chip {
        display: inline-block;
        padding: 2px 9px;
        border-radius: 20px;
        background: var(--accent-glow);
        border: 1px solid var(--accent);
        color: var(--accent);
        font-size: 11px;
        font-weight: 600;
        margin: 2px 2px 0 0;
      }

      /* PAYMENT */
      .payment-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .payment-label {
        font-size: 11.5px;
        color: var(--text-muted);
        min-width: 130px;
      }
      .payment-date {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        margin-right: auto;
      }
      .pay-btn {
        height: 28px;
        padding: 0 12px;
        border-radius: var(--radius-sm);
        background: #34d39918;
        border: 1px solid #34d39940;
        color: var(--success);
        font-size: 12px;
        font-family: var(--sans);
        cursor: pointer;
        transition: 0.15s;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
      }
      .pay-btn:hover {
        background: #34d39928;
        border-color: var(--success);
      }
      .time-btn {
        height: 28px;
        padding: 0 12px;
        border-radius: var(--radius-sm);
        background: var(--surface3);
        border: 1px solid var(--border2);
        color: var(--text-dim);
        font-size: 12px;
        font-family: var(--sans);
        cursor: pointer;
        transition: 0.15s;
        display: inline-flex;
        align-items: center;
      }
      .time-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .inline-time-form {
        display: none;
        padding: 10px 14px;
        background: var(--surface3);
        border: 1px solid var(--border2);
        border-radius: var(--radius-sm);
        margin-bottom: 10px;
      }
      .inline-time-form.active {
        display: flex;
        gap: 12px;
        align-items: flex-end;
        flex-wrap: wrap;
      }
      .inline-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .inline-label {
        font-size: 11px;
        color: var(--text-muted);
      }
      .inline-input {
        padding: 6px 10px;
        border-radius: var(--radius-sm);
        background: var(--surface2);
        border: 1px solid var(--border2);
        color: var(--text);
        font-family: var(--mono);
        font-size: 12.5px;
        outline: none;
        transition: border-color 0.15s;
        width: 100px;
      }
      .inline-input:focus {
        border-color: var(--accent);
      }

      /* DISCOUNT */
      .discount-section {
        margin-top: 10px;
        padding: 14px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
      }
      .discount-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .discount-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.7px;
        color: var(--text-muted);
      }
      .discount-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .discount-type-badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 20px;
        font-size: 11.5px;
        font-weight: 600;
      }
      .dt-umumiy {
        background: #6c8ef520;
        color: var(--accent);
      }
      .dt-markaz {
        background: #34d39920;
        color: var(--success);
      }
      .no-discount {
        font-size: 12.5px;
        color: var(--text-muted);
        font-style: italic;
      }
      .discount-edit-form {
        display: none;
        margin-top: 10px;
      }
      .discount-edit-form.active {
        display: flex;
        gap: 8px;
        align-items: flex-end;
        flex-wrap: wrap;
      }
      .discount-select {
        padding: 6px 10px;
        border-radius: var(--radius-sm);
        background: var(--surface3);
        border: 1px solid var(--border2);
        color: var(--text);
        font-family: var(--sans);
        font-size: 12.5px;
        outline: none;
      }
      .discount-select:focus {
        border-color: var(--accent);
      }

      /* MODAL */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: #000a;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .modal-overlay.active {
        opacity: 1;
        pointer-events: all;
      }
      .modal {
        background: var(--surface);
        border: 1px solid var(--border2);
        border-radius: var(--radius);
        width: 420px;
        max-width: 90vw;
        max-height: 80vh;
        display: flex;
        flex-direction: column;
        transform: scale(0.96);
        transition: transform 0.2s;
      }
      .modal-overlay.active .modal {
        transform: scale(1);
      }
      .modal-header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }
      .modal-title {
        font-size: 15px;
        font-weight: 600;
      }
      .modal-close {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-muted);
        font-size: 18px;
        line-height: 1;
        padding: 2px 6px;
        border-radius: var(--radius-xs);
        transition: 0.15s;
      }
      .modal-close:hover {
        color: var(--text);
        background: var(--surface2);
      }
      .modal-search {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .modal-search-input {
        width: 100%;
        padding: 8px 12px;
        border-radius: var(--radius-sm);
        background: var(--surface2);
        border: 1px solid var(--border2);
        color: var(--text);
        font-family: var(--sans);
        font-size: 13.5px;
        outline: none;
        transition: border-color 0.15s;
      }
      .modal-search-input:focus {
        border-color: var(--accent);
      }
      .modal-body {
        overflow-y: auto;
        flex: 1;
        padding: 8px 0;
      }
      .modal-group-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        cursor: pointer;
        transition: background 0.12s;
        border-bottom: 1px solid var(--border);
      }
      .modal-group-item:last-child {
        border-bottom: none;
      }
      .modal-group-item:hover {
        background: var(--surface2);
      }
      .modal-group-item.selected {
        background: var(--accent-glow);
      }
      .modal-group-name {
        font-size: 13.5px;
        font-weight: 500;
      }
      .modal-group-check {
        width: 18px;
        height: 18px;
        border-radius: 4px;
        background: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: 0.15s;
      }
      .modal-group-item.selected .modal-group-check {
        opacity: 1;
      }
      .modal-footer {
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        flex-shrink: 0;
      }
      .modal-empty {
        padding: 32px;

        color: var(--text-muted);

      }

      /* CONFIRM MODAL */
      .confirm-modal {
        width: 360px;
      }
      .confirm-body {
        padding: 24px 20px 16px;
      }
      .confirm-icon {
        font-size: 32px;

        padding: 14px 20px;

      .btn-danger {
        padding: 7px 16px;
        border-radius: var(--radius-sm);

        border: 1px solid #f8717140;
        color: var(--danger);
        font-size: 13px;
        font-weight: 600;
        font-family: var(--sans);
        cursor: pointer;
        transition: 0.15s;
      }
      .btn-danger:hover {
        background: #f8717128;
        border-color: var(--danger);
      }
      .btn-neutral {
        padding: 7px 14px;
        border-radius: var(--radius-sm);
        background: var(--surface2);
        border: 1px solid var(--border2);
        color: var(--text-dim);
        font-size: 13px;
        font-family: var(--sans);
        cursor: pointer;
        transition: 0.15s;
      }
      .btn-neutral:hover {
        border-color: var(--border3);
        color: var(--text);
      }
      .btn-confirm-ok {
        padding: 7px 16px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 600;
        font-family: var(--sans);
        cursor: pointer;
        transition: 0.15s;
        border: none;
      }
      .btn-confirm-ok.is-danger {
        background: #f8717118;
        border: 1px solid #f8717140;
        color: var(--danger);
      }
      .btn-confirm-ok.is-danger:hover {
        background: #f8717128;
        border-color: var(--danger);
      }
      .btn-confirm-ok.is-primary {
        background: var(--accent);
        border: 1px solid var(--accent);
        color: #fff;
      }
      .btn-confirm-ok.is-primary:hover {
        background: #5a7de8;

      /* TOAST */
      #toast-container {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 100005;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }
      .toast {
        background: var(--surface2);
        border: 1px solid var(--border2);
        border-radius: var(--radius);
        padding: 16px 20px;
        font-size: 15px;
        color: var(--text);
        max-width: 400px;
        animation: toastIn 0.3s ease;
        pointer-events: all;
        box-shadow: 0 8px 32px #0008;
      }
      .toast.error {
        border-color: var(--danger);
        color: var(--danger);
      }
      .toast.success {
        border-color: var(--success);
        color: var(--success);
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(-12px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* MISC */

    <script>
      const BASE = "http://10.13.155.23:8000/api/v1";
      const urlParams = new URLSearchParams(window.location.search);
      const STUDENT_ID = parseInt(urlParams.get("id"));

      let studentData = null;
      let allGroups = [];
      let selectedGroupId = null;
      let confirmCallback = null;

      // ── REFERRER SAQLASH ─────────────────────────────────────────────────────────
      // Sahifaga birinchi kelganda referrer'ni sessionStorage'ga saqlaymiz
      // (chunki student_info → student_info redirect bo'lganda referrer o'zgarib ketadi)
      (function saveReferrer() {
        const key = `prev_page_${STUDENT_ID}`;
        // Faqat birinchi marta yoki student_info o'zi bo'lmagan holda saqlaymiz
        const stored = sessionStorage.getItem(key);
        const ref = document.referrer;
        const currentPath = location.pathname.split("/").pop();

        if (!stored) {
          // Referrer student_info emas va bo'sh emas bo'lsa saqlash
          if (ref && !ref.includes("student_info")) {
            sessionStorage.setItem(key, ref);
          } else if (!ref) {
            // Referrer yo'q — to'g'ridan-to'g'ri kirgan, students.html ni default qilamiz
            sessionStorage.setItem(key, "students.html");
          }
          // Agar referrer student_info bo'lsa — saqlangan qiymat bor bo'lishi kerak (yoki yo'q)
        }
        // Agar stored bor bo'lsa — uni ishlatamiz, o'zgartirmaymiz
      })();

      function getBackUrl() {
        const key = `prev_page_${STUDENT_ID}`;
        return sessionStorage.getItem(key) || "students.html";
      }

      function clearReferrer() {
        sessionStorage.removeItem(`prev_page_${STUDENT_ID}`);
      }

      // ── NAVIGATION ───────────────────────────────────────────────────────────────
      function goBack() {
        const backUrl = getBackUrl();
        clearReferrer();
        // Agar to'liq URL bo'lsa shu URL ga, aks holda relative path
        if (backUrl.startsWith("http")) {
          window.location.href = backUrl;
        } else {
          window.location.href = backUrl;
        }
      }

      function goBackAfterDelete() {
        const backUrl = getBackUrl();
        clearReferrer();
        // O'chirishdan keyin ham xuddi shu logika
        if (backUrl.startsWith("http")) {
          window.location.href = backUrl;
        } else {
          window.location.href = backUrl;
        }
      }

      // ── SIDEBAR ACTIVE ───────────────────────────────────────────────────────────
      // Qaysi sahifadan kelgan bo'lsa o'sha nav-item ni active qilamiz
      (function setActiveSidebar() {
        const backUrl = getBackUrl();
        const navItems = document.querySelectorAll(".nav-item");
        navItems.forEach((item) => {
          item.classList.remove("active");
        });
      })();

      if (!localStorage.getItem("access_token")) {
        window.location.replace("../index.html");
      }

      window.addEventListener("pageshow", function (event) {
        if (
          event.persisted ||
          (performance.getEntriesByType &&
            performance.getEntriesByType("navigation").length &&
            performance.getEntriesByType("navigation")[0].type ===
              "back_forward")
        ) {
          if (!localStorage.getItem("access_token")) {
            window.location.replace("../index.html");
          }
        }
      });

      // ── AUTH ─────────────────────────────────────────────────────────────────────
      const getToken = () => localStorage.getItem("access_token");
      const saveToken = (t) => localStorage.setItem("access_token", t);

      function authLogout() {
        const token = getToken();
        localStorage.clear();
        sessionStorage.clear();
        if (token) {
          fetch(`${BASE}/auth/logout`, {
            method: "POST",
            credentials: "include",
            keepalive: true,
            headers: { Authorization: `Bearer ${token}` },
          }).catch(() => {});
        }
        window.location.replace("../index.html");
      }

      async function tryRefresh() {
        try {
          const r = await fetch(`${BASE}/auth/refresh`, {
            method: "POST",
            credentials: "include",
          });
          if (!r.ok) throw 0;
          const d = await r.json();
          if (d.access_token) {
            saveToken(d.access_token);
            return d.access_token;
          }
          throw 0;
        } catch {
          authLogout();
          return null;
        }
      }

      async function apiFetch(url, opts = {}) {
        const token = getToken();
        const headers = {
          "Content-Type": "application/json",
          ...(opts.headers || {}),
        };
        if (token) headers["Authorization"] = `Bearer ${token}`;

        const go = (tok) => {
          const h = { ...headers };
          if (tok) h["Authorization"] = `Bearer ${tok}`;
          return fetch(url, { ...opts, credentials: "include", headers: h });
        };

        let res;
        try {
          res = await go(token);
        } catch (e) {
          toast(`Tarmoq xatoligi: ${e.message}`, "error");
          return null;
        }

        if (res.status === 401 || res.status === 403) {
          const nt = await tryRefresh();
          if (!nt) return null;
          try {
            res = await go(nt);
          } catch (e) {
            toast(`Tarmoq xatoligi: ${e.message}`, "error");
            return null;
          }
          if (res.status === 401 || res.status === 403) {
            authLogout();
            return null;
          }
        }
        return res;
      }

      // ── GLOBAL LOADER ─────────────────────────────────────────────────────────────
      function showLoader() {
        document.getElementById("global-loader").classList.add("active");
      }
      function hideLoader() {
        document.getElementById("global-loader").classList.remove("active");
      }

      // ── TOAST ─────────────────────────────────────────────────────────────────────
      function toast(msg, type = "error") {
        const c = document.getElementById("toast-container");
        const el = document.createElement("div");
        el.className = `toast ${type}`;
        el.textContent = msg;
        c.appendChild(el);
        setTimeout(() => {
          el.style.opacity = "0";
          el.style.transition = "opacity .3s";
          setTimeout(() => el.remove(), 300);
        }, 3800);
      }

      // ── HELPERS ───────────────────────────────────────────────────────────────────
      function esc(s) {
        return s == null
          ? ""
          : String(s)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
      }

      function fmtMoney(n) {
        if (n == null) return "—";
        return Number(n).toLocaleString("uz-UZ") + " so'm";
      }

      const UZ_MONTHS = [
        "yanvar",
        "fevral",
        "mart",
        "aprel",
        "may",
        "iyun",
        "iyul",
        "avgust",
        "sentabr",
        "oktabr",
        "noyabr",
        "dekabr",
      ];
      function fmtDate(str) {
        if (!str) return "—";
        const d = new Date(str);
        if (isNaN(d.getTime())) return str;
        return `${d.getDate()}-${UZ_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
      }

      function fmtTime(str) {
        if (!str) return "—";
        const p = str.split(":");
        return p.length >= 2 ? `${p[0]}:${p[1]}` : str;
      }

      const DAY_MAP = {
        monday: "Dushanba",
        tuesday: "Seshanba",
        wednesday: "Chorshanba",
        thursday: "Payshanba",
        friday: "Juma",
        saturday: "Shanba",
        sunday: "Yakshanba",
        dushanba: "Dushanba",
        seshanba: "Seshanba",
        chorshanba: "Chorshanba",
        payshanba: "Payshanba",
        juma: "Juma",
        shanba: "Shanba",
        yakshanba: "Yakshanba",
      };
      function fmtDays(str) {
        if (!str) return '<span style="color:var(--text-muted)">—</span>';
        return str
          .split(",")
          .map((d) => {
            const name = DAY_MAP[d.trim().toLowerCase()] || d.trim();
            return `<span class="day-chip">${esc(name)}</span>`;
          })
          .join("");
      }

      async function handleApiError(r) {
        if (!r) return;
        try {
          const err = await r.json();
          if (Array.isArray(err.detail)) {
            err.detail.forEach((e) => toast(e.msg || JSON.stringify(e)));
          } else {
            toast(err.detail || `Xatolik: ${r.status}`);
          }
        } catch {
          toast(`Server xatoligi: ${r.status}`);
        }
      }

      // ── CONFIRM MODAL ─────────────────────────────────────────────────────────────
      // FIX: onclick atributi o'rniga addEventListener ishlatamiz —
      // onclick="runConfirm()" deb yozilganda ba'zan confirmCallback ni
      // yo'qotib qo'yishi mumkin edi (inline event handler scope muammosi)
      document
        .getElementById("confirm-cancel-btn")
        .addEventListener("click", closeConfirm);
      document
        .getElementById("confirm-ok-btn")
        .addEventListener("click", runConfirm);
      document
        .getElementById("confirm-overlay")
        .addEventListener("click", function (e) {
          if (e.target === this) closeConfirm();
        });

      function showConfirm(text, icon, okLabel, variant, cb) {
        document.getElementById("confirm-text").textContent = text;
        document.getElementById("confirm-icon").textContent = icon;
        const btn = document.getElementById("confirm-ok-btn");
        btn.textContent = okLabel;
        btn.className = `btn-confirm-ok ${variant === "primary" ? "is-primary" : "is-danger"}`;
        confirmCallback = cb;
        document.getElementById("confirm-overlay").classList.add("active");
      }

      function closeConfirm() {
        document.getElementById("confirm-overlay").classList.remove("active");
        confirmCallback = null;
      }

      function runConfirm() {
        const cb = confirmCallback;
        closeConfirm(); // avval yopamiz, keyin callback — callback ichida ham showConfirm chaqirilishi mumkin
        if (typeof cb === "function") cb();
      }

      // ── LOAD STUDENT ──────────────────────────────────────────────────────────────
      async function loadStudent() {
        if (!STUDENT_ID || isNaN(STUDENT_ID)) {
          renderError(400, "Student ID ko'rsatilmagan");
          return;
        }
        const r = await apiFetch(`${BASE}/student/info/${STUDENT_ID}`);
        if (!r) return;
        if (r.status === 404) {
          renderError(404, "O'quvchi topilmadi");
          return;
        }
        if (!r.ok) {
          await handleApiError(r);
          return;
        }
        studentData = await r.json();
        renderPage();
      }

      function renderError(code, msg) {
        document.getElementById("content-area").innerHTML =
          `<div class="error-state"><div class="err-code">${code}</div><div class="err-msg">${esc(msg)}</div></div>`;
      }

      // ── NAME EDIT ─────────────────────────────────────────────────────────────────
      function toggleNameEdit() {
        document.getElementById("name-static").classList.add("hidden");
        document.getElementById("name-form").classList.add("active");
        document.getElementById("inp-firstname").focus();
      }
      function cancelNameEdit() {
        document.getElementById("name-static").classList.remove("hidden");
        document.getElementById("name-form").classList.remove("active");
        document.getElementById("inp-firstname").value =
          studentData.student.first_name;
        document.getElementById("inp-lastname").value =
          studentData.student.last_name;
      }
      async function saveName() {
        const fn = document.getElementById("inp-firstname").value.trim();
        const ln = document.getElementById("inp-lastname").value.trim();
        if (!fn || fn.length > 50) {
          toast("Ism 1–50 ta belgi bo'lishi kerak");
          return;
        }
        if (!ln || ln.length > 50) {
          toast("Familiya 1–50 ta belgi bo'lishi kerak");
          return;
        }
        const btn = document.getElementById("name-save-btn");
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-sm"></span>';
        const params = new URLSearchParams({ first_name: fn, last_name: ln });
        showLoader();
        const r = await apiFetch(
          `${BASE}/student/student_name/${STUDENT_ID}?${params}`,
          { method: "PATCH" },
        );
        hideLoader();
        btn.disabled = false;
        btn.textContent = "Saqlash";
        if (!r) return;
        if (!r.ok) {
          await handleApiError(r);
          return;
        }
        const d = await r.json();
        studentData.student.first_name = d.first_name;
        studentData.student.last_name = d.last_name;
        document.getElementById("disp-firstname").textContent = d.first_name;
        document.getElementById("disp-lastname").textContent = d.last_name;
        document.getElementById("page-title").textContent =
          `${d.first_name} ${d.last_name}`;
        cancelNameEdit();
        toast("Ism-familiya yangilandi ✓", "success");
      }

      // ── CONTACT EDIT ──────────────────────────────────────────────────────────────
      function toggleContactEdit() {
        document.getElementById("contact-static").classList.add("hidden");
        document.getElementById("contact-form").classList.add("active");
        document.getElementById("inp-stunum").focus();
      }
      function cancelContactEdit() {
        document.getElementById("contact-static").classList.remove("hidden");
        document.getElementById("contact-form").classList.remove("active");
        const c = studentData.contact;
        document.getElementById("inp-stunum").value = c.student_number || "";
        document.getElementById("inp-parnum").value =
          c.student_parent_number || "";
        document.getElementById("inp-stutg").value = c.student_telegram || "";
        document.getElementById("inp-partg").value =
          c.student_parent_telegram || "";
      }
      async function saveContact() {
        const stunum = document.getElementById("inp-stunum").value.trim();
        const parnum = document.getElementById("inp-parnum").value.trim();
        const stutg = document.getElementById("inp-stutg").value.trim();
        const partg = document.getElementById("inp-partg").value.trim();
        if (stunum.length > 20) {
          toast("O'quvchi raqami 20 belgidan oshmasin");
          return;
        }
        if (parnum.length > 20) {
          toast("Ota-ona raqami 20 belgidan oshmasin");
          return;
        }
        if (stutg.length > 30) {
          toast("O'quvchi Telegram 30 belgidan oshmasin");
          return;
        }
        if (partg.length > 30) {
          toast("Ota-ona Telegram 30 belgidan oshmasin");
          return;
        }
        const btn = document.getElementById("contact-save-btn");
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-sm"></span>';
        const body = {};
        if (stunum) body.student_num = stunum;
        if (parnum) body.student_parent_num = parnum;
        if (stutg) body.student_telegram = stutg;
        if (partg) body.student_parent_telegram = partg;
        showLoader();
        const r = await apiFetch(
          `${BASE}/student/student_contact/${STUDENT_ID}`,
          {
            method: "PATCH",
            body: JSON.stringify(body),
          },
        );
        hideLoader();
        btn.disabled = false;
        btn.textContent = "Saqlash";
        if (!r) return;
        if (!r.ok) {
          await handleApiError(r);
          return;
        }
        const d = await r.json();
        studentData.contact = d;
        const set = (id, val, empty) => {
          const el = document.getElementById(id);
          el.innerHTML = val
            ? esc(val)
            : `<span class="info-empty">${empty}</span>`;
        };
        set("disp-stunum", d.student_number, "—");
        set("disp-parnum", d.student_parent_number, "—");
        set("disp-stutg", d.student_telegram, "Kiritilmagan");
        set("disp-partg", d.student_parent_telegram, "Kiritilmagan");
        cancelContactEdit();
        toast("Kontakt ma'lumotlari yangilandi ✓", "success");
      }

      // ── DELETE STUDENT ────────────────────────────────────────────────────────────
      function askDeleteStudent() {
        showConfirm(
          `${studentData.student.first_name} ${studentData.student.last_name} o'chirilsin? Bu amalni qaytarib bo'lmaydi.`,
          "🗑️",
          "Ha, o'chirish",
          "danger",
          deleteStudent,
        );
      }
      async function deleteStudent() {
        showLoader();
        const r = await apiFetch(`${BASE}/student/delete/${STUDENT_ID}`, {
          method: "DELETE",
        });
        hideLoader();
        if (!r) return;
        if (r.status === 204 || r.ok) {
          toast("O'quvchi o'chirildi ✓", "success");
          setTimeout(() => goBackAfterDelete(), 800);
        } else {
          await handleApiError(r);
        }
      }

      // ── EXCLUDE GROUP ─────────────────────────────────────────────────────────────
      function askExcludeGroup(groupId, groupName) {
        showConfirm(
          `"${groupName}" guruhidan chiqarilsinmi?`,
          "⚠️",
          "Chiqarish",
          "danger",
          () => excludeGroup(groupId),
        );
      }
      async function excludeGroup(groupId) {
        showLoader();
        const r = await apiFetch(
          `${BASE}/student/exclusion_group/?student_id=${STUDENT_ID}&group_id=${groupId}`,
          { method: "DELETE" },
        );
        hideLoader();
        if (!r) return;
        if (!r.ok && r.status !== 204) {
          await handleApiError(r);
          return;
        }
        studentData.groups = (studentData.groups || []).filter(
          (g) => g.group_id !== groupId,
        );
        studentData.permissions = (studentData.permissions || []).filter(
          (p) => p.group_id !== groupId,
        );
        studentData.discounts = (studentData.discounts || []).filter(
          (d) => d.group_id !== groupId,
        );
        const card = document.getElementById(`gcard-${groupId}`);
        if (card) {
          card.style.opacity = "0";
          setTimeout(() => card.remove(), 300);
        }
        toast("Guruhdan chiqarildi ✓", "success");
      }

      // ── PENDING GROUP ─────────────────────────────────────────────────────────────
      async function submitPendingGroup(groupId) {
        const inp = document.getElementById(`pinp-${groupId}`);
        const days = parseInt(inp?.value);
        if (!days || days < 1) {
          toast("Iltimos, kunlar sonini kiriting (kamida 1)");
          return;
        }
        const cell = document.getElementById(`pcell-${groupId}`);
        const btn = cell?.querySelector(".pending-btn");
        if (btn) {
          btn.disabled = true;
          btn.textContent = "...";
        }
        showLoader();
        const r = await apiFetch(
          `${BASE}/dashboard/pending/?student_id=${STUDENT_ID}&group_id=${groupId}&days=${days}`,
          { method: "PATCH" },
        );
        hideLoader();
        if (btn) {
          btn.disabled = false;
          btn.textContent = "Kutish";
        }
        if (!r) return;
        if (r.status === 204 || r.ok) {
          toast("Kutish muvaffaqiyatli belgilandi ✓", "success");
          if (inp) inp.value = "";
          try {
            const d = await r.json();
            if (d && d.permission_date) {
              updatePermDate(groupId, d);
            }
          } catch (e) {}
        } else {
          await handleApiError(r);
        }
      }

      // ── PAYMENT ───────────────────────────────────────────────────────────────────
      function askPayment(groupId) {
        showConfirm(
          "Ushbu guruh uchun to'lov amalga oshirilsinmi?",
          "💳",
          "To'lovni tasdiqlash",
          "primary",
          () => doPayment(groupId),
        );
      }
      async function doPayment(groupId) {
        showLoader();
        const r = await apiFetch(
          `${BASE}/student/student_per_date/?student_id=${STUDENT_ID}&group_id=${groupId}`,
          { method: "PATCH" },
        );
        hideLoader();
        if (!r) return;
        if (!r.ok) {
          await handleApiError(r);
          return;
        }
        const d = await r.json();
        updatePermDate(groupId, d);
        toast("To'lov muvaffaqiyatli amalga oshirildi ✓", "success");
      }

      // ── TIME FORM ─────────────────────────────────────────────────────────────────
      function toggleTimeForm(groupId) {
        document.getElementById(`timef-${groupId}`).classList.toggle("active");
      }
      function askSetTime(groupId) {
        const days = parseInt(
          document.getElementById(`tinp-days-${groupId}`).value,
        );
        const price = parseInt(
          document.getElementById(`tinp-price-${groupId}`).value,
        );
        if (!days || days < 1) {
          toast("Kunlar sonini kiriting (kamida 1)");
          return;
        }
        if (isNaN(price) || price < 0) {
          toast("Narxni kiriting");
          return;
        }
        showConfirm(
          `${days} kun, ${fmtMoney(price)} miqdorida vaqt belgilansinmi?`,
          "📅",
          "Tasdiqlash",
          "primary",
          () => doSetTime(groupId, days, price),
        );
      }
      async function doSetTime(groupId, days, price) {
        showLoader();
        const r = await apiFetch(
          `${BASE}/student/student_per_date/?days=${days}&price=${price}&student_id=${STUDENT_ID}&group_id=${groupId}`,
          { method: "PATCH" },
        );
        hideLoader();
        if (!r) return;
        if (!r.ok) {
          await handleApiError(r);
          return;
        }
        const d = await r.json();
        updatePermDate(groupId, d);
        toggleTimeForm(groupId);
        document.getElementById(`tinp-days-${groupId}`).value = "";
        document.getElementById(`tinp-price-${groupId}`).value = "";
        toast("Vaqt muvaffaqiyatli belgilandi ✓", "success");
      }
      function updatePermDate(groupId, d) {
        if (!studentData.permissions) studentData.permissions = [];
        const idx = studentData.permissions.findIndex(
          (p) => p.group_id === groupId,
        );
        if (idx >= 0) Object.assign(studentData.permissions[idx], d);
        else studentData.permissions.push(d);
        const el = document.getElementById(`permdate-${groupId}`);
        if (el) el.textContent = fmtDate(d.permission_date);
      }

      // ── DISCOUNT EDIT ─────────────────────────────────────────────────────────────
      function toggleDiscountEdit(groupId) {
        document.getElementById(`disc-static-${groupId}`).style.display =
          "none";
        document.getElementById(`disc-form-${groupId}`).classList.add("active");
      }
      function cancelDiscountEdit(groupId) {
        document.getElementById(`disc-static-${groupId}`).style.display = "";
        document
          .getElementById(`disc-form-${groupId}`)
          .classList.remove("active");
      }
      async function saveDiscount(groupId, groupPrice) {
        const amount = parseInt(
          document.getElementById(`disc-inp-amount-${groupId}`).value,
        );
        const type = document.getElementById(`disc-inp-type-${groupId}`).value;
        if (isNaN(amount) || amount < 0 || amount > 100) {
          toast("Chegirma 0–100% orasida bo'lishi kerak");
          return;
        }
        const btn = document.getElementById(`disc-save-btn-${groupId}`);
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-sm"></span>';
        showLoader();
        const r = await apiFetch(
          `${BASE}/student/student_discount/?student_id=${STUDENT_ID}&group_id=${groupId}&discount=${amount}&discount_type=${type}`,
          { method: "PUT" },
        );
        hideLoader();
        btn.disabled = false;
        btn.textContent = "Saqlash";
        if (!r) return;
        if (!r.ok) {
          await handleApiError(r);
          return;
        }
        const d = await r.json();
        if (!studentData.discounts) studentData.discounts = [];
        const idx = studentData.discounts.findIndex(
          (x) => x.group_id === groupId,
        );
        if (idx >= 0) studentData.discounts[idx] = d;
        else studentData.discounts.push(d);
        const toPay =
          d.discount_amount > 0
            ? Math.round(groupPrice - (groupPrice * d.discount_amount) / 100)
            : groupPrice;
        document.getElementById(`disc-static-${groupId}`).innerHTML = `
    <div class="discount-grid">
      <div class="gi-item">
        <div class="gi-label">Chegirma miqdori</div>
        <div class="gi-value mono">${d.discount_amount}%</div>
      </div>
      <div class="gi-item">
        <div class="gi-label">Chegirma turi</div>
        <div class="gi-value">
          <span class="discount-type-badge dt-${esc(d.discount_type)}">${esc(d.discount_type)}</span>
        </div>
      </div>
      <div class="gi-item">
        <div class="gi-label">To'lov summasi</div>
        <div class="gi-value mono">${fmtMoney(toPay)}</div>
      </div>
    </div>`;
        cancelDiscountEdit(groupId);
        toast("Chegirma yanglandi ✓", "success");
      }

      // ── ADD GROUP MODAL ───────────────────────────────────────────────────────────
      // FIX: onclick atributi o'rniga addEventListener — modal tugmalari
      document
        .getElementById("group-modal-close-btn")
        .addEventListener("click", closeGroupModal);
      document
        .getElementById("group-modal-cancel-btn")
        .addEventListener("click", closeGroupModal);
      document
        .getElementById("group-add-confirm-btn")
        .addEventListener("click", confirmAddGroup);
      document
        .getElementById("group-search-input")
        .addEventListener("input", filterGroups);
      document
        .getElementById("group-modal-overlay")
        .addEventListener("click", function (e) {
          if (e.target === this) closeGroupModal();
        });

      async function openGroupModal() {
        selectedGroupId = null;
        document.getElementById("group-add-confirm-btn").disabled = true;
        document.getElementById("group-search-input").value = "";
        document.getElementById("group-modal-list").innerHTML =
          '<div class="modal-empty"><div class="spinner" style="margin:0 auto 8px"></div>Yuklanmoqda...</div>';
        document.getElementById("group-modal-overlay").classList.add("active");

        const r = await apiFetch(`${BASE}/group/all`);
        if (!r || !r.ok) {
          document.getElementById("group-modal-list").innerHTML =
            '<div class="modal-empty">Guruhlarni yuklashda xatolik</div>';
          return;
        }
        allGroups = await r.json();
        renderGroupList();
      }

      function renderGroupList() {
        const existingIds = new Set(
          (studentData.groups || []).map((g) => g.group_id),
        );
        const query = document
          .getElementById("group-search-input")
          .value.toLowerCase();
        const filtered = allGroups.filter(
          (g) =>
            !existingIds.has(g.group_id) &&
            g.name.toLowerCase().includes(query),
        );
        const list = document.getElementById("group-modal-list");
        if (!filtered.length) {
          list.innerHTML = '<div class="modal-empty">Guruh topilmadi</div>';
          return;
        }
        list.innerHTML = filtered
          .map(
            (g) => `
    <div class="modal-group-item ${selectedGroupId === g.group_id ? "selected" : ""}"
         onclick="selectModalGroup(${g.group_id})" id="mgi-${g.group_id}">
      <span class="modal-group-name">${esc(g.name)}</span>
      <div class="modal-group-check">
        <svg width="10" height="10" viewBox="0 0 12 12" fill="none">
          <path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>`,
          )
          .join("");
      }

      function filterGroups() {
        renderGroupList();
      }

      function selectModalGroup(id) {
        selectedGroupId = id;
        document.getElementById("group-add-confirm-btn").disabled = false;
        document
          .querySelectorAll(".modal-group-item")
          .forEach((el) => el.classList.remove("selected"));
        const el = document.getElementById(`mgi-${id}`);
        if (el) el.classList.add("selected");
      }

      function closeGroupModal() {
        document
          .getElementById("group-modal-overlay")
          .classList.remove("active");
        selectedGroupId = null;
      }

      async function confirmAddGroup() {
        if (!selectedGroupId) return;
        const btn = document.getElementById("group-add-confirm-btn");
        btn.disabled = true;
        btn.innerHTML = "<span class='spinner-sm'></span> Qo'shilmoqda...";
        showLoader();
        const r = await apiFetch(
          `${BASE}/student/add_group?student_id=${STUDENT_ID}&group_id=${selectedGroupId}`,
          { method: "POST" },
        );
        hideLoader();
        btn.disabled = false;
        btn.textContent = "Qo'shish";
        if (!r) return;
        if (!r.ok) {
          await handleApiError(r);
          closeGroupModal();
          return;
        }
        const d = await r.json();
        studentData.groups.push(d.group);
        if (d.student_per) {
          if (!studentData.permissions) studentData.permissions = [];
          studentData.permissions.push(d.student_per);
        }
        if (d.discount) {
          if (!studentData.discounts) studentData.discounts = [];
          studentData.discounts.push(d.discount);
        }
        const container = document.getElementById("groups-container");
        const emptyState = container.querySelector(".empty-state");
        if (emptyState) emptyState.remove();
        container.insertAdjacentHTML("beforeend", buildGroupCard(d.group));
        closeGroupModal();
        toast(`"${d.group.name}" guruhiga qo'shildi ✓`, "success");
      }

      // ── EVENT LISTENERS ───────────────────────────────────────────────────────────
      document.getElementById("back-btn").addEventListener("click", goBack);
      document
        .getElementById("delete-student-btn")
        .addEventListener("click", askDeleteStudent);
      document
        .getElementById("logout-btn")
        .addEventListener("click", authLogout);

      // ── INIT ──────────────────────────────────────────────────────────────────────
      (async () => {
        await loadStudent();
      })();
    </script>
  </body>
</html>
