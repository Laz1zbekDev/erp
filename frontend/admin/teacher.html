      /* UMUMIY STILLAR (create_student.html va group_info.html bilan bir xil) */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0f1117;
        --surface: #171b26;
        --surface2: #1e2333;
        --surface3: #242840;
        --border: #ffffff0f;
        --border2: #ffffff18;
        --border3: #ffffff25;
        --accent: #6c8ef5;
        --accent2: #a78bfa;
        --accent-glow: #6c8ef530;
        --text: #e8eaf0;
        --text-muted: #6b7280;
        --text-dim: #9ca3af;
        --success: #34d399;
        --warning: #fbbf24;
        --danger: #f87171;
        --sidebar-w: 240px;
        --topbar-h: 60px;
        --radius: 10px;
        --radius-sm: 6px;
        --radius-xs: 4px;
        --mono: "JetBrains Mono", monospace;
        --sans: "Outfit", sans-serif;
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 14px;
      }
      .layout {
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* SIDEBAR */
      .sidebar {
        width: var(--sidebar-w);
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        overflow-y: auto;
        scrollbar-width: none;
        position: relative;
        z-index: 10;
      }
      .sidebar::-webkit-scrollbar {
        display: none;
      }
      .sidebar::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
      }
      .logo-area {
        padding: 22px 20px 18px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .logo-circle {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 10px;
        box-shadow: 0 0 20px var(--accent-glow);
      }
      .logo-name {
        font-weight: 600;
        font-size: 15px;
      }
      .logo-sub {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 2px;
        letter-spacing: 0.3px;
      }
      .nav-section {
        flex: 1;
        padding: 10px 12px;
      }
      .nav-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--text-muted);
        padding: 14px 8px 6px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: var(--radius-sm);
        color: var(--text-dim);
        text-decoration: none;
        font-size: 13.5px;
        transition:
          background 0.15s,
          color 0.15s;
        position: relative;
      }
      .nav-item:hover {
        background: var(--surface2);
        color: var(--text);
      }
      .nav-item.active {
        background: var(--accent-glow);
        color: var(--accent);
        font-weight: 500;
      }
      .nav-item.active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 25%;
        bottom: 25%;
        width: 3px;
        border-radius: 2px;
        background: var(--accent);
      }
      .nav-icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .logout-area {
        padding: 12px;
        border-top: 1px solid var(--border);
        flex-shrink: 0;
      }
      .logout-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 10px;
        border-radius: var(--radius-sm);
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-muted);
        font-size: 13.5px;
        font-family: var(--sans);
        transition:
          background 0.15s,
          color 0.15s;
      }
      .logout-btn:hover {
        background: #f8717118;
        color: var(--danger);
      }

      /* MAIN CONTENT */
      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-width: 0;
      }
      .topbar {
        height: var(--topbar-h);
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        flex-shrink: 0;
      }
      .topbar-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .page-title {

        font-weight: 600;
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .admin-label {
        font-size: 13px;
        color: var(--text-muted);
      }
      .avatar {

        height: 34px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
      }

      #content-area {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        scrollbar-width: thin;
        scrollbar-color: var(--border2) transparent;
      }

      /* ACTION BAR */
      .action-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        gap: 16px;
        flex-wrap: wrap;
      }
      .search-box {
        display: flex;
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--border2);
        border-radius: 20px;
        overflow: hidden;
        width: 100%;
        max-width: 400px;
        transition: border-color 0.2s;
      }
      .search-box:focus-within {
        border-color: var(--accent);
      }
      .search-input {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text);
        padding: 10px 16px;
        font-family: var(--sans);
        font-size: 14px;

      }
      .search-btn {

        border: none;
        border-left: 1px solid var(--border2);
        color: var(--text-dim);
        padding: 0 20px;
        align-self: stretch;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:

          color 0.2s;
      }
      .search-btn:hover {
        background: var(--surface3);
        color: var(--text);

      .create-btn {

      /* TABLE */

        overflow: hidden;

      .page-btn {

        background: var(--surface2);

        color: var(--text-dim);
        font-size: 13px;
        font-family: var(--sans);
        cursor: pointer;
        transition: 0.15s;
        white-space: nowrap;
      }
      .page-btn:hover:not(:disabled) {
        background: var(--accent-glow);
        border-color: var(--accent);
        color: var(--accent);
      }
      .page-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .page-nums {
        display: flex;
        gap: 4px;
      }
      .page-num {
        width: 30px;
        height: 30px;
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text-dim);
        font-size: 13px;
        cursor: pointer;
        transition: 0.15s;
      }
      .page-num.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .page-num:hover:not(.active) {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* LOADER & TOAST */
      .global-loader-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 17, 23, 0.6);
        backdrop-filter: blur(3px);
        z-index: 100000;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .global-loader-overlay.active {
        opacity: 1;
        pointer-events: all;
      }
      .global-spinner {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: 3px solid var(--border2);
        border-top-color: var(--accent);
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #toast-container {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }
      .toast {
        background: var(--surface2);
        border: 1px solid var(--border2);
        border-radius: var(--radius);
        padding: 12px 16px;
        font-size: 13px;
        color: var(--text);
        max-width: 340px;
        animation: toastIn 0.2s ease;
        pointer-events: all;
        box-shadow: 0 8px 32px #0008;
      }
      .toast.error {
        border-color: var(--danger);
        color: var(--danger);
      }
      .toast.success {
        border-color: var(--success);
        color: var(--success);
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>

    <script>
      const BASE = "http://10.13.155.23:8000/api/v1";

      let currentPage = 1;
      const limit = 20;
      let searchQuery = "";

      // AUTH & INIT
      if (!localStorage.getItem("access_token"))
        window.location.replace("../index.html");
      const getToken = () => localStorage.getItem("access_token");
      const saveToken = (t) => localStorage.setItem("access_token", t);

      function authLogout() {
        const token = getToken();
        localStorage.clear();
        sessionStorage.clear();
        if (token)
          fetch(`${BASE}/auth/logout`, {
            method: "POST",
            credentials: "include",
            headers: { Authorization: `Bearer ${token}` },
          }).catch(() => {});
        window.location.replace("../index.html");
      }

      async function tryRefresh() {
        try {
          const r = await fetch(`${BASE}/auth/refresh`, {
            method: "POST",
            credentials: "include",
          });
          if (!r.ok) throw 0;
          const d = await r.json();
          if (d.access_token) {
            saveToken(d.access_token);
            return d.access_token;
          }
          throw 0;
        } catch {
          authLogout();
          return null;
        }
      }

      async function apiFetch(url, opts = {}) {
        const token = getToken();
        const headers = {
          "Content-Type": "application/json",
          ...(opts.headers || {}),
        };
        if (token) headers["Authorization"] = `Bearer ${token}`;

        const go = (tok) =>
          fetch(url, {
            ...opts,
            credentials: "include",
            headers: { ...headers, Authorization: `Bearer ${tok}` },
          });

        let res;
        try {
          res = await go(token);
        } catch (e) {
          toast(`Tarmoq xatoligi: ${e.message}`, "error");
          return null;
        }

        if (res.status === 401 || res.status === 403) {
          const nt = await tryRefresh();
          if (!nt) return null;
          try {
            res = await go(nt);
          } catch (e) {
            return null;
          }
          if (res.status === 401 || res.status === 403) {
            authLogout();
            return null;
          }
        }
        return res;
      }

      // UI HELPERS
      function showLoader() {
        document.getElementById("global-loader").classList.add("active");
      }
      function hideLoader() {
        document.getElementById("global-loader").classList.remove("active");
      }
      function toast(msg, type = "error") {
        const c = document.getElementById("toast-container");
        const el = document.createElement("div");
        el.className = `toast ${type}`;
        el.textContent = msg;
        c.appendChild(el);
        setTimeout(() => {
          el.style.opacity = "0";
          setTimeout(() => el.remove(), 300);
        }, 3800);
      }
      function esc(s) {
        return s == null
          ? ""
          : String(s)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
      }

      function formatMoney(amount) {
        if (amount == null) return "0 so'm";
        return Number(amount).toLocaleString("uz-UZ") + " so'm";
      }

      function formatDate(isoString) {
        if (!isoString) return "—";
        const d = new Date(isoString);
        if (isNaN(d.getTime())) return isoString;

        const months = [
          "yanvar", "fevral", "mart", "aprel", "may", "iyun",
          "iyul", "avgust", "sentabr", "oktabr", "noyabr", "dekabr"
        ];

        return `${d.getDate()}-${months[d.getMonth()]} ${d.getFullYear()}-yil`;
      }

      // DATA FETCHING & RENDER
      async function loadTeachers() {
        showLoader();
        const offset = (currentPage - 1) * limit;
        let url = `${BASE}/teacher/?limit=${limit}&offset=${offset}`;

        if (searchQuery.trim() !== "") {
          url = `${BASE}/teacher/search?search=${encodeURIComponent(searchQuery)}&limit=${limit}&offset=${offset}`;
        }

        const r = await apiFetch(url);
        hideLoader();

        if (!r) return;
        if (!r.ok) {
          toast(`Xatolik: ${r.status}`);
          return;
        }
        const data = await r.json();
        renderTable(data.teachers || []);
        renderPagination(data.teacher_num || 0);
      }

      function renderTable(teachers) {
        const tbody = document.getElementById("teachers-tbody");
        if (!teachers.length) {
          tbody.innerHTML = `<tr class="empty-row"><td colspan="4">Hech qanday o'qituvchi topilmadi</td></tr>`;
          return;
        }

        const offset = (currentPage - 1) * limit;

        tbody.innerHTML = teachers
          .map(
            (t, index) => `
          <tr>
            <td class="date-cell">${offset + index + 1}</td>
            <td>
              <a href="teacher_info.html?id=${t.teacher_id}" class="teacher-link">
                ${esc(t.first_name)} ${esc(t.last_name)}
              </a>
            </td>
            <td class="salary-cell">${formatMoney(t.salary)}</td>
            <td class="date-cell">${formatDate(t.created_at)}</td>
          </tr>
        `,
          )
          .join("");
      }

      function renderPagination(totalCount) {
        const totalPages = Math.max(1, Math.ceil(totalCount / limit));
        const pag = document.getElementById("pagination");

        const start = totalCount > 0 ? (currentPage - 1) * limit + 1 : 0;
        const end = Math.min(currentPage * limit, totalCount);

        let nums = "";
        for (
          let i = Math.max(1, currentPage - 2);
          i <= Math.min(totalPages, currentPage + 2);
          i++
        ) {
          nums += `<button class="page-num ${i === currentPage ? "active" : ""}" onclick="changePage(${i})">${i}</button>`;
        }

        pag.innerHTML = `
          <span class="page-info">${start}–${end} / ${totalCount} ta</span>
          <button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage <= 1 ? "disabled" : ""}>← Oldingi</button>
          <div class="page-nums">${nums}</div>
          <button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage >= totalPages ? "disabled" : ""}>Keyingi →</button>
        `;
      }

      function changePage(page) {
        currentPage = page;
        loadTeachers();
      }

      function doSearch() {
        searchQuery = document.getElementById("search-input").value.trim();
        currentPage = 1;
        loadTeachers();
      }

      // INIT
      (async () => {
        await loadTeachers();
      })();
    </script>
  </body>
</html>
