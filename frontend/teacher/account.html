<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O'qituvchi — Hisob sozlamalari</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap");

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #f5f4f0;
        --surface: #ffffff;
        --surface2: #efede8;
        --border: #e2e0da;
        --text: #1a1917;
        --muted: #7a786f;
        --accent: #2d6a4f;
        --accent-bg: #eaf4ee;
        --accent2: #b7410e;
        --accent2-bg: #fdf0eb;
        --nav-h: 64px;
        --font: "DM Sans", sans-serif;
        --mono: "DM Mono", monospace;
        --radius: 14px;
        --radius-sm: 8px;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.07), 0 4px 16px rgba(0, 0, 0, 0.05);

        --panel-bg: #1e3d2f;
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
        font-family: var(--font);
        color: var(--text);
        overflow: hidden;
      }

      /* ═══════════════════════════════════════
     DESKTOP WRAPPER
  ═══════════════════════════════════════ */
      @media (min-width: 900px) {
        body {
          background: var(--panel-bg);
          display: flex;
          align-items: stretch;
          min-height: 100vh;
          overflow: hidden;
        }
        .side-panel {
          flex: 1;
          background: var(--panel-bg);
          position: relative;
          overflow: hidden;
        }
        .side-panel::before {
          content: "";
          position: absolute;
          inset: 0;
          background:
            radial-gradient(
              ellipse 60% 50% at 50% 0%,
              rgba(45, 106, 79, 0.35) 0%,
              transparent 70%
            ),
            radial-gradient(
              ellipse 40% 60% at 80% 100%,
              rgba(45, 106, 79, 0.2) 0%,
              transparent 60%
            );
          pointer-events: none;
        }
        .side-panel::after {
          content: "";
          position: absolute;
          inset: 0;
          background-image:
            linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
            linear-gradient(
              90deg,
              rgba(255, 255, 255, 0.04) 1px,
              transparent 1px
            );
          background-size: 40px 40px;
          pointer-events: none;
        }
        .phone-shell {
          width: 840px;
          flex-shrink: 0;
          height: 100vh;
          background: var(--bg);
          position: relative;
          overflow: hidden;
          box-shadow:
            0 0 0 1px rgba(0, 0, 0, 0.25),
            0 32px 80px rgba(0, 0, 0, 0.5),
            inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }
        .phone-shell::before {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 2px;
          background: linear-gradient(
            90deg,
            transparent,
            rgba(255, 255, 255, 0.3),
            transparent
          );
          z-index: 999;
          pointer-events: none;
        }
      }

      @media (max-width: 899px) {
        .side-panel {
          display: none;
        }
        .phone-shell {
          width: 100%;
          min-height: 100vh;
          height: 100vh;
          overflow: hidden;
        }
      }

      /* ── TOP HEADER ── */
      .top-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 200;
        height: 56px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
      }
      .header-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .header-logo {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .header-logo svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: #fff;
        stroke-width: 2;
        stroke-linecap: round;
      }
      .header-name {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      .header-sub {
        font-size: 11px;
        color: var(--muted);
      }
      .logout-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: transparent;
        cursor: pointer;
        font-family: var(--font);
        font-size: 13px;
        color: var(--muted);
        transition:
          background 0.15s,
          color 0.15s,
          border-color 0.15s;
      }
      .logout-btn:hover {
        background: var(--accent2-bg);
        color: var(--accent2);
        border-color: var(--accent2);
      }
      .logout-btn svg {
        width: 15px;
        height: 15px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
      }

      /* ── SCROLLABLE INNER ── */
      .phone-inner {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .main {
        height: 100%;
        overflow-y: auto;
        padding-top: calc(56px + 20px);
        padding-bottom: calc(var(--nav-h) + 20px);
        padding-left: 16px;
        padding-right: 16px;
      }

      /* ── ACCOUNT FORM ── */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        box-shadow: var(--shadow);
      }
      .card-title {
        font-size: 18px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 20px;
        letter-spacing: -0.02em;
      }
      .form-group {
        margin-bottom: 16px;
      }
      .form-label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .input-wrap {
        position: relative;
        display: flex;
        align-items: center;
      }
      .form-input {
        width: 100%;
        padding: 12px 40px 12px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        font-family: var(--font);
        font-size: 14px;
        color: var(--text);
        outline: none;
        transition: border-color 0.15s;
      }
      .form-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.1);
      }
      .eye-btn {
        position: absolute;
        right: 10px;
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .eye-btn svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .eye-btn:hover {
        color: var(--text);
      }

      .btn-submit {
        width: 100%;
        padding: 14px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: var(--radius-sm);
        font-family: var(--font);
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: opacity 0.15s;
        margin-top: 10px;
      }
      .btn-submit:hover {
        opacity: 0.9;
      }
      .btn-submit:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .error-text {
        color: var(--accent2);
        font-size: 12px;
        font-weight: 500;
        margin-top: 4px;
        display: none;
      }
      .error-text.active {
        display: block;
      }
      .form-input.error {
        border-color: var(--accent2);
      }

      /* ── BOTTOM NAV ── */
      .bottom-nav {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 200;
        height: var(--nav-h);
        background: var(--surface);
        border-top: 1px solid var(--border);
        display: flex;
      }
      .nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        cursor: pointer;
        text-decoration: none;
        color: var(--muted);
        transition: color 0.15s;
        padding: 8px 4px;
        -webkit-tap-highlight-color: transparent;
      }
      .nav-item.active {
        color: var(--accent);
      }
      .nav-item svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .nav-item.active svg {
        stroke-width: 2.2;
      }
      .nav-label {
        font-size: 10px;
        font-weight: 500;
      }
      .nav-item.active .nav-label {
        font-weight: 600;
      }

      /* ── GLOBAL LOADER OVERLAY ── */
      .global-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: rgba(26, 25, 23, 0.5);
        backdrop-filter: blur(2px);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .global-overlay.active {
        opacity: 1;
        pointer-events: all;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── TOAST NOTIFICATIONS ── */
      .toast-container {
        position: absolute;
        top: 70px;
        left: 16px;
        right: 16px;
        z-index: 300;
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: none;
      }
      .toast {
        background: var(--surface);
        color: var(--text);
        font-size: 14px;
        font-weight: 500;
        padding: 14px 16px;
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow);
        border-left: 4px solid var(--accent);
        pointer-events: auto;
        animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .toast.error {
        border-left-color: var(--accent2);
      }
      .toast svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }
      .toast.success svg {
        stroke: var(--accent);
      }
      .toast.error svg {
        stroke: var(--accent2);
      }
      @keyframes slideDown {
        from {
          transform: translateY(-20px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="side-panel"></div>

    <div class="phone-shell">
      <div class="phone-inner">
        <!-- TOASTS -->
        <div class="toast-container" id="toast-container"></div>

        <!-- TOP HEADER -->
        <header class="top-header">
          <div class="header-brand">
            <div class="header-logo">
              <svg viewBox="0 0 24 24">
                <path d="M12 2L2 7l10 5 10-5-10-5z" />
                <path d="M2 17l10 5 10-5" />
                <path d="M2 12l10 5 10-5" />
              </svg>
            </div>
            <div>
              <div class="header-name">O'quv Markazi</div>
              <div class="header-sub">Hisob sozlamalari</div>
            </div>
          </div>
          <button class="logout-btn" onclick="logout()">
            <svg viewBox="0 0 24 24">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            Chiqish
          </button>
        </header>

        <!-- MAIN -->
        <main class="main">
          <div class="card">
            <div class="card-title">Parolni o'zgartirish</div>
            <form id="password-form" onsubmit="submitForm(event)">
              <!-- Old Password -->
              <div class="form-group">
                <label class="form-label" for="old_password">Joriy parol</label>
                <div class="input-wrap">
                  <input
                    type="password"
                    id="old_password"
                    class="form-input"
                    placeholder="Eski parolni kiriting"
                  />
                  <button
                    type="button"
                    class="eye-btn"
                    onclick="toggleVisibility('old_password', this)"
                  >
                    <svg viewBox="0 0 24 24">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  </button>
                </div>
                <div class="error-text" id="err-old">
                  Joriy parol kamida 6 ta belgi bo'lishi kerak
                </div>
              </div>

              <!-- New Password -->
              <div class="form-group">
                <label class="form-label" for="new_password">Yangi parol</label>
                <div class="input-wrap">
                  <input
                    type="password"
                    id="new_password"
                    class="form-input"
                    placeholder="Yangi parolni kiriting"
                  />
                  <button
                    type="button"
                    class="eye-btn"
                    onclick="toggleVisibility('new_password', this)"
                  >
                    <svg viewBox="0 0 24 24">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  </button>
                </div>
                <div class="error-text" id="err-new">
                  Yangi parol kamida 6 ta belgi bo'lishi kerak
                </div>
              </div>

              <!-- Confirm Password -->
              <div class="form-group">
                <label class="form-label" for="confirm_password"
                  >Yangi parolni tasdiqlang</label
                >
                <div class="input-wrap">
                  <input
                    type="password"
                    id="confirm_password"
                    class="form-input"
                    placeholder="Yangi parolni qayta kiriting"
                  />
                  <button
                    type="button"
                    class="eye-btn"
                    onclick="toggleVisibility('confirm_password', this)"
                  >
                    <svg viewBox="0 0 24 24">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  </button>
                </div>
                <div class="error-text" id="err-conf">
                  Tasdiqlash paroli mos kelmadi
                </div>
              </div>

              <button type="submit" class="btn-submit" id="submit-btn">
                Parolni yangilash
              </button>
            </form>
          </div>
        </main>

        <!-- BOTTOM NAV -->
        <nav class="bottom-nav">
          <a class="nav-item" href="teacher_home.html">
            <svg viewBox="0 0 24 24">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            <span class="nav-label">Bosh sahifa</span>
          </a>
          <a class="nav-item" href="payments.html">
            <svg viewBox="0 0 24 24">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2" />
              <line x1="1" y1="10" x2="23" y2="10" />
            </svg>
            <span class="nav-label">To'lovlar</span>
          </a>
          <a class="nav-item" href="my_groups.html">
            <svg viewBox="0 0 24 24">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            <span class="nav-label">Guruhlarim</span>
          </a>
          <a class="nav-item" href="my_students.html">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"
              />
              <path d="M12 6v6l4 2" />
            </svg>
            <span class="nav-label">O'quvchilarim</span>
          </a>
          <a class="nav-item" href="discount.html">
            <svg viewBox="0 0 24 24">
              <path
                d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"
              />
              <line x1="7" y1="7" x2="7.01" y2="7" />
            </svg>
            <span class="nav-label">Chegirma</span>
          </a>
          <a class="nav-item active" href="account.html">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
            </svg>
            <span class="nav-label">Account</span>
          </a>
        </nav>

        <!-- GLOBAL LOADER OVERLAY -->
        <div class="global-overlay" id="global-overlay">
          <div class="spinner"></div>
        </div>
      </div>
    </div>

    <div class="side-panel"></div>

    <script>
      const API_BASE = "http://10.13.155.23:8000/api/v1";
      const REFRESH_API = `${API_BASE}/auth/refresh`;
      const LOGIN_PAGE = "../index.html";

      function goLogin() {
        window.location.href = LOGIN_PAGE;
      }
      function getToken() {
        return localStorage.getItem("access_token");
      }
      function setToken(t) {
        localStorage.setItem("access_token", t);
      }
      function logout() {
        localStorage.removeItem("access_token");
        goLogin();
      }

      async function refreshToken() {
        const resp = await fetch(REFRESH_API, {
          method: "POST",
          credentials: "include",
        });
        if (!resp.ok) throw new Error("Refresh failed");
        const data = await resp.json();
        setToken(data.access_token);
        return data.access_token;
      }

      function showToast(message, type = "success") {
        const container = document.getElementById("toast-container");
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        const icon =
          type === "success"
            ? `<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 6L9 17l-5-5"/></svg>`
            : `<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;

        toast.innerHTML = `${icon} <span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = "0";
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }

      function toggleVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
          input.type = "text";
          btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
        } else {
          input.type = "password";
          btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
        }
      }

      function resetErrors() {
        ["old_password", "new_password", "confirm_password"].forEach((id) => {
          document.getElementById(id).classList.remove("error");
        });
        ["err-old", "err-new", "err-conf"].forEach((id) => {
          document.getElementById(id).classList.remove("active");
        });
      }

      async function submitForm(e) {
        e.preventDefault();
        resetErrors();

        const oldPwd = document.getElementById("old_password").value;
        const newPwd = document.getElementById("new_password").value;
        const confPwd = document.getElementById("confirm_password").value;

        let hasError = false;

        if (oldPwd.length < 6) {
          document.getElementById("old_password").classList.add("error");
          document.getElementById("err-old").classList.add("active");
          hasError = true;
        }
        if (newPwd.length < 6) {
          document.getElementById("new_password").classList.add("error");
          document.getElementById("err-new").classList.add("active");
          hasError = true;
        }
        if (confPwd.length < 6 || newPwd !== confPwd) {
          document.getElementById("confirm_password").classList.add("error");
          document.getElementById("err-conf").classList.add("active");
          hasError = true;
        }

        if (hasError) return;

        let token = getToken();
        if (!token) {
          goLogin();
          return;
        }

        document.getElementById("global-overlay").classList.add("active");

        try {
          const params = new URLSearchParams({
            password: oldPwd,
            new_password: newPwd,
          });
          const url = `${API_BASE}/teacher/update_teacher_password?${params.toString()}`;

          let resp = await fetch(url, {
            method: "PATCH",
            headers: { Authorization: `Bearer ${token}` },
          });

          if (resp.status === 401) {
            try {
              token = await refreshToken();
            } catch {
              goLogin();
              return;
            }
            resp = await fetch(url, {
              method: "PATCH",
              headers: { Authorization: `Bearer ${token}` },
            });
          }

          if (resp.status === 204 || resp.ok) {
            showToast("Parol muvaffaqiyatli yangilandi", "success");
            document.getElementById("password-form").reset();
          } else {
            const errData = await resp.json().catch(() => ({}));
            showToast(
              errData.detail || "Parolni yangilashda xatolik yuz berdi",
              "error",
            );
          }
        } catch (err) {
          showToast("Internet bilan bog'liq muammo yuz berdi", "error");
        } finally {
          document.getElementById("global-overlay").classList.remove("active");
        }
      }
    </script>
  </body>
</html>
