<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O'quvchilarim — O'quv Markazi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #F5F4F0;
    --surface:   #FFFFFF;
    --surface2:  #EFEDE8;
    --border:    #E2E0DA;
    --text:      #1A1917;
    --muted:     #7A786F;
    --accent:    #2D6A4F;
    --accent-bg: #EAF4EE;
    --accent2:   #B7410E;
    --accent2-bg:#FDF0EB;
    --nav-h:     64px;
    --font:      'DM Sans', sans-serif;
    --mono:      'DM Mono', monospace;
    --radius:    14px;
    --radius-sm: 8px;
    --shadow:    0 1px 3px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.05);
    --panel-bg:  #1e3d2f;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: var(--font);
    color: var(--text);
    overflow: hidden;
  }

  /* ═══════════════ DESKTOP WRAPPER ═══════════════ */
  @media (min-width: 900px) {
    body {
      background: var(--panel-bg);
      display: flex;
      align-items: stretch;
      min-height: 100vh;
      overflow: hidden;
    }
    .side-panel {
      flex: 1;
      background: var(--panel-bg);
      position: relative;
      overflow: hidden;
    }
    .side-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(45,106,79,.35) 0%, transparent 70%),
        radial-gradient(ellipse 40% 60% at 80% 100%, rgba(45,106,79,.2) 0%, transparent 60%);
      pointer-events: none;
    }
    .side-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .phone-shell {
      width: 840px;
      flex-shrink: 0;
      height: 100vh;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(0,0,0,.25),
        0 32px 80px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.15);
    }
    .phone-shell::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent);
      z-index: 999;
      pointer-events: none;
    }
  }

  @media (max-width: 899px) {
    .side-panel { display: none; }
    .phone-shell { 
      width: 100%; 
      min-height: 100vh; 
      height: 100vh;
      overflow: hidden;
    }
  }

  /* ── TOP HEADER ── */
  .top-header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 200;
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
  }
  .header-brand { display: flex; align-items: center; gap: 10px; }
  .header-logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .header-logo svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; }
  .header-name { font-size: 15px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
  .header-sub  { font-size: 11px; color: var(--muted); }
  .logout-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: transparent; cursor: pointer;
    font-family: var(--font); font-size: 13px; color: var(--muted);
    transition: background .15s, color .15s, border-color .15s;
  }
  .logout-btn:hover { background: var(--accent2-bg); color: var(--accent2); border-color: var(--accent2); }
  .logout-btn svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; }

  /* ── SCROLLABLE INNER ── */
  .phone-inner {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  /* ── MAIN ── */
  .main {
    height: 100%;
    overflow-y: auto;
    padding-top: calc(56px + 16px);
    padding-bottom: calc(var(--nav-h) + 16px);
    padding-left: 16px; padding-right: 16px;
  }

  /* ── SUMMARY CARD ── */
  .summary-card {
    background: var(--accent);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(45,106,79,.3);
    display: flex; align-items: center; justify-content: space-between;
  }
  .summary-label { font-size: 12px; color: rgba(255,255,255,.65); margin-bottom: 4px; }
  .summary-total {
    font-size: 22px; font-weight: 700; color: #fff;
    font-family: var(--mono); letter-spacing: -.02em;
  }
  .summary-icon {
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(255,255,255,.15);
    display: flex; align-items: center; justify-content: center;
  }
  .summary-icon svg { width: 22px; height: 22px; stroke: #fff; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  /* ── SEARCH BOX ── */
  .search-wrap {
    position: relative;
    margin-bottom: 12px;
  }
  .search-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    pointer-events: none;
  }
  .search-icon svg { width: 16px; height: 16px; stroke: var(--muted); stroke-width: 2; fill: none; stroke-linecap: round; }
  .search-input {
    width: 100%;
    padding: 10px 36px 10px 38px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-family: var(--font); font-size: 14px; color: var(--text);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(45,106,79,.1); }
  .search-clear {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--surface2); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .search-clear:hover { background: var(--border); }
  .search-clear svg { width: 11px; height: 11px; stroke: var(--muted); stroke-width: 2.5; fill: none; stroke-linecap: round; }
  .search-clear.hidden { display: none; }

  /* ── GROUP FILTER CHIPS ── */
  .chips-wrap {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .chip {
    padding: 5px 12px; border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 12px; font-weight: 500; color: var(--muted);
    cursor: pointer; transition: all .15s;
    white-space: nowrap;
    font-family: var(--font);
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  .chip.active {
    background: var(--accent); color: #fff;
    border-color: var(--accent);
  }

  /* ── SECTION HEADER ── */
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-title { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .section-badge {
    font-size: 11px; font-weight: 500; font-family: var(--mono);
    background: var(--accent-bg); color: var(--accent);
    padding: 3px 9px; border-radius: 20px;
  }

  /* ── STUDENT CARD ── */
  .student-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
    animation: slideUp .25s ease both;
    display: flex; align-items: center; gap: 12px;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Avatar */
  .student-avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--accent-bg);
    border: 1.5px solid rgba(45,106,79,.2);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 15px; font-weight: 700; color: var(--accent);
    font-family: var(--mono);
    letter-spacing: -.02em;
  }

  /* Info */
  .student-info { flex: 1; min-width: 0; }
  .student-name {
    font-size: 15px; font-weight: 600; letter-spacing: -.02em;
    color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 2px;
  }
  .student-group {
    font-size: 11px; color: var(--accent); font-weight: 500;
    background: var(--accent-bg); border-radius: 4px;
    display: inline-block; padding: 1px 6px; margin-bottom: 6px;
  }
  .student-contacts { display: flex; flex-direction: column; gap: 3px; }
  .contact-row {
    display: flex; align-items: center; gap: 6px;
  }
  .contact-row svg { width: 12px; height: 12px; stroke: var(--muted); stroke-width: 2; fill: none; stroke-linecap: round; flex-shrink: 0; }
  .contact-label { font-size: 10px; color: var(--muted); min-width: 52px; }
  .contact-num {
    font-size: 12px; font-family: var(--mono); color: var(--text); font-weight: 500;
  }

  /* ── PAGINATION ── */
  .pagination {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; margin-top: 16px; margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .page-btn {
    width: 36px; height: 36px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-family: var(--mono); font-size: 13px; font-weight: 500;
    color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  .page-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .page-btn:disabled { opacity: .35; cursor: not-allowed; }
  .page-btn.arrow { font-size: 16px; }
  .page-info {
    text-align: center; font-size: 12px; color: var(--muted);
    margin-bottom: 4px; font-family: var(--mono);
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center; padding: 40px 20px;
    background: var(--surface); border: 1px dashed var(--border);
    border-radius: var(--radius);
  }
  .empty-icon {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--surface2); margin: 0 auto 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .empty-icon svg { width: 24px; height: 24px; stroke: var(--muted); stroke-width: 1.5; fill: none; }
  .empty-title { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
  .empty-sub   { font-size: 13px; color: var(--muted); }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 200;
    height: var(--nav-h);
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
    cursor: pointer; text-decoration: none;
    color: var(--muted); transition: color .15s;
    padding: 8px 4px;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-item.active { color: var(--accent); }
  .nav-item svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .nav-item.active svg { stroke-width: 2.2; }
  .nav-label { font-size: 10px; font-weight: 500; }
  .nav-item.active .nav-label { font-weight: 600; }

  /* ── LOADING / ERROR ── */
  .state-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 60vh; gap: 12px; text-align: center;
  }
  .spinner {
    width: 36px; height: 36px; border-radius: 50%;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state-text { font-size: 14px; color: var(--muted); }
  .retry-btn {
    margin-top: 8px; padding: 9px 20px;
    background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius-sm); font-family: var(--font);
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: opacity .15s;
  }
  .retry-btn:hover { opacity: .85; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="side-panel"></div>

<div class="phone-shell">
  <div class="phone-inner">

    <!-- TOP HEADER -->
    <header class="top-header">
      <div class="header-brand">
        <div class="header-logo">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </div>
        <div>
          <div class="header-name">O'quv Markazi</div>
          <div class="header-sub">O'quvchilarim</div>
        </div>
      </div>
      <button class="logout-btn" onclick="logout()">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Chiqish
      </button>
    </header>

    <!-- MAIN -->
    <main class="main">

      <!-- Loading -->
      <div id="loading-state" class="state-screen">
        <div class="spinner"></div>
        <div class="state-text">O'quvchilar yuklanmoqda…</div>
      </div>

      <!-- Error -->
      <div id="error-state" class="state-screen hidden">
        <div class="empty-icon" style="width:56px;height:56px;">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <div class="empty-title">Xatolik yuz berdi</div>
        <div class="state-text" id="error-msg">Ma'lumot yuklab bo'lmadi</div>
        <button class="retry-btn" onclick="fetchStudents()">Qayta urinish</button>
      </div>

      <!-- Content -->
      <div id="content" class="hidden">

        <!-- Summary -->
        <div class="summary-card">
          <div>
            <div class="summary-label">Jami o'quvchilar</div>
            <div class="summary-total" id="total-count">—</div>
          </div>
          <div class="summary-icon">
            <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
        </div>

        <!-- Search -->
        <div class="search-wrap">
          <div class="search-icon">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </div>
          <input
            class="search-input"
            id="search-input"
            type="text"
            placeholder="Ism yoki familiya bo'yicha qidirish…"
            oninput="onSearch(this.value)"
          >
          <button class="search-clear hidden" id="search-clear" onclick="clearSearch()">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <!-- Group filter chips -->
        <div class="chips-wrap" id="chips-wrap"></div>

        <!-- Section header -->
        <div class="section-header">
          <div class="section-title">O'quvchilar ro'yxati</div>
          <div class="section-badge" id="page-badge">—</div>
        </div>

        <!-- Students list -->
        <div id="students-list"></div>

        <!-- Pagination -->
        <div class="page-info" id="page-info"></div>
        <div class="pagination" id="pagination"></div>

      </div>
    </main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <a class="nav-item" href="teacher_home.html">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span class="nav-label">Bosh sahifa</span>
      </a>
      <a class="nav-item" href="payments.html">
        <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        <span class="nav-label">To'lovlar</span>
      </a>
      <a class="nav-item" href="my_groups.html">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="nav-label">Guruhlarim</span>
      </a>
      <a class="nav-item active" href="my_students.html">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M12 6v6l4 2"/></svg>
        <span class="nav-label">O'quvchilarim</span>
      </a>
      <a class="nav-item" href="discount.html">
        <svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
        <span class="nav-label">Chegirma</span>
      </a>
      <a class="nav-item" href="account.html">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        <span class="nav-label">Account</span>
      </a>
    </nav>

  </div>
</div>

<div class="side-panel"></div>

<script>
  const API_BASE      = 'http://127.0.0.1:8000/api/v1';
  const STUDENTS_API  = `${API_BASE}/teacher/teacher_students`;
  const REFRESH_API   = `${API_BASE}/auth/refresh`;
  const LOGIN_PAGE    = '../index.html';
  const LIMIT         = 20;

  // ── Global state ──────────────────────────────────────────
  let allStudents   = [];   // barcha o'quvchilar (tekis ro'yxat)
  let filtered      = [];   // hozirgi filter/qidiruv natijasi
  let currentPage   = 1;
  let activeGroup   = null; // null = barchasi
  let searchQuery   = '';

  // ── Auth ──────────────────────────────────────────────────
  function goLogin()   { window.location.href = LOGIN_PAGE; }
  function getToken()  { return localStorage.getItem('access_token'); }
  function setToken(t) { localStorage.setItem('access_token', t); }

  async function refreshToken() {
    const resp = await fetch(REFRESH_API, { method: 'POST', credentials: 'include' });
    if (!resp.ok) throw new Error('Refresh failed');
    const data = await resp.json();
    if (!data.access_token) throw new Error('No token');
    setToken(data.access_token);
    return data.access_token;
  }

  // ── UI state helpers ──────────────────────────────────────
  function showLoading() {
    document.getElementById('loading-state').classList.remove('hidden');
    document.getElementById('error-state').classList.add('hidden');
    document.getElementById('content').classList.add('hidden');
  }
  function showError(msg) {
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('error-state').classList.remove('hidden');
    document.getElementById('content').classList.add('hidden');
    document.getElementById('error-msg').textContent = msg || 'Xatolik yuz berdi';
  }
  function showContent() {
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('error-state').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');
  }

  // ── Fetch from API ────────────────────────────────────────
  async function fetchStudents() {
    showLoading();
    let token = getToken();
    if (!token) { goLogin(); return; }

    try {
      let resp = await fetch(STUDENTS_API, {
        headers: { Authorization: `Bearer ${token}` }
      });

      if (resp.status === 401) {
        try { token = await refreshToken(); }
        catch { goLogin(); return; }
        resp = await fetch(STUDENTS_API, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!resp.ok) { goLogin(); return; }
      }

      if (!resp.ok) { showError(`Server xatosi: ${resp.status}`); return; }

      const data = await resp.json();
      processData(data);

    } catch {
      showError("Internet bilan bog'liq muammo. Qayta urinib ko'ring.");
    }
  }

  // ── Process API response ──────────────────────────────────
  //
  // API dan kelgan ma'lumot tuzilishi:
  // { students_num: 6, groups: [ { group_id, name, students: [...] } ] }
  //
  // Biz uni "tekislashtiramiz" (flatten) — ya'ni barcha o'quvchilarni
  // bitta ro'yxatga qo'yamiz, har biriga guruh nomini qo'shgan holda.
  //
  // Bu xuddi kitob javonida har bir kitobga tegini yopishtirgandek:
  // "Bu kitob 3-javondan" deb bilasiz, javon bo'yicha filtrlay olasiz.

  function processData(data) {
    const groups = data.groups || [];

    // Tekislash (flatten): har bir o'quvchiga group_name qo'shamiz
    allStudents = [];
    groups.forEach(group => {
      (group.students || []).forEach(student => {
        allStudents.push({
          ...student,
          group_name: group.name,
          group_id:   group.group_id,
        });
      });
    });

    document.getElementById('total-count').textContent =
      `${data.students_num || allStudents.length} ta o'quvchi`;

    buildChips(groups);
    applyFilter();
    showContent();
  }

  // ── Build group filter chips ──────────────────────────────
  function buildChips(groups) {
    const wrap = document.getElementById('chips-wrap');
    wrap.innerHTML = '';

    // "Barchasi" chip
    const allChip = makeChip('Barchasi', true, () => setGroup(null));
    wrap.appendChild(allChip);

    groups.forEach(g => {
      const chip = makeChip(g.name, false, () => setGroup(g.group_id));
      chip.dataset.groupId = g.group_id;
      wrap.appendChild(chip);
    });
  }

  function makeChip(label, active, onClick) {
    const chip = document.createElement('div');
    chip.className = 'chip' + (active ? ' active' : '');
    chip.textContent = label;
    chip.addEventListener('click', onClick);
    return chip;
  }

  function setGroup(groupId) {
    activeGroup = groupId;
    currentPage = 1;

    // Chip holatini yangilash
    document.querySelectorAll('.chip').forEach((chip, i) => {
      if (i === 0) {
        chip.classList.toggle('active', groupId === null);
      } else {
        chip.classList.toggle('active', Number(chip.dataset.groupId) === groupId);
      }
    });

    applyFilter();
  }

  // ── Search handler ────────────────────────────────────────
  function onSearch(val) {
    searchQuery = val.trim();
    currentPage = 1;
    document.getElementById('search-clear').classList.toggle('hidden', !searchQuery);
    applyFilter();
  }

  function clearSearch() {
    document.getElementById('search-input').value = '';
    onSearch('');
  }

  // ── Apply filter + search ─────────────────────────────────
  //
  // Bu funksiya ikki bosqichda ishlaydi:
  // 1) Guruh filtri: agar guruh tanlangan bo'lsa, faqat shu guruhning o'quvchilari
  // 2) Qidiruv: nom bo'yicha kichik harfga o'tkazib taqqoslanadi (case-insensitive)
  //
  // Real hayot misoli: daftardan avval bo'limni topasiz (guruh),
  // so'ng o'sha bo'limdagi ismni ko'zdan kechirasiz (qidiruv).

  function applyFilter() {
    const q = searchQuery.toLowerCase();

    filtered = allStudents.filter(s => {
      // 1. Guruh filtri
      if (activeGroup !== null && s.group_id !== activeGroup) return false;

      // 2. Qidiruv (bo'sh bo'lsa o'tkazib yuboriladi)
      if (q) {
        const first = (s.first_name || '').toLowerCase();
        const last  = (s.last_name  || '').toLowerCase();
        const full1 = first + ' ' + last;  // "doniyor ismoilov"
        const full2 = last  + ' ' + first; // "ismoilov doniyor"
        // Quyidagilardan birortasi mos kelsa qabul qilinadi:
        if (!first.includes(q) && !last.includes(q) &&
            !full1.includes(q) && !full2.includes(q)) {
          return false;
        }
      }

      return true;
    });

    renderPage();
  }

  // ── Render current page ───────────────────────────────────
  function renderPage() {
    const totalPages = Math.ceil(filtered.length / LIMIT) || 1;
    if (currentPage > totalPages) currentPage = totalPages;

    const from  = (currentPage - 1) * LIMIT;
    const to    = from + LIMIT;
    const page  = filtered.slice(from, to);

    // Badge
    document.getElementById('page-badge').textContent =
      `${currentPage} / ${totalPages} sahifa`;

    // Page info
    const fromLabel = filtered.length === 0 ? 0 : from + 1;
    const toLabel   = Math.min(to, filtered.length);
    document.getElementById('page-info').textContent =
      filtered.length > 0 ? `${fromLabel}–${toLabel} / ${filtered.length} ta` : '';

    const list = document.getElementById('students-list');
    list.innerHTML = '';

    if (filtered.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </div>
          <div class="empty-title">O'quvchi topilmadi</div>
          <div class="empty-sub">Qidiruv yoki filtr natijasida hech narsa topilmadi</div>
        </div>`;
      renderPagination(0);
      return;
    }

    page.forEach((s, i) => {
      const card = document.createElement('div');
      card.className = 'student-card';
      card.style.animationDelay = `${i * 40}ms`;

      // Avatar uchun bosh harflar: "Doniyor Ismoilov" → "DI"
      const initials = getInitials(s.first_name, s.last_name);

      card.innerHTML = `
        <div class="student-avatar">${initials}</div>
        <div class="student-info">
          <div class="student-name">${escapeHtml(s.first_name)} ${escapeHtml(s.last_name)}</div>
          <div class="student-group">${escapeHtml(s.group_name)}</div>
          <div class="student-contacts">
            <div class="contact-row">
              <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.65 3.42 2 2 0 0 1 3.62 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.96a16 16 0 0 0 6.29 6.29l.95-.95a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7a2 2 0 0 1 1.72 2.02z"/></svg>
              <span class="contact-label">O'quvchi:</span>
              <span class="contact-num">${escapeHtml(s.contact?.student_number || '—')}</span>
            </div>
            <div class="contact-row">
              <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
              <span class="contact-label">Ota-onasi:</span>
              <span class="contact-num">${escapeHtml(s.contact?.student_parent_number || '—')}</span>
            </div>
          </div>
        </div>`;

      list.appendChild(card);
    });

    renderPagination(totalPages);
  }

  // ── Pagination ────────────────────────────────────────────
  function renderPagination(totalPages) {
    const container = document.getElementById('pagination');
    container.innerHTML = '';
    if (totalPages <= 1) return;

    const prevBtn = makePagBtn('‹', currentPage === 1, () => goPage(currentPage - 1));
    prevBtn.classList.add('arrow');
    container.appendChild(prevBtn);

    getPageNumbers(currentPage, totalPages).forEach(p => {
      if (p === '...') {
        const dots = document.createElement('div');
        dots.className = 'page-btn';
        dots.style.cursor = 'default';
        dots.textContent = '…';
        container.appendChild(dots);
      } else {
        const btn = makePagBtn(p, false, () => goPage(p));
        if (p === currentPage) btn.classList.add('active');
        container.appendChild(btn);
      }
    });

    const nextBtn = makePagBtn('›', currentPage === totalPages, () => goPage(currentPage + 1));
    nextBtn.classList.add('arrow');
    container.appendChild(nextBtn);
  }

  function goPage(page) {
    currentPage = page;
    renderPage();
    document.querySelector('.main').scrollTo({ top: 0, behavior: 'smooth' });
  }

  function makePagBtn(label, disabled, onClick) {
    const btn = document.createElement('button');
    btn.className = 'page-btn';
    btn.textContent = label;
    btn.disabled = disabled;
    if (!disabled) btn.addEventListener('click', onClick);
    return btn;
  }

  function getPageNumbers(current, total) {
    if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
    if (current <= 4)       return [1, 2, 3, 4, 5, '...', total];
    if (current >= total-3) return [1, '...', total-4, total-3, total-2, total-1, total];
    return [1, '...', current-1, current, current+1, '...', total];
  }

  // ── Utils ─────────────────────────────────────────────────
  function getInitials(first, last) {
    const f = (first || '').charAt(0).toUpperCase();
    const l = (last  || '').charAt(0).toUpperCase();
    return f + l;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function logout() {
    localStorage.removeItem('access_token');
    goLogin();
  }

  // ── Init ──────────────────────────────────────────────────
  fetchStudents();
</script>
</body>
</html>
