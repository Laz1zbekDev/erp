<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tranzaksiyalar — Superadmin</title>
  <style>
    @import url('<https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap>');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F5F4F0;
      --surface: #FFFFFF;
      --surface2: #EFEDE8;
      --border: #E2E0DA;
      --text: #1A1917;
      --muted: #7A786F;
      --accent: #2D6A4F;
      --accent-bg: #EAF4EE;
      --accent2: #B7410E;
      --accent2-bg: #FDF0EB;
      --warn: #C8850A;
      --warn-bg: #FEF6E4;
      --nav-h: 64px;
      --font: 'DM Sans', sans-serif;
      --mono: 'DM Mono', monospace;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.05);
      --panel-bg: #1e3d2f;
    }

    html, body {
      height: 100%;
      width: 100%;
      background: var(--bg);
      font-family: var(--font);
      color: var(--text);
      overflow: hidden;
      position: fixed; /* Butun ekran bo'ylab qotirib qo'yadi va ortiqcha siljishni yo'qotadi */
      inset: 0;
    }

    /* DESKTOP LAYOUT */
    @media (min-width: 900px) {
      body {
        background: var(--panel-bg);
        display: flex;
        align-items: stretch;
        min-height: 100vh;
        overflow: hidden;
      }
      .side-panel {
        flex: 1;
        background: var(--panel-bg);
        position: relative;
        overflow: hidden;
      }
      .side-panel::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(45,106,79,.35) 0%, transparent 70%),
          radial-gradient(ellipse at 80% 100%, rgba(45,106,79,.2) 0%, transparent 60%);
        pointer-events: none;
      }
      .side-panel::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
      }
      .phone-shell {
        width: 840px;
        flex-shrink: 0;
        height: 100vh;
        background: var(--bg);
        position: relative;
        overflow: hidden;
        box-shadow:
          0 0 0 1px rgba(0,0,0,.25),
          0 32px 80px rgba(0,0,0,.5),
          inset 0 1px 0 rgba(255,255,255,.15);
      }
      .phone-shell::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent);
        z-index: 999;
        pointer-events: none;
      }
    }

    @media (max-width: 899px) {
      .side-panel { display: none; }
      .phone-shell {
        width: 100%;
        height: 100%; /* min-height: 100vh o'rniga 100% yozing */
        position: relative;
        overflow: hidden;
      }
    }

    /* HEADER */
    .top-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 200;
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .header-brand { display: flex; align-items: center; gap: 10px; }
    .header-logo {
      width: 34px; height: 34px;
      border-radius: 9px;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .header-logo svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; }
    .header-name { font-size: 15px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
    .header-sub { font-size: 11px; color: var(--muted); }
    .header-badge { font-size: 11px; font-weight: 600; background: var(--accent); color: #fff; padding: 4px 10px; border-radius: 20px; }

    /* MAIN */
    .phone-inner { position: absolute; inset: 0; overflow: hidden; }
    .main {
      height: 100%;
      overflow-y: auto;
      padding-top: calc(56px + 16px);
      padding-bottom: calc(var(--nav-h) + 16px);
      padding-left: 16px;
      padding-right: 16px;
    }

    /* BOTTOM NAV */
    .bottom-nav {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 200;
      height: var(--nav-h);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
    }
    .nav-inner { display: flex; width: calc(100% - 80px); max-width: 500px; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; text-decoration: none; color: var(--muted); transition: color .15s; padding: 8px 4px; }
    .nav-item.active { color: var(--accent); }
    .nav-item svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.active svg { stroke-width: 2.2; }
    .nav-label { font-size: 10px; font-weight: 500; }
    .nav-item.active .nav-label { font-weight: 600; }

    /* FILTERS */
    .filter-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .filter-row {
      display: flex;
      gap: 10px;
    }
    @media (max-width: 600px) {
      .filter-row { flex-direction: column; }
    }
    .filter-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .filter-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
    .filter-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 13px;
      outline: none;
      background: var(--surface);
    }
    .filter-input:focus { border-color: var(--accent); }
    
    .filter-btn {
      padding: 10px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.2s;
    }
    .filter-btn:hover { opacity: 0.9; }

    /* TRANSACTIONS */
    .transaction-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
      animation: slideUp .25s both ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .tr-info { display: flex; flex-direction: column; gap: 4px; }
    .tr-admin { font-weight: 600; font-size: 14px; }
    .tr-date { font-size: 11px; color: var(--muted); }
    .tr-amount {
      font-weight: 700;
      font-size: 15px;
      font-family: var(--mono);
      color: var(--accent);
      background: var(--accent-bg);
      padding: 4px 10px;
      border-radius: 8px;
    }

    /* PAGINATION */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0 20px 0;
    }
    .page-btn {
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      color: var(--text);
    }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .page-info { font-size: 13px; font-weight: 500; color: var(--muted); }

    /* STATES */
    .state-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%; /* min-height: 60vh o'rniga 100% qo'yamiz */
      gap: 12px;
      text-align: center;
    }
    .spinner { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--accent); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-text { font-size: 14px; color: var(--muted); }
    .empty-icon { width: 52px; height: 52px; border-radius: 50%; background: var(--surface2); margin: 0 auto; display: flex; align-items: center; justify-content: center; }
    .empty-icon svg { width: 24px; height: 24px; stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .empty-title { font-size: 15px; font-weight: 500; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="side-panel"></div>

  <div class="phone-shell">
    <div class="phone-inner">

      <!-- HEADER -->
      <header class="top-header">
        <div class="header-brand">
          <div class="header-logo">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          </div>
          <div>
            <div class="header-name">O'quv Markazi</div>
            <div class="header-sub">Tranzaksiyalar</div>
          </div>
        </div>
        <div class="header-badge">Superadmin</div>
      </header>

      <!-- MAIN -->
      <main class="main" id="main-scroll">
        
        <!-- Filters -->
        <div class="filter-card">
          <div class="filter-row">
            <div class="filter-group">
              <label class="filter-label">Admin</label>
              <select class="filter-input" id="filter-admin">
                <option value="">Barchasi</option>
              </select>
            </div>
          </div>
          <div class="filter-row">
            <div class="filter-group">
              <label class="filter-label">Boshlang'ich sana</label>
              <input type="date" class="filter-input" id="filter-start">
            </div>
            <div class="filter-group">
              <label class="filter-label">Tugash sana</label>
              <input type="date" class="filter-input" id="filter-end">
            </div>
          </div>
          <button class="filter-btn" onclick="applyFilters()">Filtrlash</button>
        </div>

        <!-- Loading -->
        <div id="loading-state" class="state-screen">
          <div class="spinner"></div>
          <div class="state-text">Ma'lumotlar yuklanmoqda...</div>
        </div>

        <!-- Error -->
        <div id="error-state" class="state-screen hidden">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </div>
          <div class="empty-title">Xatolik yuz berdi</div>
          <div class="state-text" id="error-msg">Ma'lumot yuklanmadi</div>
          <button class="filter-btn" style="margin-top: 10px;" onclick="fetchTransactions()">Qayta urinish</button>
        </div>

        <!-- Content -->
        <div id="content" class="hidden">
          <div id="transactions-list"></div>
          
          <div class="pagination">
            <button class="page-btn" id="prev-btn" onclick="prevPage()">Oldingi</button>
            <span class="page-info" id="page-info">1 / 1</span>
            <button class="page-btn" id="next-btn" onclick="nextPage()">Keyingi</button>
          </div>
        </div>

      </main>

      <!-- BOTTOM NAV -->
      <nav class="bottom-nav">
        <div class="nav-inner">
          <a class="nav-item" href="superadmin_home.html">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span class="nav-label">Bosh sahifa</span>
          </a>
          <a class="nav-item" href="superadmin_admins.html">
            <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span class="nav-label">Adminlar</span>
          </a>
          <a class="nav-item active" href="superadmin_transactions.html">
            <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            <span class="nav-label">Tranzaksiyalar</span>
          </a>
          <a class="nav-item" href="superadmin_account.html">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            <span class="nav-label">Hisob</span>
          </a>
        </div>
      </nav>

    </div>
  </div>

  <div class="side-panel"></div>

  <script>
    const API_BASE = 'http://10.13.155.23:8000/api/v1';
    const LOGIN_PAGE = '../index.html';

    // ── AVTORIZATSIYA ─────────────────────────────────────────────────
    function getToken() { return localStorage.getItem('access_token'); }
    function goLogin() { window.location.href = LOGIN_PAGE; }

    async function authFetch(url, options = {}) {
      let token = getToken();
      if (!token) { goLogin(); throw new Error('Token yoq'); }

      let headers = { 'Authorization': `Bearer ${token}` };
      if (!(options.body instanceof FormData)) {
        headers['Content-Type'] = 'application/json';
      }
      options.headers = { ...options.headers, ...headers };

      let res = await fetch(url, options);
      if (res.status === 401) {
        goLogin();
        throw new Error('Unauthorized');
      }
      return res;
    }

    // ── UI HOLATLARI ──────────────────────────────────────────────────
    function showLoading() {
      document.getElementById('loading-state').classList.remove('hidden');
      document.getElementById('error-state').classList.add('hidden');
      document.getElementById('content').classList.add('hidden');
    }
    function showError(msg) {
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('error-state').classList.remove('hidden');
      document.getElementById('content').classList.add('hidden');
      document.getElementById('error-msg').textContent = msg || 'Xatolik yuz berdi';
    }
    function showContent() {
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('error-state').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function fmt(num) {
      if (num === null || num === undefined) return '0';
      return Number(num).toLocaleString('uz-UZ');
    }

    function formatDate(isoStr) {
      if (!isoStr) return '—';
      const d = new Date(isoStr);
      return d.toLocaleString('uz-UZ', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
      });
    }

    // ── O'ZGARUVCHILAR ────────────────────────────────────────────────
    let offset = 0;
    const limit = 20;
    let totalCount = 0;

    // ── API CHAQIRUVLARI ──────────────────────────────────────────────
    async function loadAdmins() {
      try {
        const resp = await authFetch(`${API_BASE}/admin/all_admins`);
        if (resp.ok) {
          const admins = await resp.json();
          const select = document.getElementById('filter-admin');
          admins.forEach(a => {
            const opt = document.createElement('option');
            opt.value = a.admin_id;
            opt.textContent = `${a.first_name} ${a.last_name}`;
            select.appendChild(opt);
          });
        }
      } catch (err) {
        console.error('Adminlarni yuklashda xatolik:', err);
      }
    }

    async function fetchTransactions() {
      showLoading();
      
      const adminId = document.getElementById('filter-admin').value;
      const start = document.getElementById('filter-start').value;
      const end = document.getElementById('filter-end').value;
      
      let url = `${API_BASE}/admin/transactions?limit=${limit}&offset=${offset}`;
      if (adminId) url += `&admin_id=${adminId}`;
      if (start) url += `&start=${start}T00:00:00`;
      if (end) url += `&end=${end}T23:59:59`;
      
      try {
        const resp = await authFetch(url);
        if (!resp.ok) throw new Error('Server xatosi: ' + resp.status);
        const data = await resp.json();
        
        totalCount = data.total_count;
        renderTransactions(data.transactions);
        updatePagination();
        
        showContent();
      } catch (err) {
        showError(err.message);
      }
    }

    // ── RENDER & PAGINATION ───────────────────────────────────────────
    function renderTransactions(transactions) {
      const list = document.getElementById('transactions-list');
      list.innerHTML = '';
      
      if (!transactions || transactions.length === 0) {
        list.innerHTML = `
          <div style="text-align:center;padding:40px 20px;background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);">
            <div class="empty-icon" style="margin-bottom:12px;">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            </div>
            <div class="empty-title">Tranzaksiyalar topilmadi</div>
          </div>`;
        return;
      }
      
      transactions.forEach((t, i) => {
        const item = document.createElement('div');
        item.className = 'transaction-card';
        item.style.animationDelay = `${i * 30}ms`;

        let adminName = 'Noma\\'
        if (t.admin) {
          adminName = `${escapeHtml(t.admin.first_name)} ${escapeHtml(t.admin.last_name)}`;
        }

        item.innerHTML = `
          <div class="tr-info">
            <div class="tr-admin">${adminName}</div>
            <div class="tr-date">${formatDate(t.created_at)}</div>
          </div>
          <div class="tr-amount">${fmt(t.amount)} so'm</div>
        `;
        list.appendChild(item);
      });
    }

    function updatePagination() {
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const pageInfo = document.getElementById('page-info');

      const currentPage = Math.floor(offset / limit) + 1;
      const totalPages = Math.ceil(totalCount / limit) || 1;

      pageInfo.textContent = `${currentPage} / ${totalPages}`;

      prevBtn.disabled = offset === 0;
      nextBtn.disabled = (offset + limit) >= totalCount;
    }

    function applyFilters() {
      offset = 0;
      fetchTransactions();
    }

    function prevPage() {
      if (offset >= limit) {
        offset -= limit;
        fetchTransactions();
      }
    }

    function nextPage() {
      if (offset + limit < totalCount) {
        offset += limit;
        fetchTransactions();
      }
    }

    // ── BOSHLASH ──────────────────────────────────────────────────────
    async function init() {
      await loadAdmins();
      await fetchTransactions();
    }

    init();
  </script>
</body>
</html>
