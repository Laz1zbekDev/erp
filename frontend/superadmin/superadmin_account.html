<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hisob — Superadmin</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap");

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #f5f4f0;
        --surface: #ffffff;
        --surface2: #efede8;
        --border: #e2e0da;
        --text: #1a1917;
        --muted: #7a786f;
        --accent: #2d6a4f;
        --accent-bg: #eaf4ee;
        --accent2: #b7410e;
        --accent2-bg: #fdf0eb;
        --nav-h: 64px;
        --font: "DM Sans", sans-serif;
        --mono: "DM Mono", monospace;
        --radius: 14px;
        --radius-sm: 8px;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.07), 0 4px 16px rgba(0, 0, 0, 0.05);
        --panel-bg: #1e3d2f;
      }

    html, body {
      height: 100%;
      width: 100%;
      background: var(--bg);
      font-family: var(--font);
      color: var(--text);
      overflow: hidden;
      position: fixed; /* Butun ekran bo'ylab qotirib qo'yadi va ortiqcha siljishni yo'qotadi */
      inset: 0;
    }

      /* ═══ DESKTOP LAYOUT ═══ */
      @media (min-width: 900px) {
        body {
          background: var(--panel-bg);
          display: flex;
          align-items: stretch;
          min-height: 100vh;
          overflow: hidden;
        }
        .side-panel {
          flex: 1;
          background: var(--panel-bg);
          position: relative;
          overflow: hidden;
        }
        .side-panel::before {
          content: "";
          position: absolute;
          inset: 0;
          background:
            radial-gradient(
              ellipse at 50% 0%,
              rgba(45, 106, 79, 0.35) 0%,
              transparent 70%
            ),
            radial-gradient(
              ellipse at 80% 100%,
              rgba(45, 106, 79, 0.2) 0%,
              transparent 60%
            );
          pointer-events: none;
        }
        .side-panel::after {
          content: "";
          position: absolute;
          inset: 0;
          background-image:
            linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
            linear-gradient(
              90deg,
              rgba(255, 255, 255, 0.04) 1px,
              transparent 1px
            );
          background-size: 40px 40px;
          pointer-events: none;
        }
        .phone-shell {
          width: 840px;
          flex-shrink: 0;
          height: 100vh;
          background: var(--bg);
          position: relative;
          overflow: hidden;
          box-shadow:
            0 0 0 1px rgba(0, 0, 0, 0.25),
            0 32px 80px rgba(0, 0, 0, 0.5),
            inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }
        .phone-shell::before {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 2px;
          background: linear-gradient(
            90deg,
            transparent,
            rgba(255, 255, 255, 0.3),
            transparent
          );
          z-index: 999;
          pointer-events: none;
        }
      }
      @media (max-width: 899px) {
        .side-panel { display: none; }
        .phone-shell {
          width: 100%;
          height: 100%; /* min-height: 100vh o'rniga 100% yozing */
          position: relative;
          overflow: hidden;
        }
      }

      /* ── HEADER ── */
      .top-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 200;
        height: 56px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
      }
      .header-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .header-logo {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .header-logo svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: #fff;
        stroke-width: 2;
        stroke-linecap: round;
      }
      .header-name {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      .header-sub {
        font-size: 11px;
        color: var(--muted);
      }

      .logout-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: transparent;
        cursor: pointer;
        font-family: var(--font);
        font-size: 13px;
        color: var(--muted);
        transition:
          background 0.15s,
          color 0.15s,
          border-color 0.15s;
      }
      .logout-btn:hover {
        background: var(--accent2-bg);
        color: var(--accent2);
        border-color: var(--accent2);
      }
      .logout-btn svg {
        width: 15px;
        height: 15px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
      }

      /* ── MAIN ── */
      .phone-inner {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .main {
        height: 100%;
        overflow-y: auto;
        padding-top: calc(56px + 16px);
        padding-bottom: calc(var(--nav-h) + 16px);
        padding-left: 16px;
        padding-right: 16px;
      }

      /* ── PROFILE CARD ── */
      .profile-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        margin-bottom: 24px;
        box-shadow: var(--shadow);
        display: flex;
        align-items: center;
        gap: 16px;
        animation: slideUp 0.3s ease both;
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .profile-avatar {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: var(--accent-bg);
        border: 1.5px solid rgba(45, 106, 79, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 700;
        color: var(--accent);
        flex-shrink: 0;
      }
      .profile-info {
        flex: 1;
        min-width: 0;
      }
      .profile-name {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin-bottom: 6px;
      }
      .profile-login {
        font-size: 13px;
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .profile-login-badge {
        font-family: var(--mono);
        font-size: 13px;
        background: var(--surface2);
        color: var(--text);
        padding: 3px 8px;
        border-radius: 6px;
        font-weight: 500;
      }

      /* ── SECTION HEADER ── */
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      /* ── FORMA ELEMENTLARI ── */
      .form-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px 16px;
        box-shadow: var(--shadow);
        animation: slideUp 0.3s ease both;
        animation-delay: 0.05s;
      }
      .form-group {
        margin-bottom: 16px;
      }
      .form-label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .input-wrap {
        position: relative;
      }
      .form-input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        font-family: var(--font);
        font-size: 14px;
        color: var(--text);
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
        padding-right: 42px;
      }
      .form-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.1);
      }
      .form-input.error {
        border-color: var(--accent2);
        box-shadow: 0 0 0 3px rgba(183, 65, 14, 0.1);
      }

      .toggle-eye {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: var(--muted);
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.15s;
      }
      .toggle-eye:hover {
        color: var(--text);
      }
      .toggle-eye svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
      }

      .field-error {
        font-size: 12px;
        color: var(--accent2);
        margin-top: 5px;
        display: none;
      }
      .field-error.show {
        display: block;
      }

      .btn-save {
        width: 100%;
        padding: 13px;
        border-radius: var(--radius-sm);
        font-family: var(--font);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        background: var(--accent);
        color: #fff;
        transition: opacity 0.15s;
        margin-top: 4px;
      }
      .btn-save:hover:not(:disabled) {
        opacity: 0.85;
      }
      .btn-save:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* ── BOTTOM NAV ── */
      .bottom-nav {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 200;
        height: var(--nav-h);
        background: var(--surface);
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: center;
      }
      .nav-inner {
        display: flex;
        width: calc(100% - 80px);
        max-width: 500px;
      }
      .nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        cursor: pointer;
        text-decoration: none;
        color: var(--muted);
        transition: color 0.15s;
        padding: 8px 4px;
        -webkit-tap-highlight-color: transparent;
      }
      .nav-item.active {
        color: var(--accent);
      }
      .nav-item svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .nav-item.active svg {
        stroke-width: 2.2;
      }
      .nav-label {
        font-size: 10px;
        font-weight: 500;
      }
      .nav-item.active .nav-label {
        font-weight: 600;
      }

      /* ══════════════════════════════════════
       MUVAFFAQIYAT OVERLAY (katta ✅)
    ══════════════════════════════════════ */
      .success-overlay {
        position: absolute;
        inset: 0;
        z-index: 400;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(26, 25, 23, 0.5);
        backdrop-filter: blur(4px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .success-overlay.show {
        opacity: 1;
        pointer-events: auto;
      }
      .success-circle {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        box-shadow: 0 8px 32px rgba(45, 106, 79, 0.45);
      }
      @keyframes popIn {
        from {
          transform: scale(0.4);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      .success-circle svg {
        width: 52px;
        height: 52px;
        stroke: #fff;
        stroke-width: 2.5;
        fill: none;
        stroke-linecap: round;
      }
      .success-label {
        margin-top: 18px;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        letter-spacing: -0.02em;
      }

      /* ── HOLAT EKRANLARI ── */
      .state-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%; /* min-height: 60vh o'rniga 100% qo'yamiz */
        gap: 12px;
        text-align: center;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .state-text {
        font-size: 14px;
        color: var(--muted);
      }
      .empty-icon {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: var(--surface2);
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .empty-icon svg {
        width: 24px;
        height: 24px;
        stroke: var(--muted);
        stroke-width: 1.5;
        fill: none;
      }
      .empty-title {
        font-size: 15px;
        font-weight: 500;
      }
      .btn-retry {
        margin-top: 6px;
        padding: 8px 16px;
        border-radius: var(--radius-sm);
        border: none;
        background: var(--accent);
        color: #fff;
        font-family: var(--font);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="side-panel"></div>

    <div class="phone-shell">
      <div class="phone-inner">
        <!-- HEADER -->
        <header class="top-header">
          <div class="header-brand">
            <div class="header-logo">
              <svg viewBox="0 0 24 24">
                <path d="M12 2L2 7l10 5 10-5-10-5z" />
                <path d="M2 17l10 5 10-5" />
                <path d="M2 12l10 5 10-5" />
              </svg>
            </div>
            <div>
              <div class="header-name">O'quv Markazi</div>
              <div class="header-sub">Superadmin paneli</div>
            </div>
          </div>
          <button class="logout-btn" onclick="logout()">
            <svg viewBox="0 0 24 24">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            Chiqish
          </button>
        </header>

        <!-- MAIN -->
        <main class="main" id="main-scroll">
          <!-- Loading -->
          <div id="loading-state" class="state-screen">
            <div class="spinner"></div>
            <div class="state-text">Ma'lumot yuklanmoqda...</div>
          </div>

          <!-- Error -->
          <div id="error-state" class="state-screen hidden">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
            </div>
            <div class="empty-title">Xatolik yuz berdi</div>
            <div class="state-text" id="error-msg">Ma'lumot yuklanmadi</div>
            <button class="btn-retry" onclick="fetchAccount()">
              Qayta urinish
            </button>
          </div>

          <!-- Content -->
          <div id="content" class="hidden">
            <!-- Profil ma'lumotlari -->
            <div class="profile-card">
              <div class="profile-avatar" id="prof-initials">—</div>
              <div class="profile-info">
                <div class="profile-name" id="prof-name">—</div>
                <div class="profile-login">
                  Login:
                  <span class="profile-login-badge" id="prof-login">—</span>
                </div>
              </div>
            </div>

            <!-- Parolni o'zgartirish formasi -->
            <div class="section-header">
              <div class="section-title">Parolni o'zgartirish</div>
            </div>

            <div class="form-card">
              <div class="form-group">
                <label class="form-label">Joriy parol</label>
                <div class="input-wrap">
                  <input
                    type="password"
                    class="form-input"
                    id="f-old"
                    placeholder="Eski parolni kiriting"
                    oninput="clearFieldError('f-old', 'err-old')"
                  />
                  <button
                    class="toggle-eye"
                    type="button"
                    onclick="toggleEye('f-old', 'eye-old')"
                  >
                    <svg id="eye-old" viewBox="0 0 24 24">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  </button>
                </div>
                <div class="field-error" id="err-old">
                  Kamida 6 ta belgi bo'lishi kerak
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Yangi parol</label>
                <div class="input-wrap">
                  <input
                    type="password"
                    class="form-input"
                    id="f-new"
                    placeholder="Kamida 6 ta belgi"
                    oninput="clearFieldError('f-new', 'err-new')"
                  />
                  <button
                    class="toggle-eye"
                    type="button"
                    onclick="toggleEye('f-new', 'eye-new')"
                  >
                    <svg id="eye-new" viewBox="0 0 24 24">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  </button>
                </div>
                <div class="field-error" id="err-new">
                  Kamida 6 ta belgi bo'lishi kerak
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Yangi parolni tasdiqlang</label>
                <div class="input-wrap">
                  <input
                    type="password"
                    class="form-input"
                    id="f-confirm"
                    placeholder="Parolni qaytadan kiriting"
                    oninput="clearFieldError('f-confirm', 'err-confirm')"
                  />
                  <button
                    class="toggle-eye"
                    type="button"
                    onclick="toggleEye('f-confirm', 'eye-confirm')"
                  >
                    <svg id="eye-confirm" viewBox="0 0 24 24">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  </button>
                </div>
                <div class="field-error" id="err-confirm">
                  Parollar mos kelmadi
                </div>
              </div>

              <!-- Umumiy server xatosi -->
              <div
                class="field-error"
                id="err-server"
                style="text-align: center; margin-bottom: 12px"
              ></div>

              <button
                class="btn-save"
                id="save-btn"
                onclick="submitChangePassword()"
              >
                Saqlash
              </button>
            </div>
          </div>
        </main>

        <!-- BOTTOM NAV -->
        <nav class="bottom-nav">
          <div class="nav-inner">
            <a class="nav-item" href="superadmin_home.html">
              <svg viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
              </svg>
              <span class="nav-label">Bosh sahifa</span>
            </a>
            <a class="nav-item" href="superadmin_admins.html">
              <svg viewBox="0 0 24 24">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
              </svg>
              <span class="nav-label">Adminlar</span>
            </a>
            <a class="nav-item" href="superadmin_transactions.html">
              <svg viewBox="0 0 24 24">
                <rect x="1" y="4" width="22" height="16" rx="2" ry="2" />
                <line x1="1" y1="10" x2="23" y2="10" />
              </svg>
              <span class="nav-label">Tranzaksiyalar</span>
            </a>
            <a class="nav-item active" href="superadmin_account.html">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
              </svg>
              <span class="nav-label">Hisob</span>
            </a>
          </div>
        </nav>

        <!-- MUVAFFAQIYAT OVERLAY -->
        <div class="success-overlay" id="success-overlay">
          <div class="success-circle">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" /></svg>
          </div>
          <div class="success-label">Muvaffaqiyatli!</div>
        </div>
      </div>
    </div>

    <div class="side-panel"></div>

    <script>
      const API_BASE = "http://127.0.0.1:8000/api/v1";
      const LOGIN_PAGE = "../index.html";

      function escapeHtml(s) {
        if (!s) return "";
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // ── AVTORIZATSIYA VA TOKEN YANGILASH ──────────────────────────────────────────
      function getToken() {
        return localStorage.getItem("access_token");
      }
      function setToken(t) {
        localStorage.setItem("access_token", t);
      }

      async function logout() {
        try {
          await fetch(`${API_BASE}/auth/logout`, {
            method: "POST",
            credentials: "omit",
          });
        } catch (e) {
          console.error("Logout API failed", e);
        }
        localStorage.removeItem("access_token");
        window.location.href = LOGIN_PAGE;
      }

      async function refreshToken() {
        const resp = await fetch(`${API_BASE}/auth/refresh`, {
          method: "POST",
          credentials: "omit",
        });
        if (!resp.ok) throw new Error("Refresh failed");
        const data = await resp.json();
        setToken(data.access_token);
        return data.access_token;
      }

      async function authFetch(url, options = {}) {
        let token = getToken();
        if (!token) {
          window.location.href = LOGIN_PAGE;
          return;
        }

        const headers = { Authorization: `Bearer ${token}` };
        if (!(options.body instanceof FormData))
          headers["Content-Type"] = "application/json";
        options.headers = { ...options.headers, ...headers };

        let res = await fetch(url, options);

        // Agar token eskirgan bo'lsa yangilaymiz
        if (res.status === 401) {
          try {
            token = await refreshToken();
            options.headers["Authorization"] = `Bearer ${token}`;
            res = await fetch(url, options);
          } catch (e) {
            logout();
            throw new Error("Unauthorized");
          }
        }
        return res;
      }

      // ── UI HOLATLARI ──────────────────────────────────────────────────
      function showLoading() {
        document.getElementById("loading-state").classList.remove("hidden");
        document.getElementById("error-state").classList.add("hidden");
        document.getElementById("content").classList.add("hidden");
      }
      function showError(msg) {
        document.getElementById("loading-state").classList.add("hidden");
        document.getElementById("error-state").classList.remove("hidden");
        document.getElementById("content").classList.add("hidden");
        document.getElementById("error-msg").textContent = msg;
      }
      function showContent() {
        document.getElementById("loading-state").classList.add("hidden");
        document.getElementById("error-state").classList.add("hidden");
        document.getElementById("content").classList.remove("hidden");
      }

      function showSuccessOverlay() {
        const ov = document.getElementById("success-overlay");
        ov.classList.add("show");
        setTimeout(() => ov.classList.remove("show"), 1600);
      }

      // ── MA'LUMOTLARNI YUKLASH ──────────────────────────────────────────
      async function fetchAccount() {
        showLoading();
        try {
          const resp = await authFetch(`${API_BASE}/admin/account`);
          if (!resp) return; // logout bo'lgan

          if (!resp.ok) throw new Error("Server xatosi: " + resp.status);

          const data = await resp.json();

          // Ekranga chizish
          const fName = data.first_name || "";
          const lName = data.last_name || "";
          const initials =
            ((fName[0] || "") + (lName[0] || "")).toUpperCase() || "S";

          document.getElementById("prof-initials").textContent = initials;
          document.getElementById("prof-name").textContent = escapeHtml(
            fName + " " + lName,
          );
          document.getElementById("prof-login").textContent = escapeHtml(
            data.user_id,
          );

          showContent();
        } catch (err) {
          showError(err.message || "Ma'lumot yuklanmadi");
        }
      }

      // ── PAROL FORMASI VA KO'ZCHALAR ───────────────────────────────────
      function toggleEye(inputId, svgId) {
        const inp = document.getElementById(inputId);
        const isHidden = inp.type === "password";
        inp.type = isHidden ? "text" : "password";

        const svg = document.getElementById(svgId);
        if (isHidden) {
          svg.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;
        } else {
          svg.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
        }
      }

      function showFieldError(inputId, errId, msg) {
        const inp = document.getElementById(inputId);
        const err = document.getElementById(errId);
        inp.classList.add("error");
        if (msg) err.textContent = msg;
        err.classList.add("show");
      }

      function clearFieldError(inputId, errId) {
        document.getElementById(inputId).classList.remove("error");
        document.getElementById(errId).classList.remove("show");
      }

      // ── PAROLNI O'ZGARTIRISH ──────────────────────────────────────────
      async function submitChangePassword() {
        const oldVal = document.getElementById("f-old").value;
        const newVal = document.getElementById("f-new").value;
        const confVal = document.getElementById("f-confirm").value;
        const serverErr = document.getElementById("err-server");
        serverErr.classList.remove("show");

        let valid = true;

        if (oldVal.length < 6) {
          showFieldError(
            "f-old",
            "err-old",
            "Kamida 6 ta belgi bo'lishi kerak",
          );
          valid = false;
        }
        if (newVal.length < 6) {
          showFieldError(
            "f-new",
            "err-new",
            "Kamida 6 ta belgi bo'lishi kerak",
          );
          valid = false;
        }
        if (newVal !== confVal) {
          showFieldError("f-confirm", "err-confirm", "Parollar mos kelmadi");
          valid = false;
        }

        if (!valid) return;

        const btn = document.getElementById("save-btn");
        btn.disabled = true;
        btn.textContent = "Kuting...";

        try {
          const params = new URLSearchParams({
            old_password: oldVal,
            new_password: newVal,
          });
          const resp = await authFetch(
            `${API_BASE}/admin/change_password_superadmin?${params}`,
            {
              method: "PUT",
            },
          );

          if (!resp) return; // logout bo'ldi

          if (
            resp.status === 400 ||
            resp.status === 422 ||
            resp.status === 404
          ) {
            const errData = await resp.json();
            serverErr.textContent = errData.detail || "Ma'lumotlar noto'g'ri";
            serverErr.classList.add("show");
            return;
          }
          if (!resp.ok) {
            serverErr.textContent = "Server xatosi: " + resp.status;
            serverErr.classList.add("show");
            return;
          }

          // 204 No Content -> Muvaffaqiyat!
          showSuccessOverlay();

          // Maydonlarni tozalash
          ["f-old", "f-new", "f-confirm"].forEach((id) => {
            const el = document.getElementById(id);
            el.value = "";
            el.type = "password";
          });
          // Ko'zchalarni asliga qaytarish
          ["eye-old", "eye-new", "eye-confirm"].forEach((id) => {
            document.getElementById(id).innerHTML =
              `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
          });
        } catch (err) {
          serverErr.textContent = err.message || "Ulanishda xatolik";
          serverErr.classList.add("show");
        } finally {
          btn.disabled = false;
          btn.textContent = "Saqlash";
        }
      }

      // Ishni boshlash
      fetchAccount();
    </script>
  </body>
</html>
